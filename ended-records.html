<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종결 아동 기록지 - 나무링크</title>
<style>
  :root{ --bg:#F5F4F2; --sf:#FFFFFF; --line:#ECE8E3; --tx:#2F2926; --dim:#A39C95;
         --cam:#B07A4A; --camL:#F8F1E8; --camB:#C9A27E; --sage:#4F7A5C; --coral:#C2553A; }
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg); margin:0; color:var(--tx); }
  .hd { background:var(--sf); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; }
  .hd img.lg { height:22px; display:block; }
  .hd .bar { width:1px; height:16px; background:var(--line); }
  .hd h1 { font-size:15px; font-weight:600; margin:0; }
  .hd .who { font-size:12px; color:var(--dim); }
  .hd .sp { flex:1 1 auto; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; }
  button { font:inherit; border-radius:8px; padding:6px 13px; font-size:13px; background:var(--sf); color:var(--tx); border:1px solid #E4E0DA; cursor:pointer; }
  button:hover { background:var(--camL); }
  button.grey { border-color:#D9C3A7; color:#7E5530; }
  .tools { display:flex; gap:14px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:12px; }
  .tab { border:none; border-bottom:2px solid transparent; border-radius:0; padding:4px 2px; color:var(--dim); background:none; }
  .tab.on { color:#7E5530; border-bottom-color:var(--cam); }
  .tab:hover { background:none; color:#7E5530; }
  input.q { font:inherit; font-size:13px; padding:6px 10px; border:1px solid #E4E0DA; border-radius:8px; min-width:200px; }
  .row { background:var(--sf); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .row .t1 { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .row .nm { font-weight:700; }
  .row .meta { font-size:13px; color:#6F6660; }
  .row .tag { font-size:11px; font-weight:600; color:var(--sage); border:1px solid #BFD3C4; background:#F1F7F2; border-radius:10px; padding:1px 8px; }
  .row .why { font-size:12px; color:var(--dim); }
  .mons { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .mons .lb { font-size:12px; color:var(--dim); margin-right:2px; }
  .mons a { font-size:13px; text-decoration:none; color:#7E5530; border:1px solid #E4D6C5; background:#FBF7F2; border-radius:8px; padding:3px 10px; }
  .mons a:hover { background:var(--camL); }
  .mons .none { font-size:12px; color:var(--dim); }
  .note { font-size:12px; color:var(--dim); margin:0 0 12px; line-height:1.7; }
  .err { background:var(--sf); border-left:3px solid var(--coral); padding:14px 16px; color:var(--coral); white-space:pre-wrap; }
  .load { text-align:center; padding:30px; color:var(--dim); }
</style>
</head>
<body>
<div class="hd">
  <img src="img/nl-logo.png" alt="" class="lg" onerror="this.style.display='none'">
  <span class="bar"></span>
  <h1>종결 아동 기록지</h1>
  <span class="who" id="who"></span>
  <span class="sp"></span>
  <button id="home" class="grey">처음으로</button>
</div>
<div class="wrap">
  <div id="body"><div class="load">불러오는 중…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nl-login.js"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: { storage: nlStore, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 종결 아동 기록지 (2026-11-09 은정님) — 대표 · 행정 · 데스크만
//   끝난 수업마다 한 줄 · 그 수업 기간의 기록지 달 · 누르면 새 탭에 보기 전용(&view=1)
//   선생님 화면에서는 끝난 지 두 달까지만 보이고, 그 뒤 기록지는 여기에 모임
//   다시 다니는 아동은 「지금 다님」 — 새 담당 선생님은 기록지 화면 「지난 기록지」로 봄
const KINDS = {
  dev: { nm: '발달', sups: [2], page: 'record-develop.html', extra: l => '' },
  sup: { nm: '누가', sups: [3, 4, 6, 7], page: 'record-support.html', extra: l => '&s=' + l.support_type_id },
  cen: { nm: '센터', sups: [1, 5], page: 'record-center.html', extra: l => (l.therapist_id != null ? '&t=' + l.therapist_id : '') }
};
const kindOf = st => Object.keys(KINDS).find(k => KINDS[k].sups.indexOf(Number(st)) >= 0) || null;
let ROWS = [], TAB = 'all', Q = '';
try { const o = JSON.parse(sessionStorage.getItem('nl_endrec') || 'null'); if (o) { TAB = o.tab || 'all'; Q = o.q || ''; } } catch (e) {}
function today() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
function ym(d) { return d ? String(d).slice(0, 7) : ''; }
function monTxt(k) { return k.slice(2, 4) + '년 ' + Number(k.slice(5, 7)) + '월'; }
async function readAll(q) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await q().range(from, from + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return out;
}
async function load() {
  const td = today();
  const [th, kids, sc, tt, st, logs] = await Promise.all([
    readAll(() => sb.from('nl_therapies').select('id, child_id, support_type_id, therapy_type_id, started_on, ended_on, end_cat, end_reason').order('id')),
    readAll(() => sb.from('nl_children').select('id, name, birth, status').order('id')),
    readAll(() => sb.from('nl_therapy_schedules').select('id, therapy_id, therapist_id, from_date, to_date').order('id')),
    readAll(() => sb.from('nl_therapy_types').select('id, name').order('id')),
    readAll(() => sb.from('nl_support_types').select('id, name').order('id')),
    readAll(() => sb.from('nl_session_logs').select('id, child_id, support_type_id, therapy_id, therapist_id, month_key').order('id'))
  ]);
  const { data: ths } = await sb.from('nl_therapists').select('id, name');
  const THN = {}; (ths || []).forEach(t => THN[t.id] = t.name);
  const KID = {}; kids.forEach(c => KID[c.id] = c);
  const TTN = {}; tt.forEach(t => TTN[t.id] = t.name);
  const STN = {}; st.forEach(s => STN[s.id] = s.name);
  const SC = {}; sc.forEach(s => (SC[s.therapy_id] = SC[s.therapy_id] || []).push(s));
  // 지금 다니는 아동 — 오늘까지 살아 있는 수업이 하나라도 있음
  const NOW = {};
  th.forEach(t => { if (!t.ended_on || String(t.ended_on).slice(0, 10) >= td) NOW[t.child_id] = true; });
  ROWS = th.filter(t => t.ended_on && String(t.ended_on).slice(0, 10) < td && kindOf(t.support_type_id) && KID[t.child_id])
    .map(t => {
      const k = kindOf(t.support_type_id), a = ym(t.started_on) || '0000-00', z = ym(t.ended_on);
      const lg = logs.filter(l => String(l.child_id) === String(t.child_id) && Number(l.support_type_id) === Number(t.support_type_id)
        && (l.therapy_id == null || String(l.therapy_id) === String(t.id))
        && String(l.month_key) >= a && String(l.month_key) <= z)
        .sort((x, y) => String(x.month_key).localeCompare(String(y.month_key)));
      const thIds = [...new Set((SC[t.id] || []).sort((x, y) => String(x.from_date || '').localeCompare(String(y.from_date || ''))).map(s => s.therapist_id).filter(v => v != null))];
      return { t, k, kid: KID[t.child_id], lg, now: !!NOW[t.child_id],
               th: thIds.map(v => THN[v] || '').filter(Boolean).join('·'),
               stn: STN[t.support_type_id] || '', ttn: TTN[t.therapy_type_id] || '' };
    })
    .sort((x, y) => String(y.t.ended_on).localeCompare(String(x.t.ended_on)) || (x.kid.id - y.kid.id));
  draw();
}
function draw() {
  const cnt = k => ROWS.filter(r => k === 'all' || r.k === k).length;
  $('body').innerHTML = '<div class="tools">'
    + ['all', 'dev', 'sup', 'cen'].map(k => '<button class="tab' + (TAB === k ? ' on' : '') + '" data-tab="' + k + '">'
        + (k === 'all' ? '전체' : KINDS[k].nm) + ' ' + cnt(k) + '</button>').join('')
    + '<input class="q" id="q" placeholder="이름 또는 번호" value="' + esc(Q) + '">'
    + '</div>'
    + '<p class="note">끝난 수업마다 한 줄입니다. 달을 누르면 그 기록지가 새 탭으로 열립니다 (보기 전용 · 인쇄만).<br>'
    + '선생님 화면에서는 끝난 뒤 두 달까지만 보입니다. 다시 다니는 아동의 새 담당 선생님은 기록지 화면 「지난 기록지」 단추로 봅니다.</p>'
    + '<div id="list"></div>';
  $('q').addEventListener('input', () => { Q = $('q').value; save(); drawList(); });
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; save(); draw(); });
  drawList();
}
function drawList() {
  const q = Q.trim().replace(/번$/, '');
  const list = ROWS.filter(r => (TAB === 'all' || r.k === TAB)
    && (!q || String(r.kid.id) === q || String(r.kid.name || '').indexOf(q) >= 0));
  $('list').innerHTML = !list.length ? '<div class="load">해당하는 종결 수업이 없습니다.</div>' : list.map(r => {
    const t = r.t;
    const per = (t.started_on ? String(t.started_on).slice(0, 7) : '?') + ' ~ ' + String(t.ended_on).slice(0, 7) + ' 종결';
    const why = [t.end_cat, t.end_reason].filter(Boolean).join(' · ');
    const mons = r.lg.length
      ? '<span class="lb">기록지</span>' + r.lg.map(l => '<a href="' + esc(KINDS[r.k].page + '?c=' + t.child_id + '&m=' + l.month_key + KINDS[r.k].extra(l) + '&view=1')
          + '" target="_blank" rel="noopener">' + esc(monTxt(l.month_key)) + '</a>').join('')
      : '<span class="none">저장된 기록지 없음</span>';
    return '<div class="row"><div class="t1"><span class="nm">' + esc(r.kid.id + '번 ' + (r.kid.name || '')) + '</span>'
      + '<span class="meta">' + esc([r.stn, r.ttn].filter(Boolean).join(' · ') + (r.th ? ' · 담당 ' + r.th : '') + ' · ' + per) + '</span>'
      + (r.now ? '<span class="tag">지금 다님</span>' : '')
      + (why ? '<span class="why">' + esc(why) + '</span>' : '') + '</div>'
      + '<div class="mons">' + mons + '</div></div>';
  }).join('');
}
function save() { try { sessionStorage.setItem('nl_endrec', JSON.stringify({ tab: TAB, q: Q })); } catch (e) {} }

$('home').onclick = () => { location.href = 'index.html'; };
(async () => {
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { location.replace('index.html'); return; }
  const { data: me, error } = await sb.from('nl_therapists').select('id, name, role')
    .eq('login_email', data.session.user.email.toLowerCase()).maybeSingle();
  if (error || !me) { $('body').innerHTML = '<div class="err">직원 표에 이 이메일이 없습니다.</div>'; return; }
  nlKeep(me.id);
  const role = String(me.role || '').trim();
  if (!(Number(me.id) === 8 || role === '관리자' || role === '행정' || role === '데스크')) {
    $('body').innerHTML = '<div class="err">대표 · 행정 · 데스크만 볼 수 있는 화면입니다.</div>'; return;
  }
  $('who').textContent = me.name + ' 님으로 로그인됨';
  try { await load(); } catch (e) { $('body').innerHTML = '<div class="err">기록을 불러오지 못했습니다.\n' + esc(e.message || e) + '</div>'; }
})();
</script>
</body>
</html>
