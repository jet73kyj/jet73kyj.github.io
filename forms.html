<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서식 - 나무링크</title>
<style>
  :root{ --bg:#F5F4F2; --sf:#FFFFFF; --line:#ECE8E3; --tx:#2F2926; --dim:#A39C95;
         --cam:#B07A4A; --camL:#F8F1E8; --camB:#C9A27E; --camBg:#FBF5EE; }
  body { font-family:'Malgun Gothic','맑은 고딕',sans-serif; background:var(--bg); margin:0;
         color:var(--tx); }
  header { background:var(--sf); color:var(--tx); border-bottom:1px solid var(--line);
           padding:10px 16px; display:flex; align-items:center; gap:10px; }
  header img.lg { height:22px; display:block; }
  header .bar0 { width:1px; height:16px; background:var(--line); }
  .container { max-width:1100px; margin:0 auto; padding:16px; }
  .page-title { font-size:15px; font-weight:600; color:var(--tx); margin:0 0 4px; }
  .sub { font-size:12.5px; color:var(--dim); margin-bottom:14px; }

  .loginbox { max-width:420px; margin:60px auto; background:var(--sf); border-radius:12px;
              padding:28px; border:1px solid var(--line); }
  .loginbox img.lg { height:26px; display:block; margin:0 auto 14px; }
  .loginbox input { border:1px solid var(--line); padding:10px; border-radius:8px;
                    font-size:15px; background:var(--sf); color:var(--tx); }
  .out { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13.5px;
         line-height:1.6; display:none; white-space:pre-wrap; }
  .ok  { background:var(--sf); border-left:3px solid #5E9A6E; color:var(--tx); display:block; }
  .err { background:var(--sf); border-left:3px solid #D8684A; color:#993C1D; display:block; }

  .card { background:var(--camBg); border:1px solid var(--line); border-radius:12px;
          padding:14px 16px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:14px; color:var(--tx); font-weight:600; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select, input[type=text] { padding:7px 10px; border:1px solid var(--line);
          border-radius:8px; font-size:13.5px; font-family:inherit;
          background:var(--sf); color:var(--tx); }
  input[type=file] { font-size:13px; }
  button { border:1px solid var(--line); border-radius:8px; padding:7px 16px;
           font-size:13.5px; font-weight:500; cursor:pointer;
           background:var(--sf); color:var(--tx); }
  button:hover { background:var(--camL); }
  .btn-go { background:var(--sf); color:var(--tx); border-color:var(--dim); }
  .btn-sm { padding:4px 11px; font-size:12.5px; font-weight:400; }
  .btn-del { color:#993C1D; padding:4px 11px; font-size:12.5px; font-weight:400; }
  .btn-del:hover { background:#FCEFEA; }
  button:disabled { background:#f2f1ee; color:var(--dim); border-color:var(--line);
                    cursor:default; }

  table { width:100%; border-collapse:collapse; font-size:13.5px; background:var(--sf); }
  th { background:var(--camL); color:#4A1B0C; padding:7px 8px; text-align:left;
       border-bottom:1px solid var(--camB); font-size:13px; white-space:nowrap;
       font-weight:500; }
  td { padding:9px 8px; border-bottom:1px solid #F0EEEA; vertical-align:middle; }
  tr:hover td { background:var(--camBg); }
  .yr { color:var(--cam); font-weight:500; white-space:nowrap; }
  .cat { display:inline-block; padding:1px 9px; border-radius:11px; font-size:12px;
         background:#F1EFE8; color:#5F5E5A; white-space:nowrap; }
  .fn { font-size:12.5px; color:var(--dim); }
  .empty { padding:40px; text-align:center; color:var(--dim); font-size:14px; }
  /* ===== 서식 바로 쓰기 — [15호] 신규인력등록 · [19호] 기관정보 (2026-10-09) ===== */
  .docbtns { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
  .docbtns button { background:#fff; border-color:#D9C3A7; color:#7E5530; font-weight:600; }
  #docView { display:none; }
  #docView .dv-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 12px; }
  .dsheet { background:#fff; border:1px solid #ddd; padding:28px 34px; max-width:780px; margin:0 auto 20px; font-size:12.5px; color:#111; }
  .dsheet .dno { font-size:11px; margin-bottom:4px; }
  .dsheet h2 { text-align:center; font-size:19px; margin:4px 0 14px; letter-spacing:1px; }
  .dsheet table { width:100%; border-collapse:collapse; background:#fff; font-size:12px; }
  .dsheet th, .dsheet td { border:1px solid #333; padding:4px 6px; vertical-align:middle; }
  .dsheet th { background:#f3f3f3; font-weight:normal; text-align:center; color:#111; border-bottom:1px solid #333; white-space:normal; }
  .dsheet tr:hover td { background:#fff; }
  .dsheet td input { width:100%; box-sizing:border-box; border:1px solid #e3e3e3; padding:3px 5px; font-size:12px; border-radius:3px; }
  .dsheet .box { border:1px solid #333; padding:6px 10px; margin-top:-1px; line-height:1.65; }
  .dsheet .box b { font-weight:normal; }
  .dsheet .ind { padding-left:14px; } .dsheet .ind2 { padding-left:28px; }
  .dsheet .chk { display:flex; justify-content:flex-end; gap:40px; padding-right:30px; }
  .dsheet .sec { margin:10px 0 3px; }
  .dsheet .dv-del { padding:0 6px !important; font-size:11px !important; color:#b33 !important; border-color:#e6c9c9 !important; margin-left:4px; }
  .dsheet .dv-back { padding:2px 8px !important; font-size:11.5px !important; }
  .gmctl { background:#FBF5EE; border:1px solid #ECE8E3; border-radius:10px; padding:10px 12px; margin:0 auto 12px; max-width:780px; font-size:13px; }
  .gmctl .r { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:4px 0; }
  .gmctl input[type=text], .gmctl input[type=date] { padding:5px 8px; border:1px solid #ddd; border-radius:6px; font-size:13px; }
  .gmno { font-weight:700; color:#7E5530; }
  .gml { font-family:'Batang','바탕','Malgun Gothic',serif; font-size:13px; line-height:1.75; }
  .gml .lg { text-align:center; margin:4px 0 14px; } .gml .lg img { height:62px; }
  .gml input, .gml textarea { border:1px dashed #d8c7b3; background:#fffdf9; font-family:inherit; font-size:13px; padding:1px 4px; }
  .gml textarea { width:100%; box-sizing:border-box; resize:vertical; }
  .gml .hr { border-top:1.5px solid #333; margin:6px 0 10px; width:72%; }
  .gml .hr2 { border-top:1.5px solid #333; margin:10px 0 6px; }
  .gml .sign { text-align:center; font-size:19px; letter-spacing:12px; margin:26px 0 8px; position:relative; }
  .gml .sign img { position:absolute; left:52%; top:-14px; width:62px; opacity:.92; display:none; }
  .gml .ft { display:grid; grid-template-columns:1fr 1fr; gap:2px 20px; font-size:12.5px; }
  .gml .ft .w { grid-column:1 / span 2; }
  .gmchk { cursor:pointer; user-select:none; }
  .gml .gpr { display:none; white-space:pre-wrap; }
  .dsheet.gsheet { page-break-after:always; }
  .gmtabs { display:flex; gap:0; margin:0 auto 10px; max-width:780px; border-bottom:2px solid #ECE8E3; }
  .gmtabs button { border:none !important; border-radius:0 !important; background:none !important; padding:8px 14px !important;
                   color:#8a8178; font-weight:500; border-bottom:2px solid transparent !important; margin-bottom:-2px; }
  .gmtabs button.on { color:#7E5530; font-weight:700; border-bottom-color:#B07A4A !important; }
  @media screen { .gsheet.gm-off { display:none; } }
  .dsheet .foot { font-size:11px; margin-top:4px; line-height:1.6; }
  @media print {
    @page { size:A4 portrait; margin:10mm 12mm; }
    body.print-doc * { visibility:hidden; }
    body.print-doc #docView, body.print-doc #docView * { visibility:visible; }
    body.print-doc #docView { position:absolute; left:0; top:0; right:0; width:auto; box-sizing:border-box; }
    body.print-doc .dsheet, body.print-doc .dsheet > div { box-sizing:border-box; width:100%; }
    body.print-doc .dsheet table { table-layout:fixed; }
    body.print-doc .dv-bar, body.print-doc .dv-hint, body.print-doc .dv-del, body.print-doc .gmctl, body.print-doc .gskip { display:none !important; }
    body.print-doc .gml input { border:none !important; background:transparent !important; }
    body.print-doc .gml textarea { display:none !important; }
    body.print-doc .gml .gpr { display:block !important; }
    body.print-doc .gmno { color:#111 !important; font-weight:normal !important; }
    body.print-doc .gsheet:last-of-type { page-break-after:auto; }
    body.print-doc .dsheet { border:none; padding:0; max-width:none; margin:0; font-size:11px; }
    body.print-doc .dsheet input { border:none; padding:0; background:transparent; }
    body.print-doc .dsheet table { font-size:10.5px; }
    body.print-doc .dsheet th, body.print-doc .dsheet td { padding:2.5px 5px; }
    body.print-doc #dsHire { font-size:10px; } body.print-doc #dsHire h2 { font-size:16px; margin:0 0 8px; }
    body.print-doc #dsHire .box { padding:3px 8px; line-height:1.45; }
    body.print-doc #dsHire table { font-size:10px; }
    body { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

  <div class="docbtns" id="docBtns" style="display:none;">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nl-login.js"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: { storage: nlStore, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});
const $ = id => document.getElementById(id);
const BUCKET = 'nl-forms';

let ME = null, ALL = [], FILES = {}, CAN_EDIT = false;

function show(el, t, ok) { el.textContent = t; el.className = 'out ' + (ok ? 'ok' : 'err'); }
function esc(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function logout() {
  nlKeepOff();
  try { await sb.auth.signOut(); } catch (e) {}
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {}
  location.replace('index.html');
}

// 연도 고르는 칸 채우기 — 올해 기준 앞뒤로
function fillYears() {
  const y = new Date().getFullYear();
  let a = '', b = '<option value="">-- 연도 전체 --</option>';
  for (let i = y + 1; i >= y - 5; i--) {
    a += '<option value="' + i + '"' + (i === y ? ' selected' : '') + '>' + i + '년</option>';
    b += '<option value="' + i + '"' + (i === y ? ' selected' : '') + '>' + i + '년</option>';
  }
  $('u_year').innerHTML = a;
  $('f_year').innerHTML = b;
}

function fileLine(f) {
  const isSample = (f.kind === '작성 견본');
  return '<div style="padding:2px 0;font-size:13px;">'
    + ''
    + esc(f.file_name)
    + ' <button class="btn-sm" data-' + (isSample ? 'see' : 'dl') + '="' + f.id + '">'
    +   (isSample ? '보기' : '내려받기') + '</button>'
    + (CAN_EDIT ? ' <button class="btn-del" data-fdel="' + f.id + '">×</button>' : '')
    + '</div>';
}

function draw() {
  const fy = $('f_year').value;
  const fc = $('f_cat').value;
  const list = ALL.filter(x =>
    (!fy || String(x.year) === String(fy)) && (!fc || x.category === fc));

  $('cnt').textContent = list.length + '개';
  $('empty').style.display = list.length ? 'none' : 'block';

  $('rows').innerHTML = list.map(x => {
    const fs = (FILES[x.id] || []);
    const blanks  = fs.filter(f => f.kind !== '작성 견본');
    const samples = fs.filter(f => f.kind === '작성 견본');
    let inner = '';
    if (blanks.length)  inner += blanks.map(fileLine).join('');
    if (samples.length) inner += samples.map(fileLine).join('');
    if (!inner) inner = '<div style="font-size:12.5px;color:#bbb;">딸린 파일이 없습니다</div>';
    return '<tr>'
      + '<td class="yr">' + x.year + '년</td>'
      + '<td><span class="cat">' + esc(x.category || '그 밖') + '</span></td>'
      + '<td><div style="font-weight:bold;margin-bottom:4px;">' + esc(x.title) + '</div>'
      +   inner
      +   (CAN_EDIT
            ? '<div style="margin-top:6px;">'
              + '<button class="btn-sm" data-add="' + x.id + '">＋ 파일 더하기</button>'
              + '</div>'
            : '')
      + '</td>'
      + '<td style="font-size:12.5px;color:#777;">'
      +   String(x.uploaded_at || '').slice(0,10) + '</td>'
      + '<td style="text-align:right;">'
      +   (CAN_EDIT ? '<button class="btn-del" data-del="' + x.id + '">지우기</button>' : '')
      + '</td>'
      + '</tr>';
  }).join('');

  document.querySelectorAll('[data-dl]').forEach(b => {
    b.onclick = () => openFile(Number(b.dataset.dl), true);
  });
  document.querySelectorAll('[data-see]').forEach(b => {
    b.onclick = () => openFile(Number(b.dataset.see), false);
  });
  document.querySelectorAll('[data-fdel]').forEach(b => {
    b.onclick = () => removeFile(Number(b.dataset.fdel));
  });
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => removeForm(Number(b.dataset.del));
  });
  document.querySelectorAll('[data-add]').forEach(b => {
    b.onclick = () => addFiles(Number(b.dataset.add));
  });
}

async function loadList() {
  const [a, b] = await Promise.all([
    sb.from('nl_forms')
      .select('id, year, title, category, uploaded_at')
      .order('year', { ascending: false })
      .order('uploaded_at', { ascending: false }),
    sb.from('nl_form_files')
      .select('id, form_id, kind, file_path, file_name')
      .order('id')
  ]);
  if (a.error) { show($('msg2'), '\u274c 목록을 읽지 못했습니다.\n' + a.error.message, false); return; }
  ALL = a.data || [];
  FILES = {};
  (b.data || []).forEach(f => { (FILES[f.form_id] = FILES[f.form_id] || []).push(f); });
  draw();
}

function findFile(id) {
  let hit = null;
  Object.values(FILES).forEach(arr => arr.forEach(f => { if (f.id === id) hit = f; }));
  return hit;
}

// dl 이 참이면 내려받기, 거짓이면 새 탭에서 보기
async function openFile(id, dl) {
  const f = findFile(id);
  if (!f) return;
  const opt = dl ? { download: f.file_name } : {};
  const { data, error } = await sb.storage.from(BUCKET)
    .createSignedUrl(f.file_path, 120, opt);
  if (error) { alert('열지 못했습니다.\n' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

async function removeFile(id) {
  const f = findFile(id);
  if (!f) return;

  if (error) { show($('msg2'), '\u274c 지우지 못했습니다.\n' + error.message, false); return; }

}

async function removeForm(id) {
  const it = ALL.find(x => x.id === id);
  if (!it) return;
  if (!confirm('\u300c' + it.title + '\u300d 서식과 딸린 파일을 모두 지웁니다.\n계속할까요?')) return;
  const paths = (FILES[id] || []).map(f => f.file_path);
  if (paths.length) await sb.storage.from(BUCKET).remove(paths);
  const { error } = await sb.from('nl_forms').delete().eq('id', id);
  if (error) { show($('msg2'), '\u274c 지우지 못했습니다.\n' + error.message, false); return; }
  show($('msg2'), '\u2705 지웠습니다.', true);
  await loadList();
}

// 파일 하나를 저장소에 올리고 딸린 파일 줄을 넣는다
async function putFile(formId, year, file, kind) {
  const ext = (file.name.match(/\.[^.]+$/) || [''])[0];
  const path = year + '/' + Date.now() + '_' + Math.floor(Math.random() * 1000) + ext;
  const up = await sb.storage.from(BUCKET).upload(path, file, { upsert: false });
  if (up.error) throw up.error;
  const ins = await sb.from('nl_form_files').insert({
    form_id: formId, kind: kind, file_path: path, file_name: file.name
  });
  if (ins.error) throw ins.error;
}

// 이미 있는 서식에 파일을 더 붙인다
function addFiles(formId) {
  const it = ALL.find(x => x.id === formId);
  if (!it) return;
  const kind = confirm('\u300c' + it.title + '\u300d 에 파일을 더합니다.\n\n'
    + '확인 = 빈 서식 (내려받는 것)\n취소 = 작성 견본 (보기만 하는 것)')
    ? '빈 서식' : '작성 견본';
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  inp.onchange = async () => {
    const fs = Array.from(inp.files || []);
    if (!fs.length) return;
    show($('msg2'), '올리는 중...', true);
    try {
      for (const f of fs) await putFile(formId, it.year, f, kind);
      show($('msg2'), '\u2705 ' + fs.length + '개를 더했습니다.', true);
      await loadList();
    } catch (e) {
      show($('msg2'), '\u274c 올리지 못했습니다.\n' + e.message, false);
    }
  };
  inp.click();
}

  b.disabled = st === 'saving';
  b.textContent = st === 'saving' ? '저장 중…' : st === 'done' ? '✓ 저장됨' : '저장 전';
  b.style.background = st === 'done' ? '#2e7d32' : '#fff';
  b.style.color = st === 'done' ? '#fff' : '';
}
async function saveOrg() {
  if (DOC_KIND !== 'org' && DOC_KIND !== 'info') return;
  const d = DOC_KIND === 'info' ? infoRead() : orgRead();
  setOrgBtn('saving');
  try {
    const { data, error } = await sb.from('nl_org_docs')
      .upsert({ doc_key: ORG_KEY, data: d, updated_by: ME ? ME.id : null, updated_at: new Date().toISOString() }, { onConflict: 'doc_key' })
      .select('doc_key');
    if (error) throw error;
    if (!data || !data.length) throw new Error('저장된 줄을 돌려받지 못했습니다');
    ORG_DIRTY = false; setOrgBtn('done');
    $('dvHint').textContent = '저장했습니다 · ' + ORG_KEY.slice(0, 4) + '년 ' + (DOC_KIND === 'info' ? '제공기관 정보 안내' : '요약서');
  } catch (e) {
    setOrgBtn('before');
    alert('저장하지 못했습니다.\n' + (e.message || e));
  }
}

function infoRead() {
  const sh = $('dsInfo'), d = {};
  if (!sh) return d;
  sh.querySelectorAll('[data-k]').forEach(el => { if (el.value.trim()) d[el.dataset.k] = el.value.trim(); });
  d.hide = sh.dataset.hide ? sh.dataset.hide.split(',').map(Number) : [];
  d.s_n = Number(sh.dataset.sn || 1);
  return d;
}
async function infoStaff(d) {           // 재직 치료사 · 면허로 제공인력 칸 채우기 (다른 칸은 그대로)
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const { data: th, error } = await sb.from('nl_therapists').select('id, name, gender, role, left_on').eq('role', '치료사').order('id');
  if (error) throw error;
  const live = (th || []).filter(t => !t.left_on || String(t.left_on) >= today);
  let lic = [];
  if (live.length) {
    const lq = await sb.from('nl_th_licenses').select('therapist_id, lic_name, lic_no').in('therapist_id', live.map(t => t.id)).order('id');
    lic = (lq && lq.data) || [];
  }
  Object.keys(d).forEach(k => { if (/^s\d+_/.test(k)) delete d[k]; });
  live.forEach((t, j) => {
    d['s' + j + '_name'] = t.name || ''; if (t.gender) d['s' + j + '_gender'] = t.gender;
    lic.filter(x => String(x.therapist_id) === String(t.id)).slice(0, 3).forEach((x, r) => {
      if (x.lic_name) d['s' + j + '_r' + r + '_lic'] = x.lic_name;
      if (x.lic_no) d['s' + j + '_r' + r + '_no'] = x.lic_no;
    });
  });
  d.s_n = Math.max(1, live.length);
  return d;
}

        if (s19.c_etc) { d.k_etc = s19.c_etc; d.t_etc = s19.c_etc; }
      }
      d = await infoStaff(d);
    }
  } catch (e) {
    d = d || { org: ORG_NAME, tel: '042-488-6011' };

  }
  $('dvBody').innerHTML = infoSheet(d);
  ORG_DIRTY = from !== ORG_KEY;
  setOrgBtn(from === ORG_KEY ? 'done' : 'before');
  if (from && from !== ORG_KEY) $('dvHint').textContent = Number(from.slice(0, 4)) + '년 것을 이어받았습니다 · 확인 후 「저장」하면 올해 것으로 남습니다';
  infoBind();
}
function infoBind() {
  const sh = $('dsInfo'); if (!sh) return;
  sh.addEventListener('input', () => { ORG_DIRTY = true; setOrgBtn('before'); });
  sh.addEventListener('click', async e => {
    const t = e.target.closest('button'); if (!t) return;
    let d = infoRead();
    if (t.dataset.hide != null) { const st = new Set(d.hide); st.add(Number(t.dataset.hide)); d.hide = [...st]; }
    else if (t.dataset.show != null) { d.hide = d.hide.filter(x => x !== Number(t.dataset.show)); }
    else if (t.dataset.sadd) { d.s_n = d.s_n + 1; }
    else if (t.dataset.sdel != null) {
      const j0 = Number(t.dataset.sdel);
      if (!confirm('이 인력 줄을 뺄까요?')) return;
      const nd = {};
      Object.keys(d).forEach(k => {
        const m = /^s(\d+)_(.*)$/.exec(k);
        if (!m) { nd[k] = d[k]; return; }
        const j = Number(m[1]);
        if (j === j0) return;
        nd['s' + (j > j0 ? j - 1 : j) + '_' + m[2]] = d[k];
      });
      nd.s_n = Math.max(1, d.s_n - 1); d = nd;
    } else if (t.dataset.sfill) {
      if (!confirm('제공인력 칸을 지우고 재직 치료사 · 면허로 다시 채울까요?\n(학력 · 경력 등 적은 글도 지워집니다)')) return;
      try { d = await infoStaff(d); } catch (er) { alert('직원 목록을 불러오지 못했습니다.\n' + (er.message || er)); return; }
    } else return;
    $('dvBody').innerHTML = infoSheet(d);
    infoBind();
    ORG_DIRTY = true; setOrgBtn('before');
  });
}

async function openRefer(keep) {

function gmKidOf(label) {
  const m = String(label || '').match(/^(\d+)/);
  return m ? GM_KIDS.find(k => String(k.id) === m[1]) || null : null;
}

function gmBindRefer() {

  });

async function gmIssue() {
  const d = gmRead();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '')) { alert('공문 작성일을 고르세요.'); return; }
  if (!String(d.title || '').trim()) { alert('제목을 적어 주세요.'); return; }
  let nx = '';
  try { const r = await sb.rpc('nl_gongmun_next', { p_year: Number(d.date.slice(0, 4)) }); nx = r && r.data != null ? String(r.data).padStart(3, '0') : ''; } catch (e) {}
  if (!confirm('공문 번호를 받을까요?\n\n대가 ' + d.date.slice(0, 4) + ' - ' + (nx || '○○○') + '호 (' + gmDot(d.date) + ')\n\n번호와 작성일은 발행 뒤 바꿀 수 없습니다.')) return;
  const b = $('gmIssue'); b.disabled = true; b.textContent = '발행 중…';
  try {
    const { data, error } = await sb.rpc('nl_gongmun_issue', { p_date: d.date, p_title: d.title.trim(), p_recipient: (d.to || '').trim() || null,
      p_child: GM && GM.child && GM.child.id ? Number(GM.child.id) : null, p_data: d });
    if (error) throw error;
    const r = data && data[0];
    if (!r) throw new Error('번호를 돌려받지 못했습니다');
    GM = Object.assign(GM || {}, { id: r.id, year: r.year, no: r.no, data: d });
    GM_DIRTY = false;
    gmRender(d);
    $('dvHint').textContent = '발행했습니다 · ' + gmNoText() + ' · 고친 뒤에는 「고쳐 저장」';
  } catch (e) {
    b.disabled = false; b.textContent = '공문 번호 받기 (발행)';
    alert('공문을 발행하지 못했습니다.\n' + (e.message || e));
  }
}
async function gmUpdate() {
  if (!GM || !GM.id) return;

    const { data, error } = await sb.from('nl_gongmun').update({ title: d.title.trim(), recipient: (d.to || '').trim() || null, data: d })
      .eq('id', GM.id).select('id');
    if (error) throw error;
    if (!data || !data.length) throw new Error('저장된 줄을 돌려받지 못했습니다');
    GM.data = d; GM_DIRTY = false; b.textContent = '✓ 저장됨';
  } catch (e) { b.textContent = '고쳐 저장'; alert('저장하지 못했습니다.\n' + (e.message || e)); }
  b.disabled = false;
}

function printDoc() {
  if (DOC_KIND === 'refer') {
    const on = [...document.querySelectorAll('.gmpr:checked')].map(x => x.value);
    if (!on.length) { alert('인쇄할 서식을 하나 이상 고르세요.'); return; }
    document.querySelectorAll('.gsheet').forEach(sh => sh.classList.toggle('gskip', !on.includes(sh.dataset.sheet)));
    if (on.includes('letter') && !(GM && GM.no) && !confirm('공문 번호를 아직 받지 않았습니다. 번호 없이 인쇄할까요?')) return;
  }
  document.body.classList.add('print-doc');
  const off = () => { document.body.classList.remove('print-doc'); window.removeEventListener('afterprint', off); };
  window.addEventListener('afterprint', off);
  window.print();
  setTimeout(off, 1500);
}
window.addEventListener('beforeunload', e => { if ((DOC_KIND === 'org' || DOC_KIND === 'info') && ORG_DIRTY) { e.preventDefault(); e.returnValue = ''; } });

async function afterLogin(user) {
  const { data: me, error: e1 } = await sb
    .from('nl_therapists').select('id, name, role')
    .eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (e1)  { show($('msg'), '❌ 직원 조회 실패\n' + e1.message, false); return; }
  if (!me) { show($('msg'), '⚠️ 직원 표에 이 이메일이 없습니다.', false); return; }
  nlKeep(me.id);
  ME = me;
  CAN_EDIT = [8, 19, 11].includes(Number(me.id));

  $('loginBox').style.display = 'none';
  $('mainBox').style.display = '';
  $('who').textContent = me.name + ' (' + (me.role || '') + ')';
  $('upCard').style.display = CAN_EDIT ? '' : 'none';
  $('docBtns').style.display = CAN_EDIT ? '' : 'none';   // 서식 바로 쓰기 — 관리자 · 행정 · 데스크

  fillYears();
  await loadList();
}

$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase();
  const pw = $('pw').value;
  if (!email || !pw) { show($('msg'), '이메일과 비밀번호를 넣으세요.', false); return; }
  $('btn').disabled = true; $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) {
    show($('msg'), '❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false; $('btn').textContent = '로그인';
  }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });

(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) { await afterLogin(data.session.user); }
  else { location.replace('index.html'); }
})();
</script>
