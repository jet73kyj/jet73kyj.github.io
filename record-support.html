<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치료지원 누가기록서 - 나무링크</title>
<style>
  body { font-family: 'Malgun Gothic','맑은 고딕',sans-serif; background:#f5f7fa; margin:0; }
  header { background:#2e7d32; color:white; padding:12px 24px; display:flex; align-items:center; gap:12px; }
  .container { max-width:1000px; margin:16px auto; padding:0 16px; }
  .page-title { font-size:18px; font-weight:bold; color:#2e7d32; margin:10px 0; }
  .form-actions { display:flex; gap:8px; margin:12px 0; }
  .form-actions button { padding:8px 18px; border:none; border-radius:6px; font-size:13px; font-weight:bold; cursor:pointer; }
  /* 저장 단추 — 저장 전(연한 초록) / 저장 중(회색) / 저장됨(진한 초록) (2026-09-16) */
  .btn-save { background:#e8f3ea; color:#2e7d32; border:1px solid #a9d6b3 !important; }
  .btn-save.done { background:#2e7d32; color:white; border-color:#2e7d32 !important; }
  .btn-save:disabled { background:#bbb; color:white; border-color:#bbb !important; cursor:default; }
  .btn-print { background:#1565c0; color:white; }
  .sheet { background:white; padding:26px 32px; border:1px solid #ddd;
           box-shadow:0 1px 4px rgba(0,0,0,0.05); margin-bottom:22px; }
  .sheetlogo { text-align:center; margin-top:12px; }
  .sheetlogo img { height:40px; }
  .sheet h2.title { text-align:center; font-size:16px; margin:0 0 14px; letter-spacing:2px; }
  .rec-tbl { border-collapse:collapse; width:100%; font-size:12px; table-layout:fixed; }
  .rec-tbl td, .rec-tbl th { border:1px solid #333; padding:5px 8px; vertical-align:top; }
  .rec-tbl td.lbl { background:#f5f5f5; font-weight:bold; text-align:center; vertical-align:middle; }
  .rec-tbl th { background:#f0f4c3; font-weight:bold; text-align:center; }
  .side { background:#f5f5f5; font-weight:bold; text-align:center; vertical-align:middle;
          width:56px; letter-spacing:2px; }
  input[type=text], input[type=date], textarea, select {
    border:1px solid #ccc; padding:3px 6px; font-size:12px;
    font-family:inherit; box-sizing:border-box; width:100%; }
  textarea { resize:vertical; min-height:46px; }
  textarea.opin { min-height:46px; }
  .sign { text-align:center; font-size:12.5px; line-height:2.4; margin-top:22px; }
  .sign .line { margin-top:6px; }
  /* 두 서명을 한 줄에 담는다 (2026-09-10) */
  /* 담당치료사 아래에 치료지원담당이 오도록 세로로 (2026-09-10) */
  .sign .signrow { display:flex; flex-direction:column; align-items:center;
                   gap:8px; }
  .sign .signone { white-space:nowrap; }
  /* 직인 — 「(인)」 글자 위에 겹쳐 찍는다 */
  .ins { position:relative; display:inline-block; }
  .ins img { position:absolute; left:50%; top:50%;
             transform:translate(-50%, -50%);
             width:44px; height:auto; opacity:0.92; display:none; }
  .radio { font-size:12px; }
  .radio span { cursor:pointer; padding:2px 8px; border-radius:4px; }
  .radio span.on { color:#c62828; background:#ffebee; font-weight:bold; }

  .loginbox { max-width:400px; margin:56px auto; background:#fff; border-radius:12px;
              padding:32px; border:1px solid #e0e0e0; }
  .loginbox input { border:1px solid #ddd; padding:11px; border-radius:7px; font-size:15px; }
  .out { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13.5px;
         line-height:1.6; display:none; white-space:pre-wrap; }
  .ok  { background:#e8f5e9; color:#1b5e20; display:block; }
  .err { background:#ffebee; color:#b71c1c; display:block; }
  .picker { max-width:1000px; margin:14px auto 0; padding:0 16px; display:flex;
            gap:8px; align-items:center; flex-wrap:wrap; }
  .picker select, .picker input { width:auto; font-size:13px; padding:7px 9px; }
  .picker button { background:#2e7d32; color:#fff; border:none; border-radius:6px;
                   padding:8px 16px; font-size:13px; font-weight:bold; cursor:pointer; }
  .picker #pInfo { font-size:12.5px; color:#777; margin-left:4px; }

  /* 치료지원 시간표 · 결제 내역 변경 관리 (2026-10-09) */
  .ttsheet h2.title, .pcsheet h2.title { font-size:18px; letter-spacing:1px; }
  .tt-cal { border-collapse:collapse; width:100%; table-layout:fixed; font-size:11.5px; margin-top:-1px; }
  .tt-cal th { border:1px solid #333; background:#f5f5f5; padding:4px; }
  .tt-cal td { border:1px solid #333; height:72px; vertical-align:top; padding:3px 4px; }
  .tt-cal .dn { display:inline-block; min-width:18px; border:1px solid #555; padding:0 3px; font-size:10.5px; }
  .tt-cal .tm { margin-top:6px; text-align:center; font-size:12px; font-weight:bold; line-height:1.5; }
  .tt-th { margin-top:22px; font-weight:bold; font-size:13px; }
  .pc-sub { text-align:right; font-weight:bold; font-size:14px; margin:-6px 0 8px; }
  .pc-tbl td { vertical-align:middle; }
  .pc-cat { font-size:10.5px; line-height:1.45; text-align:center; color:#555; }
  .pc-cat span.on { color:#000; font-weight:bold; border:1.5px solid #c62828; border-radius:10px; padding:0 4px; }
  .pc-area span.on { font-weight:bold; border:1.5px solid #c62828; border-radius:10px; padding:0 5px; }
  .pc-note { font-size:11px; margin-top:6px; color:#555; }
  .pc-edit { margin:14px 0 30px; background:#fff; border:1px solid #ECE8E3; border-radius:10px; padding:14px 16px; }
  .pc-edit h3 { margin:0 0 8px; font-size:14px; }
  .pc-edit table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .pc-edit td, .pc-edit th { border-bottom:1px solid #F0EEEA; padding:5px 6px; text-align:left; vertical-align:middle; }
  .pc-edit input[type=text], .pc-edit select { padding:4px 6px; font-size:12.5px; border:1px solid #E4E0DA; border-radius:6px; }
  .pc-edit button { padding:4px 10px; font-size:12px; border:1px solid #E4E0DA; background:#fff; border-radius:6px; cursor:pointer; }
  .pc-edit tr.hid td { color:#bbb; text-decoration:line-through; }
  .pc-edit .pcmsg { font-size:12px; margin-top:6px; }
  @media print {
    .ttsheet { page-break-after:always; }
    body:not(.print-pc) #pcSheet { display:none !important; }
    body.print-pc .sheet:not(#pcSheet) { display:none !important; }
    .tt-cal td { height:64px; }
    .pc-cat span.on, .pc-area span.on { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  .pc-tbl .pcnote { width:100%; margin-top:4px; border:1px dashed #D9C3A7; border-radius:4px; padding:3px 5px; font-size:11.5px; background:#FFFDF8; }
  .pc-tbl .pcbtns { display:flex; gap:4px; flex-wrap:wrap; justify-content:center; }
  .pc-tbl .pcbtns button { padding:3px 8px; font-size:11.5px; border:1px solid #E4E0DA; background:#fff; border-radius:6px; cursor:pointer; width:auto; margin:0; }
  .pc-tbl tr.pc-hid td { color:#bbb; background:#FAFAF8; }
  .pc-tbl tr.pc-hid .pc-cat span.on { border-color:#ccc; color:#bbb; }
  .pc-tbl tr.pcadd td { background:#FBF5EE; }
  .pc-tbl tr.pcadd select, .pc-tbl tr.pcadd input { font-size:11.5px; padding:3px 5px; border:1px solid #E4E0DA; border-radius:4px; }
  .pc-tbl tr.pcadd select { width:100% !important; margin:0 !important; }
  .pcmsg { font-size:12px; margin-top:6px; min-height:16px; }
  .pcprintbar { display:flex; align-items:center; gap:10px; justify-content:flex-end; margin:-6px 0 12px;
                padding:8px 10px; background:#F8F1E8; border-radius:8px; font-size:12.5px; color:#7E5530; }
  .pcprintbar button { width:auto; margin:0; padding:6px 14px; font-size:13px; font-weight:600; background:#1565c0; color:#fff;
                       border:none; border-radius:6px; cursor:pointer; }
  .pc-tbl .pcnote-p { display:none; font-size:11.5px; margin-top:2px; padding-left:8px; }
  @media print {
    .pc-tbl tr.pc-hid { display:none !important; }
    .pc-tbl .pcnote { display:none !important; }
    .pc-tbl .pcnote-p { display:block !important; }
  }
  /* 카드 결제 줄 (2026-10-09) — 빨강은 선생님이 고치셔야 하는 표시. 인쇄에도 나온다 */
  .q_pay { font-size:11.5px; color:#4A433F; margin-top:3px; line-height:1.35; text-align:center; }
  .q_pay.red, input.red { color:#c62828 !important; font-weight:bold; }
  .q_pay.red, input.red { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  @media print { .q_pay { font-size:9.5px; margin-top:1px; } }

  @media print {
    /* 발달재활 기록지와 같은 여백 (2026-09-10)
       위를 넓게 두어 철하실 자리를 만든다 */
    @page { size: A4 portrait; margin: 22mm 14mm 10mm; }
    header, .form-actions, .page-title, .picker, .no-print { display:none !important; }
    body { background:white; }
    .ins img { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .container { max-width:none; margin:0; padding:0; }
    .sheet { border:none; box-shadow:none; padding:0; margin:0; }
    .rec-tbl { font-size:10.5px; }
    .rec-tbl td, .rec-tbl th { padding:4px 6px; }
    input, textarea { border:none; padding:1px 3px; font-size:10.5px; background:transparent; }
    textarea { min-height:38px; }
    textarea.opin { min-height:38px; }   /* 두 줄이면 충분 (2026-09-10) */
    /* 긴 내용이 잘리지 않게 (2026-09-10) */
    textarea { overflow:hidden !important; height:auto; resize:none; }
    .rec-tbl { page-break-inside:auto; }
    .rec-tbl tr { page-break-inside:avoid; page-break-after:auto; }
    .rec-tbl thead { display:table-header-group; }
    .sheet { overflow:visible !important; }
    .sign { margin-top:10px; line-height:1.9; }
    .sign .signrow { gap:7px; }
    /* 로고 — 다음 장으로 넘어가지 않게 자리를 줄인다 (2026-09-10) */
    .sheetlogo { margin-top:8mm; page-break-inside:avoid; }
    .sheetlogo img { height:40px; }
  }

  /* ===== 꾸밈 B (2026-09-17) — 화면에서만 보이는 곳. 인쇄 서식(표·선·칸 색)은 그대로 =====
     되돌리려면 이 묶음(꾸밈 B ~ 꾸밈 B 끝)만 지우면 된다 */
  body { background:#F5F4F2; color:#2F2926; }
  header { background:#fff !important; color:#2F2926 !important; border-bottom:1px solid #ECE8E3;
           padding:10px 24px !important; }
  header .toplogo { height:40px; width:auto; display:block; }
  header h1 { color:#2F2926; font-size:17px !important; border-left:1px solid #ECE8E3; padding-left:12px; }
  header #who { color:#A39C95; opacity:1 !important; }
  header .hdout { background:#fff !important; color:#4A433F !important; border:1px solid #E4E0DA !important; }
  .page-title { color:#2F2926 !important; }
  .picker select, .picker input { border:1px solid #E4E0DA; border-radius:6px; background:#fff; color:#2F2926; }
  .picker button, .picker #pIntake {
    background:#fff !important; color:#4A433F !important; border:1px solid #E4E0DA !important;
    border-radius:6px !important; font-weight:500 !important; }
  .picker button:hover { background:#F7F6F4 !important; }
  .form-actions { align-items:center; }
  .form-actions button, .form-actions a {
    background:#fff !important; color:#4A433F !important; border:1px solid #E4E0DA !important;
    font-weight:500 !important; }
  .form-actions button:hover, .form-actions a:hover { background:#F7F6F4 !important; }
  .form-actions a[href="index.html"] { color:#7E5530 !important; border-color:#D9C3A7 !important;
    font-weight:600 !important; }
  .form-actions a[href="index.html"]:hover { background:#FBF5EE !important; }
  /* 저장 — 저장 전 흰 테두리 / 저장됨만 초록 (납부 계산과 같게) */
  .form-actions .btn-save { font-weight:600 !important; }
  .form-actions .btn-save.done { background:#2e7d32 !important; color:#fff !important;
    border-color:#2e7d32 !important; }
  .form-actions .btn-save:disabled { background:#bbb !important; color:#fff !important;
    border-color:#bbb !important; }
  .sheet { border-color:#ECE8E3; }
  .loginbox { border-color:#ECE8E3; }
  .loginbox .loginlogo { display:block; height:52px; width:auto; margin:0 0 12px; }
  .loginbox h1 { color:#2F2926 !important; }
  .loginbox #btn { background:#B07A4A !important; }
  .ok { background:#F8F1E8; color:#7E5530; }
  /* ===== 꾸밈 B 끝 ===== */
</style>
</head>

  <!-- 특수교육대상자 치료지원 시간표 (2026-10-09) — 누가기록서 앞장 · 회기 칸을 그대로 따라감 -->

function _keepMk(mk) {
  const y = Number(String(mk).slice(0,4));
  const m = Number(String(mk).slice(5,7)) - 2;
  const y2 = y + Math.floor((m - 1) / 12);
  const m2 = ((m - 1) % 12 + 12) % 12 + 1;
  return y2 + '-' + String(m2).padStart(2,'0');
}

// 셈은 서버 한 곳 — nl_live_rows(달, 유예개월) 가 「그 달에 살아 있던 수업」을 돌려준다 (2026-09-19)
//   유예 2 = 끝난 수업도 두 달까지 남긴다 (기록지를 쓸 시간을 준다)
//   서버를 못 부르면 아래 옛 셈으로 그린다
async function buildPairs() {
  const mv = ($('pMonth') && $('pMonth').value) ? $('pMonth').value : mkNow();
  const allView = _isAllView(ME.role);
  const seen = {};
  PAIRS = [];
  try {
    const { data, error } = await sb.rpc('nl_live_rows', { p_month: mv, p_grace: 2 });
    if (error) throw error;
    (data || []).forEach(r => {
      if (SUPPORTS.indexOf(Number(r.support_type_id)) < 0) return;
      if (!allView && String(r.therapist_id) !== String(ME.id)) return;
      const c = KIDS[r.child_id];
      if (!c) return;
      // 보는 달 전에 끝난 수업은 찾기 칸에서 뺀다 (2026-10-09 · 그 달 안에 끝난 수업은 남김)
      const tpe = TPRAW.find(x => String(x.id) === String(r.therapy_id));
      if (tpe && tpe.ended_on && String(tpe.ended_on).slice(0, 10) < mv + '-01') return;
      const k = c.id + '-' + r.support_type_id;
      if (seen[k]) return;
      seen[k] = true;
      PAIRS.push({ child: c, support_type_id: Number(r.support_type_id),
                   therapy_id: r.therapy_id, therapy_type_id: r.therapy_type_id });
    });
    PAIRS.sort((a,b) => (a.child.name||'').localeCompare(b.child.name||'')
                     || a.support_type_id - b.support_type_id);
    return;
  } catch (e) { /* 서버를 못 부르면 아래 옛 셈으로 */ }
  const _keep0 = _keepMk(mv);
  TPRAW.forEach(r => {
    const c = r.nl_children;
    if (!c) return;
    if (r.ended_on && String(r.ended_on).slice(0,7) < _keep0) return;
    if (r.ended_on && String(r.ended_on).slice(0, 10) < mv + '-01') return;   // 보는 달 전에 끝난 수업 (2026-10-09)
    const sc = (r.nl_therapy_schedules || [])
      .filter(s => !s.to_month || s.to_month >= _keep0);
    if (!sc.length) return;
    if (!allView && !sc.some(s => String(s.therapist_id) === String(ME.id))) return;
    const k = c.id + '-' + r.support_type_id;
    if (seen[k]) return;
    seen[k] = true;
    PAIRS.push({ child: c, support_type_id: r.support_type_id,
                 therapy_id: r.id, therapy_type_id: r.therapy_type_id });
  });
  PAIRS.sort((a,b) => (a.child.name||'').localeCompare(b.child.name||'')
                   || a.support_type_id - b.support_type_id);
}

// ── 그 달에 살아 있던 요일줄만 쓴다 (2026-09-17) ──
//   달 중간에 담당·요일·시각을 바꾸면 요일줄이 둘이 된다.
//   전에는 요일줄을 모두(지금 것까지) 읽어 지난 달 기록지의 담당·요일·시간이 바뀌어 보였다
const _SWD = { 일:0, 월:1, 화:2, 수:3, 목:4, 금:5, 토:6 };
function _ymd(d) { return year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
function schedActive(rows) {
  const mk = year + '-' + String(month).padStart(2,'0');
  const first = mk + '-01', last = _ymd(new Date(year, month, 0).getDate());
  return (rows || []).filter(s => (s.from_month || '0000-00') <= mk && (s.to_month || '9999-12') >= mk
    && (!s.from_date || String(s.from_date) <= last) && (!s.to_date || String(s.to_date) >= first));
}
function schedInMonth(rows) {
  const act = schedActive(rows);
  const st = s => String(s.from_date || ((s.from_month || '0000-00') + '-01'));
  return (act.length ? act : (rows || [])).slice().sort((a, b) => st(a).localeCompare(st(b)));
}
// 그 날 수업을 맡은 요일줄 (요일·기간이 맞는 것)
function schedOnDay(d) {
  const iso = _ymd(d), wd = new Date(year, month - 1, d).getDay();
  return SCHED.find(s => _SWD[s.weekday] === wd
    && (!s.from_date || String(s.from_date) <= iso)
    && (!s.to_date || String(s.to_date) >= iso)) || null;
}
function thOnIso(iso) {
  const pre = year + '-' + String(month).padStart(2,'0') + '-';
  const s = (iso && String(iso).startsWith(pre)) ? schedOnDay(parseInt(String(iso).slice(8, 10), 10)) : null;
  return s ? s.therapist_id : (SCHED.length ? SCHED[SCHED.length - 1].therapist_id : null);
}
function schedThNames(nameOf) {
  return [...new Set(SCHED.map(s => s.therapist_id).filter(v => v != null))]
    .map(nameOf).filter(Boolean).join('·');
}

// ── 불러오기 ──
async function loadOne() {
  const idx = $('pChild').value;
  const mv  = $('pMonth').value;
  if (DIRTY && !confirm('저장하지 않은 내용이 있습니다.\n\n그래도 다른 기록지를 불러올까요?\n(적어 둔 내용은 사라집니다)')) return;
  if (idx === '') { alert('아동을 고르세요.'); return; }
  if (!mv) { alert('달을 고르세요.'); return; }

  cur = PAIRS[Number(idx)];
  year  = parseInt(mv.split('-')[0], 10);
  month = parseInt(mv.split('-')[1], 10);
  const mk = mkNow();

  $('pLoad').disabled = true; $('pLoad').textContent = '불러오는 중...';
  try {
    const [sc, lg, pr] = await Promise.all([
      sb.from('nl_therapy_schedules')
        .select('id, weekday, start_time, therapist_id, duration, from_month, to_month, from_date, to_date')
        .eq('therapy_id', cur.therapy_id),
      sb.from('nl_session_logs').select('*')
        .eq('child_id', cur.child.id)
        .eq('support_type_id', cur.support_type_id)
        .eq('month_key', mk).maybeSingle(),
      // 지난 달들 중 가장 최근 기록 — 수행수준·목표를 이어받는다
      sb.from('nl_session_logs').select('*')
        .eq('child_id', cur.child.id)
        .eq('support_type_id', cur.support_type_id)
        .lt('month_key', mk)
        .order('month_key', { ascending: false }).limit(1)
    ]);
    SCHED = schedInMonth(sc.data || []);
    PREV = (pr.data || [])[0] || null;

    LOGID = lg.data ? lg.data.id : null;
    ITEMS = [];
    if (LOGID) {
      const it = await sb.from('nl_session_items').select('*')
        .eq('log_id', LOGID).order('seq_no');
      ITEMS = it.data || [];
    }
    // 카드 결제 — 못 받아도 기록지는 그대로 연다
    PAY = []; PAYTOTAL = 0; PAYERR = ''; PAYEND = ''; MAN = []; AUTOCHG = false;
    // 이 달 전에 끝난 수업 — 결제 내역을 찾지 않고 「종결되었습니다」 (2026-10-09)
    //   누가기록지는 끝난 수업도 두 달까지 목록에 남긴다
    const tp0 = TPRAW.find(r => String(r.id) === String(cur.therapy_id));
    const endOn = tp0 && tp0.ended_on ? String(tp0.ended_on).slice(0, 10) : '';
    if (endOn && endOn < mk + '-01') PAYEND = endOn;
    if (!PAYEND) try {
      const pr2 = await sb.rpc('nl_support_pay', { p_therapy: cur.therapy_id, p_month: mk });
      if (pr2.error) throw pr2.error;
      PAY = (pr2.data || []).slice().sort((a, b) => a.seq - b.seq).slice(0, SESSIONS);
      PAYTOTAL = PAY.length ? Number(PAY[0].total || PAY.length) : 0;
    } catch (e2) { PAY = []; PAYERR = (e2 && e2.message) || String(e2); }
    // 면허 (위탁수수료 정산에 적은 것) · 결제 변경 관리 줄 — 못 받아도 기록지는 연다
    LICS = []; PCROWS = []; PCERR = '';
    try {
      const tids = [...new Set(SCHED.map(s => s.therapist_id).filter(v => v != null))];
      if (tids.length) {
        const lr = await sb.from('nl_th_licenses').select('therapist_id, lic_name, lic_no').in('therapist_id', tids).order('id');
        if (!lr.error) LICS = lr.data || [];
      }
    } catch (e3) {}
    await loadPc();
    LOADED = true;
    $('pInfo').textContent = mk + (LOGID ? ' · 저장된 기록 있음' : ' · 새로 작성');
    drawAll(lg.data);
    DIRTY = false;
    setSaveBtn(LOGID ? 'done' : 'before');
    // 결제 내역으로 칸이 바뀌었으면 「저장 전」
    if (AUTOCHG) { DIRTY = true; setSaveBtn('before');
      $('pInfo').textContent += ' · 카드 결제 내역으로 회기 일자를 채웠습니다 (저장 전)'; }
    if (PAYEND) $('pInfo').textContent += ' · 종결되었습니다 (' + parseInt(PAYEND.slice(5, 7), 10) + '월 '
      + parseInt(PAYEND.slice(8, 10), 10) + '일 종결)';
    else if (PAYERR) $('pInfo').textContent += ' · 카드 결제 내역을 읽지 못했습니다';
    else if (!PAY.length) $('pInfo').textContent += ' · 이 달 카드 결제 내역 없음';
    if (PAYTOTAL > SESSIONS) $('pInfo').textContent += ' · 결제 ' + PAYTOTAL + '건 — ' + SESSIONS + '건만 넣었습니다';
    const redN = PAY.filter((p, i) => p.flag && !MAN[i]).length;
    if (redN) $('pInfo').textContent += ' · 빨강 ' + redN + '회 — 고쳐 주세요';
  } catch (e) {
    alert('불러오지 못했습니다.\n' + e.message);
  } finally {
    $('pLoad').disabled = false; $('pLoad').textContent = '불러오기';
  }
}

// 그 달 수업일 (최대 3회)
function _classDays() {
  const M = { 일:0, 월:1, 화:2, 수:3, 목:4, 금:5, 토:6 };
  const dows = [...new Set(SCHED.map(s => M[s.weekday]).filter(v => v !== undefined))];
  if (!dows.length) return [];
  const last = new Date(year, month, 0).getDate();
  const out = [];
  for (let d = 1; d <= last; d++) {
    if (dows.includes(new Date(year, month - 1, d).getDay()) && schedOnDay(d)) out.push(d);
  }
  return out.slice(0, SESSIONS);
}
function _timeText() {
  if (!SCHED.length || !SCHED[0].start_time) return '';
  const p = String(SCHED[0].start_time).split(':');
  let h = parseInt(p[0],10), m = parseInt(p[1]||'0',10);
  const s = h + ':' + String(m).padStart(2,'0');
  const dur = SCHED[0].duration || 40;
  m += dur; h += Math.floor(m/60); m %= 60;
  return s + '-' + h + ':' + String(m).padStart(2,'0');
}

function drawAll(saved) {
  const c = cur.child;
  const areaName = TTYPE[cur.therapy_type_id] || '';
  $('pageTitle').textContent = `치료지원 누가기록서 — ${c.name} · ${SUPNAME[cur.support_type_id]} · ${year}년 ${month}월`
    + (schedThNames(id => THERAPISTS[id] || '') ? ' · 담당 ' + schedThNames(id => THERAPISTS[id] || '') + ' 선생님' : '');
  $('sheetTitle').textContent = `${areaName}치료 [ ${month} ]월 치료지원 누가기록서`;

  $('f_name').value   = c.name || '';
  $('f_birth').value  = fmtBirth(c.birth);
  // 이번 달 저장분 → 없으면 지난 기록 → 없으면 아동 표
  const pick = k => (saved && saved[k]) || (PREV && PREV[k]) || '';
  $('f_disab').value  = pick('disability_text');
  $('f_opinion').value = pick('month_summary') || '';
  $('f_school').value = pick('school_text') || c.school || '';
  $('f_grade').value  = pick('grade_text')  || c.grade_year || '';
  $('f_fine').value   = pick('level_fine');
  $('f_cog').value    = pick('level_cog');
  $('f_goalL').value  = pick('goal_long');
  $('f_goalS').value  = pick('goal_short');
  const carried = !saved && PREV;

  CONT = (saved && saved.continue_yn) || '';
  $('contBox').querySelectorAll('span').forEach(s =>
    s.classList.toggle('on', s.dataset.val === CONT));

  const tname = schedThNames(id => THERAPISTS[id] || '');
  $('signThr').textContent = tname || '\u00a0';
  // 작성일 = 그 달 마지막 수업일. 저장된 값이 있으면 그것을 쓴다
  let wd = saved && saved.written_on ? String(saved.written_on) : '';
  if (!wd) {
    const ds = _classDays();
    if (ds.length) {
      wd = year + '-' + String(month).padStart(2,'0')
         + '-' + String(ds[ds.length - 1]).padStart(2,'0');
    }
  }
  WRITTEN = wd || null;
  $('signDate').innerHTML = wd
    ? `${wd.slice(0,4)}년 ${parseInt(wd.slice(5,7),10)}월 ${parseInt(wd.slice(8,10),10)}일`
    : '20&nbsp;&nbsp;&nbsp;년&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;월&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;일';

  if (carried) {
    $('pInfo').textContent += ' · 지난 기록(' + PREV.month_key + ')에서 목표를 이어받았습니다';
  }
  buildSeq();
  drawTT();
  drawPc();
}

const WDK = ['일','월','화','수','목','금','토'];
function curTh() {   // 이 달 담당 — 그 달 마지막 요일줄 선생님

function licText(tid) {

                       && kw && String(l.lic_name || '').indexOf(kw) >= 0)

function drawTT() {

    + '<div class="tt-th">□ 치료사 정보</div>'
    + '<table class="rec-tbl" style="margin-top:6px;"><colgroup><col style="width:15%"><col style="width:35%"><col style="width:15%"><col style="width:35%"></colgroup>'
    + '<tr><td class="lbl">이름</td><td>' + esc(tid ? (THERAPISTS[tid] || '') : '') + '</td><td class="lbl">성별</td><td>' + esc(tid ? (THGENDER[tid] || '') : '') + '</td></tr>'
    + '<tr><td class="lbl">치료기관</td><td>자라는 나무</td><td class="lbl">면허 번호</td><td>' + esc(tid ? licText(tid) : '') + '</td></tr></table>'

// ════════════════════════════════════════════════════════════════
// [서식 3] 치료지원 결제 내역 변경 관리 (2026-10-09)
//   셈은 서버 nl_pay_change_rows 한 곳 (결제가 이름 · 그날 수업 없음 · 같은 날 2건 · 3건 넘음 ·
//   40,000원 아닌 결제 · 결석 뒤 보강) + 직원이 덧붙인 사유 · 직접 넣은 줄 (nl_pay_change_notes)
//   보호자 서명은 종이에 직접

const PC_CATS = ['수업일시 변경', '결제일 변경', '결제금액 변경'];
async function loadPc() {
  PCROWS = []; PCERR = '';
  if (!cur) return;
  try {
    const { data, error } = await sb.rpc('nl_pay_change_rows', { p_therapy: cur.therapy_id, p_year: year });
    if (error) throw error;
    PCROWS = data || [];
  } catch (e) { PCERR = (e && e.message) || String(e); }
}
function pcDate(d) {
  if (!d) return '';
  const s = String(d).slice(0, 10), dt = new Date(s + 'T00:00:00');
  return parseInt(s.slice(5, 7), 10) + '. ' + parseInt(s.slice(8, 10), 10) + '.(' + WDK[dt.getDay()] + ')';
}
function pcAttr(s) { return esc(s || '').replace(/"/g, '&quot;'); }
// 서식 안에서 바로 고친다 (2026-10-09 은정님) — 사유 칸 · 저장 · 서식에서 빼기 / 되살리기 · 직접 줄 넣기
//   화면에서만 보이는 것(단추 · 뺀 줄 · 넣기 줄)은 인쇄되지 않는다. 연번은 인쇄되는 줄만 센다
function drawPc() {
  const box = $('pcSheet');
  if (!box || !cur) return;
  const c = cur.child;
  const act = SCHED.filter(s => s.weekday);
  const days = [...new Set(act.map(s => s.weekday))].join(', ');
  const times = [...new Set(act.map(s => {
    if (!s.start_time) return '';
    const p = String(s.start_time).split(':'); let h = +p[0], m = +p[1] + (s.duration || 40);
    const st = String(p[0]).padStart(2, '0') + ':' + String(p[1]).padStart(2, '0');
    h += Math.floor(m / 60); m %= 60;
    return st + '-' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }).filter(Boolean))].join(', ');
  const tt = TTYPE[cur.therapy_type_id] || '';
  const area = ['작업', '물리', '언어'].map(a => '<span' + (a === tt ? ' class="on"' : '') + '>' + a + '</span>').join(' / ');
  const catHtml = cat => PC_CATS.map(x => '<span' + (cat === x ? ' class="on"' : '') + '>' + x + '</span>').join('<br>');

  let rows = '', vn = 0;

    const lead = (r.is_manual && r.on_date ? esc(pcDate(r.on_date)) + ' ' : '');
    rows += '<tr class="pcrow' + (r.hidden ? ' pc-hid' : '') + '" data-i="' + i + '">'
      + '<td class="pcno" style="text-align:center;">' + (r.hidden ? '—' : vn) + '</td>'
      + '<td class="pc-cat">' + catHtml(r.category) + '</td>'
      + '<td><div>- ' + lead + esc(r.auto_text || '')
      + (r.is_manual ? ' <span class="no-print" style="color:#A39C95;font-size:10.5px;">(직접)</span>' : '') + '</div>'
      + '<input type="text" class="pcnote" maxlength="300" value="' + pcAttr(r.note) + '" placeholder="사유 (예: 학부모 카드 미소지)">'
      + (r.note ? '<div class="pcnote-p">' + esc(r.note) + '</div>' : '')
      + '</td>'
      + '<td><div class="pcbtns no-print">'
      + '<button type="button" class="pcsave">저장</button>'
      + '<button type="button" class="pchide">' + (r.hidden ? '되살리기' : '빼기') + '</button>'
      + (r.is_manual ? '<button type="button" class="pcdel">지우기</button>' : '')
      + '</div></td></tr>';
  });
  for (let k = vn; k < 15; k++) {
    rows += '<tr class="pcblank"><td style="text-align:center;">' + (k + 1) + '</td><td class="pc-cat">' + catHtml('') + '</td><td></td><td></td></tr>';
  }
  // 직접 줄 넣기 — 화면에서만
  rows += '<tr class="no-print pcadd"><td style="text-align:center;font-weight:bold;">＋</td>'
    + '<td><select id="pcNewCat">' + PC_CATS.map(x => '<option>' + x + '</option>').join('') + '</select></td>'
    + '<td><input type="text" id="pcNewDate" placeholder="날짜 ' + year + '-09-02" style="width:150px !important;margin:0 0 4px !important;">'
    + '<input type="text" id="pcNewText" maxlength="300" placeholder="변경 내용 (예: 결제금액 중 20,000은 학부모 개인 결제)"></td>'
    + '<td><div class="pcbtns"><button type="button" id="pcNewBtn">넣기</button></div></td></tr>';

  box.innerHTML =
      // 대장 바로 위 인쇄 단추 (화면에서만) — 대장만 따로 인쇄 (2026-10-09)
      '<div class="no-print pcprintbar"><span>한 해 한 장 · 달과 상관없이 ' + year + '년 전체가 모입니다</span>'
    + '<button type="button" class="pcprint">이 대장만 인쇄</button></div>'
    + '<div style="font-size:11px;color:#555;">[서식 3] 치료지원 결제 내역 변경 관리 대장(학생별 누가기록서 앞면에 편철)</div>'
    + '<h2 class="title">(' + year + '년도) 치료지원 결제 내역 변경 관리</h2>'
    + '<div class="pc-sub">기관명: 자라는 나무</div>'
    + (PCERR ? '<div class="no-print" style="color:#c62828;font-size:12px;margin-bottom:6px;">결제 변경 줄을 읽지 못했습니다.</div>' : '')
    + '<table class="rec-tbl"><colgroup><col style="width:16%"><col style="width:34%"><col style="width:16%"><col style="width:34%"></colgroup>'
    + '<tr><td class="lbl">학생명</td><td>' + esc(c.name || '') + '</td><td class="lbl">치료영역</td><td class="pc-area" style="text-align:center;">' + area + '</td></tr>'
    + '<tr><td class="lbl">학교명</td><td>' + esc($('f_school').value.trim() || c.school || '') + '</td><td class="lbl">치료사명</td><td>' + esc(schedThNames(id => THERAPISTS[id] || '')) + '</td></tr>'
    + '<tr><td class="lbl">수강 요일</td><td>' + esc(days) + '</td><td class="lbl">수강 시간</td><td>' + esc(times) + '</td></tr></table>'
    + '<table class="rec-tbl pc-tbl" style="margin-top:-1px;"><colgroup><col style="width:7%"><col style="width:17%"><col style="width:56%"><col style="width:20%"></colgroup>'
    + '<tr><th>연번</th><th>변경 사항</th><th>변경 내용</th><th>보호자 서명</th></tr>' + rows + '</table>'
    + '<div class="pcmsg no-print" id="pcMsg"></div>'
    + '<div class="pc-note">※ 변경 내용: 오전 결제 및 중복 결제 사유, 보강 내역 등을 기재<br>※ 치료지원 제공기관에서 필요시 활용(의무 아님, 수정 가능)</div>'
    + '<div class="sheetlogo"><img src="img/nl-logo.png" alt="자라는나무"></div>';
  box.style.display = 'block';
  if ($('pcEdit')) $('pcEdit').style.display = 'none';
}
function pcMsg(t, ok) { const m = $('pcMsg'); if (m) { m.textContent = t; m.style.color = ok ? '#3B6D11' : '#c62828'; } }
let PC_BUSY = false;
async function pcUpsert(row) {
  const { data, error } = await sb.from('nl_pay_change_notes')
    .upsert(Object.assign({ therapy_id: cur.therapy_id, updated_by: ME ? ME.id : null,
                            updated_at: new Date().toISOString() }, row), { onConflict: 'therapy_id,row_key' })
    .select('id');
  if (error) throw error;
  if (!data || !data.length) throw new Error('저장되지 않았습니다.');
}
// 서식 안의 칸은 기록지 「저장 전」과 따로 — 위로 올라가지 않게 막는다
['input', 'change'].forEach(ev => $('pcSheet').addEventListener(ev, e => e.stopPropagation()));
// 사유 칸에서 Enter = 그 줄 저장
$('pcSheet').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.classList.contains('pcnote')) return;
  e.preventDefault();
  const b = e.target.closest('tr').querySelector('.pcsave'); if (b) b.click();
});
$('pcSheet').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || PC_BUSY || !cur) return;
  const tr = b.closest('tr'); const r = (tr && tr.dataset.i != null) ? PCROWS[Number(tr.dataset.i)] : null;
  PC_BUSY = true;
  try {
    if (b.classList.contains('pcsave') && r) {
      await pcUpsert({ row_key: r.row_key, on_date: r.on_date, category: r.category,
                       manual_text: r.is_manual ? r.auto_text : null,
                       note: tr.querySelector('.pcnote').value.trim() || null, hidden: !!r.hidden });
      pcMsg('✓ 저장했습니다.', true);
    } else if (b.classList.contains('pchide') && r) {
      await pcUpsert({ row_key: r.row_key, on_date: r.on_date, category: r.category,
                       manual_text: r.is_manual ? r.auto_text : null,
                       note: tr.querySelector('.pcnote').value.trim() || null, hidden: !r.hidden });
      pcMsg(r.hidden ? '✓ 서식에 되살렸습니다.' : '✓ 서식에서 뺐습니다. (화면에는 흐리게 남고 인쇄에는 안 나옵니다)', true);
    } else if (b.classList.contains('pcdel') && r && r.is_manual) {
      if (!confirm('이 줄을 지울까요?')) { PC_BUSY = false; return; }
      const { data, error } = await sb.from('nl_pay_change_notes').delete()
        .eq('therapy_id', cur.therapy_id).eq('row_key', r.row_key).select('id');
      if (error) throw error;
      if (!data || !data.length) throw new Error('지우지 못했습니다.');
      pcMsg('✓ 지웠습니다.', true);
    } else if (b.classList.contains('pcprint')) {
      PC_BUSY = false; pcPrint(); return;
    } else if (b.id === 'pcNewBtn') {
      const ds = $('pcNewDate').value.trim(), tx = $('pcNewText').value.trim();
      const iso = d2iso(ds);
      if (!iso || isNaN(new Date(iso + 'T00:00:00')) || Number(iso.slice(0, 4)) !== year) {
        pcMsg('날짜를 ' + year + '-09-02 처럼 적어 주세요 (' + year + '년 안).', false); PC_BUSY = false; return; }
      if (!tx) { pcMsg('변경 내용을 적어 주세요.', false); PC_BUSY = false; return; }
      await pcUpsert({ row_key: 'man|' + Date.now(), on_date: iso, category: $('pcNewCat').value,
                       manual_text: tx, note: null, hidden: false });
      pcMsg('✓ 넣었습니다.', true);
    } else { PC_BUSY = false; return; }
    const keep = $('pcMsg') ? $('pcMsg').textContent : '';
    await loadPc(); drawPc();
    pcMsg(keep, true);
  } catch (err) {
    pcMsg('❌ ' + ((err && err.message) || err), false);
  } finally { PC_BUSY = false; }
});
// 저장하지 않은 사유 칸 (나갈 때 묻기)
function pcPendingN() {
  let n = 0;
  document.querySelectorAll('#pcSheet tr.pcrow').forEach(tr => {
    const r = PCROWS[Number(tr.dataset.i)]; if (!r) return;
    if (tr.querySelector('.pcnote').value.trim() !== String(r.note || '').trim()) n++;
  });
  return n;
}
window.addEventListener('beforeunload', e => {
  if (!pcPendingN()) return;
  e.preventDefault(); e.returnValue = '';
});
// 결제 변경 관리만 따로 인쇄
function pcPrint() {
  if (!LOADED || !cur) { alert('먼저 아동과 달을 고르고 [불러오기]를 누르세요.'); return; }
  document.body.classList.add('print-pc');
  window.print();
}
$('btnPrintPc').addEventListener('click', pcPrint);
window.addEventListener('afterprint', () => document.body.classList.remove('print-pc'));

// ── 카드 결제 칸 (2026-10-09) ──
function _hm5(v) { return v ? String(v).slice(0, 5) : ''; }
function payDateText(p) {
  const s = String(p.paid_on || '');
  return s.length >= 10 ? parseInt(s.slice(5, 7), 10) + '월 ' + parseInt(s.slice(8, 10), 10) + '일' : '';
}
function payClsText(p) { return (p.cls_start && p.cls_end) ? _hm5(p.cls_start) + '-' + _hm5(p.cls_end) : ''; }
function payLine(p, man) {
  if (!p) return '';
  let s = '결제 ' + esc(_hm5(p.paid_time));
  if (p.flag && !man) s += '<br>⚠ ' + esc(p.flag);
  return s;
}
function paintRow(tr) {
  const i = Number(tr.dataset.i), p = PAY[i] || null;
  const red = !!(p && p.flag && !MAN[i]);
  tr.querySelector('.q_date').classList.toggle('red', red);
  tr.querySelector('.q_time').classList.toggle('red', red);
  const pd = tr.querySelector('.q_pay');
  pd.classList.toggle('red', red);
  pd.innerHTML = payLine(p, MAN[i]);
}
// 선생님이 일자·시간 칸을 고치면 그 회는 「직접 고침」 → 검정
$('seqBody').addEventListener('input', e => {
  if (!e.target.matches('.q_date, .q_time')) return;
  const tr = e.target.closest('tr'); if (!tr) return;
  MAN[Number(tr.dataset.i)] = true;
  paintRow(tr);
  drawTT();
});
// 두 칸을 모두 비우고 나가면 다시 카드 결제 내용으로
$('seqBody').addEventListener('change', e => {
  if (!e.target.matches('.q_date, .q_time')) return;
  const tr = e.target.closest('tr'); if (!tr) return;
  const i = Number(tr.dataset.i), p = PAY[i] || null;
  const qd = tr.querySelector('.q_date'), qt = tr.querySelector('.q_time');
  if (qd.value.trim() || qt.value.trim()) return;
  MAN[i] = false;
  if (p) { qd.value = payDateText(p); qt.value = payClsText(p); }
  paintRow(tr);
  drawTT();
});

function buildSeq() {
  const tb = $('seqBody');
  tb.innerHTML = '';
  for (let i = 0; i < SESSIONS; i++) {
    const it = ITEMS[i] || {};
    // 회기 일자 = 카드 결제 일자 (1순위 · 2026-10-09)
    // 둘째 칸 = 그날 이 수업 회기 시간 · 아래에 결제 시각
    // 결제가 없는 회는 저장된 값 그대로 (선생님이 적음)
    const d  = it.service_date ? parseInt(String(it.service_date).slice(8,10),10) : '';
    const st = it.start_time ? String(it.start_time).slice(0,5) : '';
    const en = it.end_time   ? String(it.end_time).slice(0,5)   : '';
    const timeVal = (st && en) ? (st + '-' + en) : (st || en || '');
    // 카드 결제가 1순위 (2026-10-09). 선생님이 직접 고친 회(state_json.man)는 고친 내용 그대로
    const savedD = d ? month + '월 ' + d + '일' : '';
    const p = PAY[i] || null;
    const man = !!(it.state_json && it.state_json.man);
    MAN[i] = man;
    let dVal = savedD, tVal = timeVal;
    if (!man && p) {
      dVal = payDateText(p); tVal = payClsText(p);
      if (dVal !== savedD || tVal !== timeVal || String(it.voucher_no || '') !== String(p.appr_no || '')) AUTOCHG = true;
    }
    const red = !!(p && p.flag && !man);
    const tr = document.createElement('tr');
    tr.dataset.i = String(i);
    tr.innerHTML =
        '<td style="text-align:center;">'
      + '<div style="font-weight:bold;margin-bottom:4px;">' + (i+1) + '회</div>'
      + '<input type="text" class="q_date' + (red ? ' red' : '') + '" value="' + esc(dVal) + '" style="text-align:center;">'
      + '<input type="text" class="q_time' + (red ? ' red' : '') + '" value="' + esc(tVal) + '" style="text-align:center;margin-top:3px;">'
      + '<div class="q_pay' + (red ? ' red' : '') + '">' + payLine(p, man) + '</div>'
      + '</td>'
      + '<td><textarea class="q_content" style="min-height:64px;">' + esc(it.content || '') + '</textarea></td>'
      + '<td><textarea class="q_react" style="min-height:64px;">' + esc(it.reaction || '') + '</textarea></td>';
    tb.appendChild(tr);
  }
}

// ── 저장 ──
async function saveRecord() {
  if (!LOADED || !cur) { alert('먼저 아동과 달을 고르고 [불러오기]를 누르세요.'); return; }
  const mk = mkNow();
  SAVING = true;
  setSaveBtn('saving');
  try {
    const logRow = {
      child_id: cur.child.id, support_type_id: cur.support_type_id, month_key: mk,
      therapist_id: SCHED.length ? SCHED[SCHED.length - 1].therapist_id : null,
      goal_long:  $('f_goalL').value || null,
      goal_short: $('f_goalS').value || null,
      level_fine: $('f_fine').value  || null,
      level_cog:  $('f_cog').value   || null,
      school_text: $('f_school').value || null,
      grade_text:  $('f_grade').value  || null,
      disability_text: $('f_disab').value || null,
      continue_yn: CONT || null,
      month_summary: $('f_opinion').value || null,
      written_on: WRITTEN || null,
      updated_at: new Date().toISOString()
    };
    // 잠금 uq_session_log_th — 아동·지원유형·달·수업 (2026-09-11)
    const { data: lg, error: e1 } = await sb.from('nl_session_logs')
      .upsert(logRow, { onConflict: 'child_id,support_type_id,month_key,therapy_id' })
      .select('id').single();
    if (e1) throw e1;
    LOGID = lg.id;


    const trs = document.querySelectorAll('#seqBody tr');
    const items = [];
    trs.forEach((tr, i) => {
      const dtxt = tr.querySelector('.q_date').value;
      const dm = dtxt.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
      const iso = dm
        ? year + '-' + String(dm[1]).padStart(2,'0') + '-' + String(dm[2]).padStart(2,'0')
        : d2iso(dtxt);
      const tv = tr.querySelector('.q_time').value.split(/[-~]/);
      items.push({
        log_id: LOGID, seq_no: i + 1,
        service_date: iso,
        start_time: _hm(tv[0] || ''),
        end_time:   _hm(tv[1] || ''),
        therapist_id: thOnIso(iso),
        // 카드 결제 (2026-10-09) — 승인일자·승인번호 · 직접 고침 표시
        voucher_date: PAY[i] ? PAY[i].paid_on : null,
        voucher_no:   PAY[i] ? (PAY[i].appr_no || null) : null,
        state_json: { man: !!MAN[i],
                      pay_at: PAY[i] ? _hm5(PAY[i].paid_time) : null,
                      flag: (PAY[i] && !MAN[i]) ? (PAY[i].flag || null) : null },
        content:  tr.querySelector('.q_content').value || null,
        reaction: tr.querySelector('.q_react').value || null,
        status: '출석'
      });
    });
    // 회차 줄은 다 만든 뒤에 바꾼다 (2026-09-21)
    //   전에는 먼저 지우고 나서 만들어 넣었는데, 넣다가 실패하면(시간 글자 잘못 등)
    //   적어 둔 내용이 모두 사라졌다 → 옛 줄을 들고 있다가 실패하면 되돌린다
    const old = await sb.from('nl_session_items').select('*').eq('log_id', LOGID);
    if (old.error) throw old.error;
    const del = await sb.from('nl_session_items').delete().eq('log_id', LOGID);
    if (del.error) throw del.error;
    const ins = await sb.from('nl_session_items').insert(items);
    if (ins.error) {
      const back = (old.data || []).map(r => { const c = Object.assign({}, r); delete c.id; return c; });
      if (back.length) await sb.from('nl_session_items').insert(back);
      throw new Error('저장하지 못해 전에 적은 내용으로 되돌렸습니다.\n' + ins.error.message);
    }

    // 학교·학년을 아동 표에도 남긴다 (다음부터 자동으로 채워짐)
    const sc = $('f_school').value.trim(), gy = $('f_grade').value.trim();
    if (sc || gy) {
      await sb.from('nl_children')
        .update({ school: sc || null, grade_year: gy || null })
        .eq('id', cur.child.id);
      cur.child.school = sc; cur.child.grade_year = gy;
    }

    ITEMS = items;
    // 저장 알림 창은 뺐다 — 단추 모양이 알려 준다 (2026-09-16)
    $('pInfo').textContent = mk + ' · 저장됨';
    DIRTY = false;
    setSaveBtn('done');
  } catch (e) {
    alert('❌ 저장하지 못했습니다.\n' + e.message);
    setSaveBtn('before');
  } finally {
    setTimeout(() => { SAVING = false; }, 300);
  }
}

// ── 저장 단추 상태 (2026-09-16) ──
//   before 저장 전 / saving 저장 중 / done 저장됨
//   칸을 고치면 다시 「저장 전」. 저장 전인 채 나가면 묻는다
let DIRTY  = false;
let SAVING = false;
function setSaveBtn(st) {
  const b = $('btnSave');
  if (!b) return;
  b.classList.toggle('done', st === 'done');
  b.disabled = (st === 'saving');
  b.textContent = st === 'saving' ? '저장 중…'
                : st === 'done'   ? '\u2713 저장됨'
                : '저장 전';
}
function markDirty() {
  if (!LOADED || SAVING) return;
  DIRTY = true;
  setSaveBtn('before');
}
document.querySelector('.container').addEventListener('input',  markDirty);
document.querySelector('.container').addEventListener('change', markDirty);
window.addEventListener('beforeunload', e => {
  if (!DIRTY) return;
  e.preventDefault();
  e.returnValue = '';
});

$('pLoad').onclick = loadOne;
// 초기 상담·평가보고서 보기 전용 창 (2026-09-15)
$('pIntake').onclick = () => {
  if ($('pChild').value === '') { alert('아동을 고르세요.'); return; }
  const cid = (PAIRS[Number($('pChild').value)] || {child:{}}).child.id;
  if (!cid) { alert('아동을 고르세요.'); return; }
  if (!window.NLDocs) { alert('보기 창을 불러오지 못했습니다. 화면을 새로 열어 주세요.'); return; }
  NLDocs.openIntake(cid);
};
$('btn').onclick = async () => {
  const email = $('em').value.trim().toLowerCase();
  const pw    = $('pw').value;
  if (!email || !pw) { show($('msg'), '이메일과 비밀번호를 모두 입력하세요.', false); return; }
  $('btn').disabled = true; $('btn').textContent = '로그인 중...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await afterLogin(data.user);
  } catch (e) {
    show($('msg'), '❌ 로그인 실패\n' + e.message, false);
  } finally {
    $('btn').disabled = false; $('btn').textContent = '로그인';
  }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) { await afterLogin(data.session.user); }
  else {
    // 로그인이 없으면 첫 화면으로 보낸다 (빈 화면이 열리는 것을 막기 위함)
    location.replace('index.html');
  }
})();
</script>
<script>
// 인쇄할 때 글상자의 높이를 내용만큼 늘린다 (2026-09-10)
//   그래야 긴 글이 잘리지 않고 다음 장으로 넘어간다
(function(){
  var saved = [];
  function grow(){
    saved = [];
    var list = document.querySelectorAll('textarea');
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      saved.push([a, a.style.height]);
      a.style.height = 'auto';
      a.style.height = (a.scrollHeight + 4) + 'px';
    }
  }
  function back(){
    for (var i = 0; i < saved.length; i++) saved[i][0].style.height = saved[i][1];
    saved = [];
  }
  window.addEventListener('beforeprint', grow);
  window.addEventListener('afterprint', back);
  if (window.matchMedia) {
    var mq = window.matchMedia('print');
    if (mq.addEventListener) {
      mq.addEventListener('change', function(e){ if (e.matches) grow(); else back(); });
    }
  }
})();
</script>

<!-- 아동 이름 타자로 찾기 (2026-09-17) — 안쪽 고르기 칸(#pChild)은 숨겨 두고 그대로 쓴다 -->
<style>
  .kidpickwrap { position:relative; display:inline-block; vertical-align:middle; }
  #pChildQ { min-width:260px; padding:6px 10px; font:inherit; font-size:14px;
             border:1px solid #ccc; border-radius:6px; background:#fff; }
  #pChildList { position:absolute; left:0; top:100%; z-index:50; min-width:100%; max-height:320px;
                overflow-y:auto; background:#fff; border:1px solid #ccc; border-radius:6px;
                box-shadow:0 4px 14px rgba(0,0,0,.12); display:none; margin-top:2px; }
  #pChildList div { padding:6px 10px; font-size:13.5px; cursor:pointer; white-space:nowrap; }
  #pChildList div.on, #pChildList div:hover { background:#F8F1E8; }
  #pChildList .none { color:#999; cursor:default; }
  @media print { .kidpickwrap { display:none !important; } }
</style>
<script>
(function () {
  const sel = document.getElementById('pChild');
  if (!sel) return;
  sel.style.display = 'none';
  const wrap = document.createElement('span');
  wrap.className = 'kidpickwrap';
  wrap.innerHTML = '<input id="pChildQ" type="text" autocomplete="off" placeholder="아동 이름이나 번호를 치세요">'
                 + '<div id="pChildList"></div>';
  sel.parentNode.insertBefore(wrap, sel);
  const q = document.getElementById('pChildQ'), box = document.getElementById('pChildList');
  let hits = [], cur = -1;
  const opts = () => Array.from(sel.options).filter(o => o.value !== '');
  function show() {
    const t = q.value.trim().toLowerCase();
    hits = opts().filter(o => !t || o.text.toLowerCase().includes(t)
      || (/^\d+$/.test(t) && String(o.dataset.cid || '') === t));
    cur = hits.length ? 0 : -1;
    box.innerHTML = hits.length
      ? hits.map((o, i) => '<div data-i="' + i + '"' + (i === cur ? ' class="on"' : '') + '>'
          + o.text.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</div>').join('')
      : '<div class="none">찾는 아동이 없습니다</div>';
    box.style.display = 'block';
  }
  function mark() {
    box.querySelectorAll('div[data-i]').forEach(d => d.classList.toggle('on', Number(d.dataset.i) === cur));
    const el = box.querySelector('div.on'); if (el) el.scrollIntoView({ block: 'nearest' });
  }
  function pick(o) {
    sel.value = o.value;
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    q.value = o.text;
    q.dataset.picked = o.value;
    box.style.display = 'none';
  }
  q.addEventListener('focus', () => { q.select(); show(); });
  q.addEventListener('input', () => { q.dataset.picked = ''; show(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { if (hits.length) { cur = (cur + 1) % hits.length; mark(); } e.preventDefault(); }
    else if (e.key === 'ArrowUp') { if (hits.length) { cur = (cur - 1 + hits.length) % hits.length; mark(); } e.preventDefault(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (box.style.display === 'block' && hits[cur]) pick(hits[cur]);
      else if (q.dataset.picked) { const b = document.getElementById('pLoad'); if (b) b.click(); }
    }
    else if (e.key === 'Escape') { box.style.display = 'none'; }
  });
  box.addEventListener('mousedown', e => {
    const d = e.target.closest('div[data-i]'); if (!d) return;
    e.preventDefault(); pick(hits[Number(d.dataset.i)]);
  });
  q.addEventListener('blur', () => setTimeout(() => {
    box.style.display = 'none';
    // 고르지 않고 나가면 지금 고른 아동 이름으로 되돌린다
    const o = sel.options[sel.selectedIndex];
    q.value = (o && o.value !== '') ? o.text : '';
  }, 150));
  // 목록이 다시 그려지면(달·전체 보기 바꿈) 칸 글자를 맞춘다
  new MutationObserver(() => {
    const o = sel.options[sel.selectedIndex];
    if (document.activeElement !== q) q.value = (o && o.value !== '') ? o.text : '';
  }).observe(sel, { childList: true });
})();
</script>
