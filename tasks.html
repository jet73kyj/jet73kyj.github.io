<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할 일 목록 - 나무링크</title>
<!-- 할 일 목록 — 지금은 원장님(8번)만 (2026-10-07 은정님 · 신규 직원 채용 뒤 직원 화면을 엶)
     표 nl_task_rules(늘 하는 일) · nl_tasks(날마다 할 일) · 새벽 5시 nl_make_tasks 가 그날 목록을 만듦
     상태 — 할 일 · 하는 중 · 끝냄 · 미룸(다른 날로 · 그 날에 「미룬 일」이 저절로) · 못 함(사유 반드시)
     업무일지 (2026-10-10 · 한 화면) — 달력 → 날짜를 누르면 그 날 할 일 → 할 일 글을 누르면 그 일의 업무일지
       업무일지 nl_work_notes (+ task_id 어느 할 일 · 비면 「할 일 없이 적은 일지」 — 민원 · 기타)
       결과는 업무일지 결과 칸에 (nl_tasks.result 는 화면에서 쓰지 않음 · 적힌 것이 있으면 보이기만)
       늘 하는 일 설정 · 직원별 이 달 확인 · 이 달 업무일지 모아 보기 — 아래에 접어 둠
-->
<style>
  :root{ --bg:#F5F4F2; --sf:#FFFFFF; --line:#ECE8E3; --tx:#2F2926; --dim:#A39C95;
         --cam:#B07A4A; --camL:#F8F1E8; --camB:#C9A27E; --sage:#5E9A6E; --coral:#D8684A; --coralL:#FCEFEA; }
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg); margin:0; color:var(--tx); }
  .hd { background:var(--sf); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; }
  .hd img.lg { height:22px; } .hd .bar { width:1px; height:16px; background:var(--line); }
  .hd h1 { font-size:15px; font-weight:600; margin:0; } .hd .who { font-size:12px; color:var(--dim); } .hd .sp { flex:1 1 auto; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; }
  button { font:inherit; border-radius:8px; padding:6px 12px; font-size:13px; background:var(--sf); color:var(--tx); border:1px solid #CFC8C0; cursor:pointer; }
  button:hover { background:var(--camL); } button.pri { background:var(--cam); color:#fff; border-color:var(--cam); }
  button.grey { border-color:var(--line); color:var(--cam); }
  input, select { font:inherit; font-size:13px; padding:6px 8px; border-radius:8px; border:1px solid #DDD6CE; background:#fff; }
  .card { background:var(--sf); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .ct { font-size:14px; font-weight:600; margin:0 0 10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tk { border-top:1px solid #F0EEEA; padding:9px 0; display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .tk:first-child { border-top:none; }
  .tk .t { flex:1 1 260px; min-width:0; line-height:1.6; }
  .tk .src { font-size:11.5px; color:var(--dim); margin-left:6px; }
  .st { display:flex; gap:4px; flex-wrap:wrap; }
  .st button { padding:4px 9px; font-size:12px; border-color:var(--line); color:var(--dim); }
  .st button.on { color:#fff; border-color:transparent; }
  .on.s1 { background:#C4BDB5; } .on.s2 { background:#EDBF5F; } .on.s3 { background:#5E9A6E; } .on.s4 { background:#8DB4DE; } .on.s5 { background:#D8684A; }
  .late { background:var(--coralL); border-radius:8px; padding:8px 10px; margin-bottom:10px; }
  .msg { font-size:13px; margin-top:8px; white-space:pre-wrap; } .ok { color:#2e7d32; } .err { color:#c62828; }
  /* 늘 하는 일 줄 — 누르면 고치기 · 새로 저장한 줄 · 고치는 줄 색 (2026-10-09) */
  tr.rrow { cursor:pointer; } tr.rrow:hover td { background:#FBF5EE; }
  tr.rrow.rnew td { background:#E8F5E9; } tr.rrow.redit td { background:#F3ECE3; font-weight:600; }
  .rdel { color:#c62828 !important; border-color:#efc9c9 !important; }
  #rmsg { font-size:13px; font-weight:600; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th { background:var(--camL); color:#4A1B0C; font-weight:500; padding:6px 9px; border-bottom:1px solid var(--camB); text-align:left; white-space:nowrap; }
  td { padding:6px 9px; border-bottom:1px solid #F0EEEA; }
  .dim { color:var(--dim); } .note { font-size:12px; color:var(--dim); line-height:1.8; margin-top:8px; }
  /* 업무일지 — 갈래 · 결과 · 일지 · 한 달 달력 (2026-10-10) */
  .tabs { display:flex; gap:18px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .tabs button { border:none; border-radius:0; background:none; padding:8px 0; color:var(--dim); border-bottom:2px solid transparent; }
  .tabs button.on { color:var(--tx); border-bottom-color:var(--cam); font-weight:600; }
  .tabs button:hover { background:none; color:var(--tx); }
  .res { font-size:12.5px; color:#3B5E44; margin-top:3px; white-space:pre-wrap; }
  .lnk { border:none !important; background:none !important; color:var(--cam) !important; padding:2px 0 !important; font-size:12.5px !important; }
  textarea { font:inherit; font-size:13px; padding:6px 8px; border-radius:8px; border:1px solid #DDD6CE; width:100%; box-sizing:border-box; min-height:54px; resize:vertical; }
  .bdg { display:inline-block; border-radius:6px; padding:1px 7px; font-size:12px; margin-right:4px; }
  .k1 { background:#EEEDFE; color:#3C3489; } .k2 { background:#FBEAF0; color:#72243E; } .k3 { background:#FAEEDA; color:#633806; } .k4 { background:#F1EFE8; color:#444441; }
  .ns1 { background:#F1EFE8; color:#444441; } .ns2 { background:#FAEEDA; color:#633806; } .ns3 { background:#EAF3DE; color:#27500A; }
  .wn { border-top:1px solid #F0EEEA; padding:9px 0; font-size:13px; line-height:1.6; }
  .wn:first-child { border-top:none; } .wn .ln { font-size:12.5px; white-space:pre-wrap; }
  .wn.edit { background:#F3ECE3; border-radius:8px; padding:9px 10px; }
  .nf { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:8px; margin-top:12px; border-top:1px solid var(--line); padding-top:12px; }
  .nf label { font-size:12px; color:var(--dim); display:block; margin-bottom:3px; }
  .cal { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:6px; font-size:12px; }
  .cal .h { text-align:center; color:var(--dim); }
  .cal .c { border:1px solid var(--line); border-radius:8px; padding:5px 6px; min-height:52px; cursor:pointer; line-height:1.5; }
  .cal .c:hover { background:#FBF5EE; } .cal .c.off { color:var(--dim); background:#FAFAF8; }
  .cal .c.sel { border:2px solid var(--cam); padding:4px 5px; } .cal .c.blank { border:none; cursor:default; background:none; }
  .cal .ok3 { color:#3B6D11; } .cal .ok2 { color:#854F0B; } .cal .bad { color:#A32D2D; }
  .kf { display:flex; gap:4px; flex-wrap:wrap; }
  details.fold > summary { cursor:pointer; list-style:none; margin:0; }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary::before { content:'▸'; color:var(--cam); margin-right:2px; }
  details.fold[open] > summary::before { content:'▾'; } details.fold[open] > summary { margin-bottom:10px; }
  .tk .t[data-topen] { cursor:pointer; border-radius:6px; } .tk .t[data-topen]:hover { background:#FBF5EE; }
  .tk.topen > .t { background:#F8F1E8; }
  .kf button { padding:3px 9px; font-size:12px; } .kf button.on { background:var(--camL); border-color:var(--camB); }
</style>
</head>
<body>
<div class="hd">
  <img src="img/nl-logo.png" alt="" class="lg" onerror="this.style.display='none'">
  <span class="bar"></span><h1>할 일 목록</h1><span class="who" id="whoami"></span><span class="sp"></span>
  <button id="home" class="grey">처음으로</button>
</div>
<div class="wrap" id="body"><div class="dim">불러오는 중…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nl-login.js"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
const sb = window.supabase.createClient(URL_, KEY_, { auth: { storage: nlStore, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
const $ = id => document.getElementById(id);
const CAN_SEE = [8];
const STATES = ['할 일', '하는 중', '끝냄', '미룸', '못 함'];
const SCL = { '할 일':'s1', '하는 중':'s2', '끝냄':'s3', '미룸':'s4', '못 함':'s5' };
const WD = ['일','월','화','수','목','금','토'];
// 늘 하는 일 주기 — 월 · 주 · 일 다이얼 셋 (2026-10-09 은정님) · 「적용 없음」 칸은 따지지 않음
const WK = ['', '첫째', '둘째', '셋째', '넷째', '마지막'];   // 5 = 마지막 주 (그 달의 마지막 그 요일)
function ruleText(r) {
  const wdT = i => WD[i] + '요일';
  if (r.cycle === '매일') return '매일';
  if (r.cycle === '매주') return '매주 ' + wdT(r.weekday);
  if (r.cycle === '매달') return '매달 ' + r.month_day + '일';
  if (r.cycle === '매달요일') return '매달 ' + WK[r.week_no] + ' 주 ' + wdT(r.weekday);
  if (r.cycle === '매년') return '매년 ' + r.year_month + '월 ' + r.month_day + '일';
  if (r.cycle === '조합') {
    const m = r.year_month ? '매년 ' + r.year_month + '월 ' : (r.week_no || r.month_day ? '매달 ' : '');
    const w = r.week_no ? WK[r.week_no] + ' 주 ' : (r.weekday != null && !r.year_month ? '매주 ' : '');
    const d = r.weekday != null ? wdT(r.weekday) : r.month_day ? r.month_day + '일' : r.week_no ? '(그 주 첫날 한 번)' : '매일';
    return (m + w + d).trim();
  }
  return r.cycle || '';
}
// 다이얼 셋 → 서버 칸 (가장 가까운 옛 주기로 저장하고, 맞는 것이 없으면 「조합」)
function dialRule() {
  // 일 「매일」 = 고른 기간에 날마다 · 일 「적용 없음」 = 고른 기간에 한 번 (그 기간 첫날, 쉬는 날이면 다음 출근 날)
  const mv = $('rmon').value, wv = $('rwk').value, dv = $('rday').value;
  const m = /^\d+$/.test(mv) ? Number(mv) : null;
  const w = /^\d+$/.test(wv) ? Number(wv) : null;
  const wd = /^w\d$/.test(dv) ? Number(dv.slice(1)) : null;
  const md = /^d\d+$/.test(dv) ? Number(dv.slice(1)) : null;
  if (!mv && !wv && !dv) return { err: '주기를 골라 주세요 (월 · 주 · 일 가운데 하나 이상)' };
  if (w && md) return { err: '몇째 주와 날짜(1~31일)는 함께 고를 수 없습니다' };
  if (w && dv === 'all') return { err: '몇째 주를 고르면 「일」은 적용 없음(그 주에 한 번)이나 요일로 골라 주세요' };
  const row = { year_month: m, week_no: null, weekday: null, month_day: null };
  if (wd != null) {                           // 요일
    row.weekday = wd; row.week_no = w;
    row.cycle = m ? '조합' : w ? '매달요일' : '매주';
  } else if (md) {                            // 날짜
    row.month_day = md; row.cycle = m ? '매년' : '매달';
  } else if (dv === 'all') {                  // 매일
    row.cycle = m ? '조합' : '매일';
  } else if (w) {                             // 일 적용 없음 · 몇째 주 → 그 주 첫날 한 번
    row.week_no = w; row.cycle = '조합';
  } else if (wv === 'all') {                  // 일 적용 없음 · 매주 → 한 주에 한 번 (월요일)
    row.weekday = 1; row.cycle = m ? '조합' : '매주';
  } else {                                    // 일 · 주 적용 없음 → 그 달 1일 한 번
    row.month_day = 1; row.cycle = m ? '매년' : '매달';
  }
  return { row, text: ruleText(row) };
}
let STAFF = [], TASKS = [], LATE = [], RULES = [], DAY = null, WHO = 'all';
let EDIT_RID = null, NEW_RID = null, RMSG = null;   // 고치는 줄 · 방금 저장한 줄 · 단추 옆 알림
// 업무일지 (2026-10-10 · 한 화면: 달력 → 날짜 → 그 날 할 일 → 그 일의 업무일지)
const KINDS = ['업무', '학부모 민원', '치료사 민원', '기타'];
const KCL = { '업무':'k1', '학부모 민원':'k2', '치료사 민원':'k3', '기타':'k4' };
const NSTATES = ['접수', '처리 중', '끝'];
const NSCL = { '접수':'ns1', '처리 중':'ns2', '끝':'ns3' };
let ME_ID = null, NOTES = [], NMSG = null, MKIND = 'all';
let MTASKS = [], MNOTES = [], MOFF = {};
// 열린 일지 칸 — { task: 할 일 번호 | 'free'(할 일 없이), note: 고치는 일지 번호 | null }
let FORM = null;
// 접은 묶음 (탭 닫으면 잊음)
let FOLD = (() => { try { return JSON.parse(sessionStorage.getItem('nl_tasks_fold') || '{}'); } catch (e) { return {}; } })();
function saveFold(){ try { sessionStorage.setItem('nl_tasks_fold', JSON.stringify(FOLD)); } catch (e) {} }
function isComplaint(k){ return k === '학부모 민원' || k === '치료사 민원'; }
function hm(t){ return t ? String(t).slice(0, 5) : ''; }
function nowHm(){ const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
// 적고 저장 안 한 일지
function noteDraft(){
  if (!FORM || !$('wcontent')) return false;
  const n = FORM.note ? NOTES.find(x => x.id === FORM.note) : null;
  if (n) {
    return $('wcontent').value !== (n.content || '') || $('wimprove').value !== (n.improve || '')
        || $('wresult').value !== (n.result || '') || $('wkind').value !== n.kind
        || $('wtime').value !== hm(n.note_time) || $('wchild').value !== (n.child_id == null ? '' : String(n.child_id));
  }
  return ['wcontent', 'wimprove', 'wresult'].some(id => $(id).value.trim());
}
function leaveOk(){
  if (!noteDraft()) return true;
  return confirm('저장하지 않은 업무일지가 있습니다.\n저장하지 않고 넘어갈까요?');
}
window.addEventListener('beforeunload', e => { if (noteDraft()) { e.preventDefault(); e.returnValue = ''; } });
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dlab(d){ const x = new Date(d + 'T00:00:00'); return (x.getMonth()+1) + '/' + x.getDate() + '(' + WD[x.getDay()] + ')'; }
function stName(id){ const s = STAFF.find(x => Number(x.id) === Number(id)); return s ? id + '번 ' + s.name : id + '번'; }
function msg(t, ok){ const m = $('tmsg'); if (m) { m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = t; } }
function ymd(x){ return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }

// 1,000줄씩 나눠 읽기
async function readAll(mk){
  let out = [], f = 0;
  for (;;) {
    const { data, error } = await mk().range(f, f + 999);
    if (error) return { error };
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    f += 1000;
  }
  return { data: out };
}

async function load(){
  const m = DAY.slice(0, 7), y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7));
  const from = m + '-01', to = m + '-' + String(new Date(y, mo, 0).getDate()).padStart(2, '0');
  const [a, b, c, d, mt, mn, mo2] = await Promise.all([
    sb.from('nl_tasks').select('*').eq('task_date', DAY).order('staff_id').order('id'),
    sb.from('nl_tasks').select('*').lt('task_date', DAY).in('state', ['할 일', '하는 중']).order('task_date').limit(500),
    sb.from('nl_task_rules').select('*').order('active', { ascending: false }).order('staff_id').order('id'),
    sb.from('nl_work_notes').select('*').eq('note_date', DAY).order('note_time', { ascending: true, nullsFirst: true }).order('id').limit(1000),
    readAll(() => sb.from('nl_tasks').select('id, staff_id, state, reason, title, task_date').gte('task_date', from).lte('task_date', to).order('id')),
    readAll(() => sb.from('nl_work_notes').select('*').gte('note_date', from).lte('note_date', to).order('note_date').order('note_time', { ascending: true, nullsFirst: true }).order('id')),
    sb.from('nl_offdays').select('off_date, kind, reason').gte('off_date', from).lte('off_date', to).in('kind', ['공휴일', '센터휴무'])
  ]);
  const er = a.error || b.error || c.error || d.error || mt.error || mn.error || mo2.error;
  if (er) { $('body').innerHTML = '<div class="card err">불러오지 못했습니다.\n' + esc(er.message) + '</div>'; return; }
  TASKS = a.data || []; LATE = b.data || []; RULES = c.data || []; NOTES = d.data || [];
  MTASKS = mt.data || []; MNOTES = mn.data || [];
  MOFF = {}; (mo2.data || []).forEach(o => { MOFF[o.off_date] = o.reason || o.kind; });
  // 지난 날 남은 일에 딸린 일지도 보이게 (그 일이 다른 날에 있어도)
  const lateIds = LATE.map(t => t.id);
  if (lateIds.length) {
    const { data: ln } = await sb.from('nl_work_notes').select('*').in('task_id', lateIds).limit(1000);
    (ln || []).forEach(n => { if (!NOTES.some(x => x.id === n.id)) NOTES.push(n); });
  }
  if (FORM && FORM.note && !NOTES.some(x => x.id === FORM.note)) FORM = null;
  if (FORM && FORM.task !== 'free' && !TASKS.concat(LATE).some(t => t.id === FORM.task)) FORM = null;
  draw();
}

// 일지 한 줄
function noteRow(n){
  const on = FORM && FORM.note === n.id;
  return '<div class="wn' + (on ? ' edit' : '') + '">'
    + '<span class="bdg ' + (KCL[n.kind] || 'k4') + '">' + esc(n.kind) + '</span>'
    + (n.note_date !== DAY ? dlab(n.note_date) + ' ' : '') + (n.note_time ? hm(n.note_time) + ' · ' : '') + esc(stName(n.staff_id)) + (n.child_id != null ? ' · ' + n.child_id + '번 아동' : '')
    + (isComplaint(n.kind) ? ' <span class="kf" style="display:inline-flex;margin-left:6px">' + NSTATES.map(s => '<button type="button" data-ns="' + n.id + '" data-s="' + s + '" class="' + (n.state === s ? 'on' : '') + '">' + s + '</button>').join('') + '</span>' : '')
    + ' <button type="button" class="lnk" data-nedit="' + n.id + '">고치기</button> <button type="button" class="lnk" style="color:#c62828 !important" data-ndel="' + n.id + '">✕ 지우기</button>'
    + '<div class="ln">' + esc(n.content) + '</div>'
    + (n.improve ? '<div class="ln dim">개선 방향 · ' + esc(n.improve) + '</div>' : '')

// 달력 (월~토 · 일요일은 뺌)
function calHtml(){
  const m = DAY.slice(0, 7), y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7));
  const last = new Date(y, mo, 0).getDate(), td = today();
  const who = x => WHO === 'all' || Number(x.staff_id) === Number(WHO);
  const day = {};
  const cell = ds => day[ds] || (day[ds] = { n: 0, done: 0, cant: 0, left: 0, nt: 0, nc: 0 });
  MTASKS.filter(who).forEach(t => {
    if (t.state === '미룸') return;
    const o = cell(t.task_date); o.n++;
    if (t.state === '끝냄') o.done++; if (t.state === '못 함') o.cant++;
    if ((t.state === '할 일' || t.state === '하는 중') && t.task_date < td) o.left++;
  });
  MNOTES.filter(who).forEach(n => { const o = cell(n.note_date); if (isComplaint(n.kind)) o.nc++; else o.nt++; });
  let c = ['월', '화', '수', '목', '금', '토'].map(w => '<div class="h">' + w + '</div>').join('');
  const first = new Date(y, mo - 1, 1).getDay();
  const lead = first === 0 ? 0 : first - 1;
  for (let i = 0; i < lead; i++) c += '<div class="c blank"></div>';
  for (let d = 1; d <= last; d++) {
    const ds = m + '-' + String(d).padStart(2, '0');
    if (new Date(y, mo - 1, d).getDay() === 0) continue;
    const o = day[ds], off = MOFF[ds];
    let inner = '<b style="font-weight:600">' + d + '</b>' + (ds === td ? ' <span class="dim">오늘</span>' : '');
    if (off) inner += ' <span class="dim">' + esc(off) + '</span>';
    if (o && o.n) {
      const cl = (o.left || o.cant) ? 'bad' : (o.done === o.n ? 'ok3' : 'ok2');
      inner += '<br><span class="' + cl + '">' + o.done + '/' + o.n + (o.cant ? ' 못함' + o.cant : '') + '</span>';
    }
    if (o && (o.nt || o.nc)) inner += (o.n ? ' · ' : '<br>') + (o.nt ? '일지 ' + o.nt : '') + (o.nt && o.nc ? ' · ' : '') + (o.nc ? '<span style="color:#993556">민원 ' + o.nc + '</span>' : '');
    c += '<div class="c' + (off ? ' off' : '') + (ds === DAY ? ' sel' : '') + '" data-goday="' + ds + '">' + inner + '</div>';
  }
  return '<div class="cal">' + c + '</div>';
}

// 직원별 이 달 확인
function staffHtml(){
  const who = x => WHO === 'all' || Number(x.staff_id) === Number(WHO);
  const g = {}, td = today();
  const get = k => g[k] || (g[k] = { n: 0, done: 0, moved: 0, cant: [], left: 0, notes: 0, comp: 0 });
  MTASKS.filter(who).forEach(t => {
    const o = get(t.staff_id);
    if (t.state === '미룸') { o.moved++; return; }
    o.n++;
    if (t.state === '끝냄') o.done++;
    if (t.state === '못 함') o.cant.push(dlab(t.task_date) + ' ' + t.title + ' — ' + (t.reason || ''));
    if ((t.state === '할 일' || t.state === '하는 중') && t.task_date < td) o.left++;
  });
  MNOTES.filter(who).forEach(n => { const o = get(n.staff_id); o.notes++; if (isComplaint(n.kind)) o.comp++; });
  const ks = Object.keys(g);
  if (!ks.length) return '<span class="dim">이 달 할 일 · 업무일지가 아직 없습니다.</span>';
  return '<table><tr><th>직원</th><th>할 일</th><th>끝냄</th><th>끝냄 비율</th><th>미룬 횟수</th><th>지난 날 남은 일</th><th>업무일지</th><th>못 함</th></tr>'
    + ks.map(k => { const o = g[k];
        return '<tr><td>' + esc(stName(k)) + '</td><td>' + o.n + '</td><td>' + o.done + '</td><td><b>' + (o.n ? Math.round(o.done / o.n * 100) : 0) + '%</b></td>'
          + '<td>' + o.moved + '</td><td' + (o.left ? ' style="color:var(--coral);font-weight:600"' : '') + '>' + o.left + '</td>'
          + '<td>' + o.notes + (o.comp ? ' <span style="color:#993556">(민원 ' + o.comp + ')</span>' : '') + '</td>'
          + '<td style="white-space:normal">' + (o.cant.length ? o.cant.map(esc).join('<br>') : '<span class="dim">–</span>') + '</td></tr>'; }).join('')
    + '</table><div class="note">미룬 일은 미룬 날에 「미룬 일」로 다시 세어지므로 할 일 수에서 뺐습니다.</div>';
}

function bind(){
  const goDay = d => { if (d === DAY) return; if (!leaveOk()) return; FORM = null; DAY = d; load(); };
  const shift = k => { const x = new Date(DAY + 'T00:00:00'); x.setDate(x.getDate() + k); return ymd(x); };
  const mshift = k => { const x = new Date(Number(DAY.slice(0, 4)), Number(DAY.slice(5, 7)) - 1 + k, 1); return ymd(x); };
  $('dprev').onclick = () => goDay(shift(-1));
  $('dnext').onclick = () => goDay(shift(1));
  $('mprev').onclick = () => goDay(mshift(-1));
  $('mnext').onclick = () => goDay(mshift(1));
  $('gotoday').onclick = () => goDay(today());
  document.querySelectorAll('[data-goday]').forEach(el => el.onclick = e => { e.preventDefault(); goDay(el.dataset.goday);
    setTimeout(() => { const c = $('dayCard'); if (c && c.scrollIntoView) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 300); });
  $('wsel').onchange = () => { if (!leaveOk()) { $('wsel').value = WHO; return; } FORM = null; WHO = $('wsel').value; draw(); };
  document.querySelectorAll('details.fold').forEach(dt => dt.addEventListener('toggle', () => { FOLD[dt.dataset.fold] = dt.open; saveFold(); }));
  document.querySelectorAll('button[data-mk]').forEach(b => b.onclick = () => {
    MKIND = b.dataset.mk;
    document.querySelectorAll('button[data-mk]').forEach(x => x.classList.toggle('on', x.dataset.mk === MKIND));
    $('mlist').innerHTML = monthNotesHtml();
    document.querySelectorAll('#mlist [data-goday]').forEach(el => el.onclick = e => { e.preventDefault(); goDay(el.dataset.goday); });
  });
  $('remake').onclick = async () => {
    if (!leaveOk()) return;
    const { data, error } = await sb.rpc('nl_make_tasks', { p_date: DAY });
    if (error) { msg('❌ ' + error.message, false); return; }
    msg('늘 하는 일에서 ' + data + '개를 새로 넣었습니다.', true); FORM = null; load();
  };
  $('nadd').onclick = async () => {
    const title = $('ntitle').value.trim();
    if (!title) { msg('맡길 일을 적어 주세요.', false); return; }
    if (!leaveOk()) return;
    const { data, error } = await sb.from('nl_tasks').insert({ task_date: $('nday').value || DAY, staff_id: Number($('nwho').value), title: title, source: '맡김' }).select('id');
    if (error || !data || !data.length) { msg('❌ 맡기지 못했습니다. ' + (error ? error.message : ''), false); return; }
    msg('맡겼습니다.', true); FORM = null; load();
  };
  // 일지 칸 열기 — 할 일 글 · 할 일 없이 · 고치기
  const openForm = f => {
    if (FORM && JSON.stringify(FORM) === JSON.stringify(f)) return;
    if (!leaveOk()) return;
    FORM = f; NMSG = null; draw(); if ($('wcontent')) $('wcontent').focus();
  };
  document.querySelectorAll('[data-topen]').forEach(el => el.onclick = () => openForm({ task: Number(el.dataset.topen), note: null }));
  if ($('freeopen')) $('freeopen').onclick = () => openForm({ task: 'free', note: null });
  document.querySelectorAll('button[data-nedit]').forEach(b => b.onclick = () => {
    const n = NOTES.find(x => x.id === Number(b.dataset.nedit)); if (!n) return;
    openForm({ task: n.task_id || 'free', note: n.id });
  });
  const wmsg = (t, ok) => { NMSG = { t, ok }; const m = $('wmsg'); if (m) { m.textContent = t; m.style.color = ok ? '#2e7d32' : '#c62828'; } };
  if ($('wcancel')) $('wcancel').onclick = () => { if (noteDraft() && !confirm('적은 것을 저장하지 않고 그만둘까요?')) return; FORM = null; draw(); };
  if ($('wsave')) $('wsave').onclick = async () => {
    const b = $('wsave'); if (b.disabled) return;
    const content = $('wcontent').value.trim();
    if (!content) { wmsg('⚠ 내용을 적어 주세요', false); $('wcontent').focus(); return; }
    const cv = $('wchild').value.trim();
    if (cv && !/^\d{1,6}$/.test(cv)) { wmsg('⚠ 아동 번호는 숫자만 적어 주세요', false); return; }
    const row = { kind: $('wkind').value, note_time: $('wtime').value || null, child_id: cv ? Number(cv) : null,
                  content: content, improve: $('wimprove').value.trim() || null, result: $('wresult').value.trim() || null };
    b.disabled = true; b.textContent = '저장 중…';
    const q = FORM.note ? sb.from('nl_work_notes').update(row).eq('id', FORM.note).select('id')
                        : sb.from('nl_work_notes').insert(Object.assign({ note_date: DAY, staff_id: ME_ID, task_id: FORM.task === 'free' ? null : FORM.task }, row)).select('id');
    const { data, error } = await q;
    if (error || !data || !data.length) {
      b.disabled = false; b.textContent = FORM.note ? '고친 것 저장' : '일지 저장';
      let why = error ? error.message : '저장된 줄을 돌려받지 못했습니다';
      if (/foreign key|child/i.test(why)) why = '그 번호의 아동이 없습니다. 아동 번호를 확인해 주세요.\n(' + why + ')';
      wmsg('❌ 저장하지 못했습니다', false); alert('업무일지를 저장하지 못했습니다.\n' + why); return;
    }
    const was = FORM.note; FORM = null;
    msg(was ? '✓ 고친 것을 저장했습니다' : '✓ 업무일지를 저장했습니다', true);
    await load(); msg(was ? '✓ 고친 것을 저장했습니다' : '✓ 업무일지를 저장했습니다', true);
  };
  if (NMSG) { wmsg(NMSG.t, NMSG.ok); NMSG = null; }
  document.querySelectorAll('button[data-ndel]').forEach(b => b.onclick = async () => {
    const n = NOTES.find(x => x.id === Number(b.dataset.ndel)); if (!n) return;
    if (!confirm('이 업무일지를 지울까요?\n\n' + n.kind + ' · ' + String(n.content).slice(0, 60) + '\n\n지운 뒤에는 되살릴 수 없습니다.')) return;
    const { data, error } = await sb.from('nl_work_notes').delete().eq('id', n.id).select('id');
    if (error || !data || !data.length) { alert('지우지 못했습니다.\n' + (error ? error.message : '지운 줄을 돌려받지 못했습니다')); return; }
    if (FORM && FORM.note === n.id) FORM = null;
    load();
  });
  document.querySelectorAll('button[data-ns]').forEach(b => b.onclick = async () => {
    const n = NOTES.find(x => x.id === Number(b.dataset.ns)); if (!n || n.state === b.dataset.s) return;
    if (!leaveOk()) return;
    const { data, error } = await sb.from('nl_work_notes').update({ state: b.dataset.s }).eq('id', n.id).select('id');
    if (error || !data || !data.length) { alert('바꾸지 못했습니다.\n' + (error ? error.message : '바뀐 줄을 돌려받지 못했습니다')); return; }
    FORM = null; load();
  });
  // 할 일 상태 · 지우기
  document.querySelectorAll('button[data-tk]').forEach(b => b.onclick = async () => {
    const t = TASKS.concat(LATE).find(x => x.id === Number(b.dataset.tk)); if (!t) return;
    const s = b.dataset.s; if (t.state === s) return;
    if (!leaveOk()) return;
    const up = { state: s };
    if (s === '못 함') { const w = prompt('못 한 까닭을 적어 주세요. (반드시)', t.reason || ''); if (w === null || !w.trim()) return; up.reason = w.trim(); }
    if (s === '미룸') {
      const d = prompt('며칠로 미룰까요? (예: 2026-10-12)', ''); if (d === null) return;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d.trim()) || d.trim() <= t.task_date) { msg('미룰 날은 그 날 뒤 날짜로 적어 주세요 (2026-10-12 모양).', false); return; }
      up.moved_to = d.trim();
    }
    const { data, error } = await sb.from('nl_tasks').update(up).eq('id', t.id).select('id');
    if (error || !data || !data.length) { msg('❌ 바꾸지 못했습니다. ' + (error ? error.message : ''), false); return; }
    FORM = (s === '끝냄') ? { task: t.id, note: null } : null;   // 끝냄이면 그 일의 일지 칸을 엶 (적지 않아도 됨)
    load();
  });
  document.querySelectorAll('button[data-del]').forEach(b => b.onclick = async () => {
    const t = TASKS.concat(LATE).find(x => x.id === Number(b.dataset.del)); if (!t) return;
    const tn = NOTES.filter(n => n.task_id === t.id).length;
    if (!confirm('이 할 일을 지울까요?\n' + t.title + (tn ? '\n\n딸린 업무일지 ' + tn + '개는 남고, 「할 일 없이 적은 일지」로 옮겨집니다.' : ''))) return;
    if (!leaveOk()) return;
    const { data, error } = await sb.from('nl_tasks').delete().eq('id', t.id).select('id');
    if (error || !data || !data.length) { msg('❌ 지우지 못했습니다. ' + (error ? error.message : ''), false); return; }
    FORM = null; load();
  });
  // 늘 하는 일 설정
  const prev = () => { const d = dialRule(); $('rprev').textContent = d.err ? '⚠ ' + d.err : '→ ' + d.text; $('rprev').style.color = d.err ? '#c62828' : ''; };
  ['rmon', 'rwk', 'rday'].forEach(id => $(id).onchange = prev); prev();
  const rmsg = (t, ok) => { RMSG = { t, ok }; const m = $('rmsg'); if (m) { m.textContent = t; m.style.color = ok ? '#2e7d32' : '#c62828'; } };
  if (RMSG) { rmsg(RMSG.t, RMSG.ok); RMSG = null; }
  // 고치는 줄이면 아래 칸을 그 줄 내용으로 채움
  const fillRule = r => {
    $('rwho').value = String(r.staff_id); $('rtitle').value = r.title || ''; $('rskip').checked = !!r.skip_off;
    const mo = r.year_month ? String(r.year_month) : (r.cycle === '매달' || r.cycle === '매달요일' || (r.cycle === '조합' && (r.week_no || r.month_day))) ? 'all' : '';
    const wk = r.week_no ? String(r.week_no) : (r.cycle === '매주') ? 'all' : '';
    const dy = (r.weekday != null && r.weekday >= 1) ? 'w' + r.weekday : r.month_day ? 'd' + r.month_day : (r.cycle === '매일' || (r.cycle === '조합' && !r.week_no)) ? 'all' : '';
    $('rmon').value = mo; $('rwk').value = wk; $('rday').value = dy; prev();
  };
  if (EDIT_RID) { const r = RULES.find(x => String(x.id) === String(EDIT_RID)); if (r) fillRule(r); else EDIT_RID = null; }
  document.querySelectorAll('tr[data-rid]').forEach(tr => tr.onclick = e => {
    if (e.target.closest('button')) return;
    EDIT_RID = Number(tr.dataset.rid); NEW_RID = null; RMSG = { t: '고치는 중 — 고친 뒤 「저장」', ok: true }; draw();
    $('rtitle').focus();
  });
  if ($('rcancel')) $('rcancel').onclick = () => { EDIT_RID = null; RMSG = null; draw(); };
  $('radd').onclick = async () => {
    const title = $('rtitle').value.trim(), dr = dialRule();
    if (!title) { rmsg('⚠ 늘 하는 일을 적어 주세요', false); return; }
    if (dr.err) { rmsg('⚠ ' + dr.err, false); return; }
    const row = Object.assign({ staff_id: Number($('rwho').value), title: title, skip_off: $('rskip').checked }, dr.row);
    const b = $('radd'); if (b.disabled) return; b.disabled = true; b.textContent = '저장 중…';
    const q = EDIT_RID ? sb.from('nl_task_rules').update(row).eq('id', EDIT_RID).select('id') : sb.from('nl_task_rules').insert(row).select('id');
    const { data, error } = await q;
    if (error || !data || !data.length) {
      b.disabled = false; b.textContent = EDIT_RID ? '저장' : '＋ 더하기';
      const why = error ? error.message : '저장된 줄을 돌려받지 못했습니다';
      rmsg('❌ 저장하지 못했습니다', false); alert('늘 하는 일을 저장하지 못했습니다.\n' + why); return;
    }
    NEW_RID = data[0].id; const was = EDIT_RID; EDIT_RID = null;
    RMSG = { t: '✓ 저장했습니다 — ' + dr.text + (was ? ' (다음에 만드는 목록부터 바뀝니다)' : ' (내일 새벽부터 목록에 들어갑니다)'), ok: true };
    load();
  };
  document.querySelectorAll('button[data-rdel]').forEach(b => b.onclick = async () => {
    const r = RULES.find(x => x.id === Number(b.dataset.rdel)); if (!r) return;
    if (!confirm('「' + r.title + '」 · ' + ruleText(r) + '\n\n이 늘 하는 일을 지울까요?\n\n이미 만들어진 지난 할 일은 그대로 남습니다.\n잠시 멈추기만 하려면 「끄기」를 누르세요.')) return;
    const { data, error } = await sb.from('nl_task_rules').delete().eq('id', r.id).select('id');
    if (error || !data || !data.length) { alert('지우지 못했습니다.\n' + (error ? error.message : '지운 줄을 돌려받지 못했습니다')); return; }
    if (String(EDIT_RID) === String(r.id)) EDIT_RID = null;
    RMSG = { t: '✓ 지웠습니다 — 「' + r.title + '」', ok: true }; load();
  });
  document.querySelectorAll('button[data-ra]').forEach(b => b.onclick = async () => {
    const r = RULES.find(x => x.id === Number(b.dataset.ra)); if (!r) return;
    const { data, error } = await sb.from('nl_task_rules').update({ active: !r.active }).eq('id', r.id).select('id');
    if (error || !data || !data.length) { msg('❌ 바꾸지 못했습니다. ' + (error ? error.message : ''), false); return; }
    load();
  });
}

$('home').onclick = () => { location.href = 'index.html'; };
(async () => {
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { location.replace('index.html'); return; }
  const { data: me, error } = await sb.from('nl_therapists').select('id, name').eq('login_email', data.session.user.email.toLowerCase()).maybeSingle();
  if (error || !me) { $('body').innerHTML = '<div class="card err">직원 표에 이 이메일이 없습니다.</div>'; return; }
  nlKeep(me.id);
  ME_ID = Number(me.id);
  if (CAN_SEE.indexOf(Number(me.id)) < 0) { $('body').innerHTML = '<div class="card err">이 화면을 볼 권한이 없습니다.</div>'; return; }
  $('whoami').textContent = me.name + ' 님으로 로그인됨';
  const { data: st } = await sb.from('nl_therapists').select('id, name, role, left_on').order('id');
  STAFF = (st || []).filter(s => !s.left_on && !/치료사/.test(s.role || ''));
  DAY = today();
  load();
})();
</script>
</body>
</html>
