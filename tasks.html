<!-- 할 일 목록 — 지금은 원장님(8번)만 (2026-10-07 은정님 · 신규 직원 채용 뒤 직원 화면을 엶)
     표 nl_task_rules(늘 하는 일) · nl_tasks(날마다 할 일) · 새벽 5시 nl_make_tasks 가 그날 목록을 만듦
     상태 — 할 일 · 하는 중 · 끝냄 · 미룸(다른 날로 · 그 날에 「미룬 일」이 저절로) · 못 함(사유 반드시)
     업무일지 (2026-10-10 · 한 화면) — 달력 → 날짜를 누르면 그 날 할 일 → 할 일 글을 누르면 그 일의 업무일지
       업무일지 nl_work_notes (+ task_id 어느 할 일 · 비면 「추가 업무」 — 민원 · 기타)
       앞날 예정 nl_task_preview(시작, 끝) — 늘 하는 일이 그날 새벽에 할 일로 생길 예정 (셈은 nl_task_rule_due 한 곳)
       늘 하는 일을 저장하면 오늘 몫을 바로 만듦 (nl_make_tasks)
       할 일 칸 (2026-10-10 은정님) — 넓은 둥근 칸 · 체크 상자(끝냄 ↔ 할 일) · 보완 메모 한 줄(nl_tasks.result · 칸을 벗어나면 저장)
         「진행 중」(서버 값은 「하는 중」 그대로 · 화면 글자만) — 끝낼 때까지 날마다 「이어서 하는 일」로 따라옴
         「📅 날짜 옮기기」 = 미룸 (뒤 날짜만 · 그 날에 할 일이 저절로 · 원래 날에 「→ ○로 옮김」)
         할 일에 업무일지를 새로 붙이지 않음 — 긴 기록은 「추가 업무」에서 (이미 붙은 일지는 「업무일지 n」으로 보이기만)
       오늘 화면을 열면 오늘 몫 늘 하는 일이 저절로 들어옴 (nl_make_tasks · 한 번만)
       반복하는 일 칸 ✕ — 이 날 것만(nl_task_skips 에 적혀 다시 안 생김) / 반복 자체(오늘부터 앞날 「할 일」 칸 함께 지움 · 장치 trg_task_rule_del)
       늘 하는 일 설정 · 직원별 이 달 확인 · 이 달 업무일지 모아 보기 — 아래에 접어 둠
-->

  .kf { display:flex; gap:4px; flex-wrap:wrap; }

  .tc { border:1.5px solid #E6DED4; border-radius:16px; padding:12px 16px; margin-bottom:10px; background:#fff; }
  .tc.done { background:#F3F8EF; border-color:#BFD9B0; } .tc.cont { background:#FFFBF5; border-color:#E8C9A6; }
  .tc.cant { background:#FCF3F0; border-color:#F2D3C8; } .tc.moved { background:#FAFAF8; border-style:dashed; border-color:#D9D3CC; }
  .tc .top { display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .tc .cb { width:24px; height:24px; border:2px solid var(--cam); border-radius:6px; flex:none; background:#fff; padding:0; margin-top:1px;
            display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; line-height:1; }

  .tc .cb:disabled { border-color:#D9D3CC; background:#FAFAF8; cursor:default; }
  .tc .tt { flex:1 1 260px; min-width:0; font-size:15.5px; font-weight:700; line-height:1.45; }
  .tc.done .tt { color:#5E7A63; } .tc.moved .tt { color:#8A817A; }
  .tc .sub { font-size:12px; color:#8A817A; font-weight:400; margin-top:2px; }
  .tc .sb { display:flex; gap:4px; flex-wrap:wrap; }
  .tc .sb button { font-size:12px; border:1px solid #E6E2DD; border-radius:12px; padding:2px 10px; color:#6b635c; }
  .tc .sb button.on2 { background:#FAEEDA; border-color:#E8C9A6; color:#633806; } .tc .sb button.on5 { background:#D8684A; border-color:#D8684A; color:#fff; }
  .tc .memo { margin:10px 0 0 36px; }
  .tc .memo textarea { min-height:34px; height:34px; background:#FBFAF8; border-color:#ECE8E3; padding:6px 10px; }
  .tc .memo textarea.has { background:#FBF5EE; border-color:#F0E4D6; } .tc .memo textarea:focus { background:#fff; border-color:var(--camB); outline:none; }
  .tc .mv { margin:10px 0 0 36px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; background:#F8F1E8; border-radius:10px; padding:8px 10px; font-size:13px; }
  .tc .lg { margin:8px 0 0 36px; font-size:12.5px; } .tc .lg summary { color:var(--cam); cursor:pointer; }
  .glab { font-size:12px; font-weight:700; color:var(--cam); margin:12px 0 6px; } .glab.red { color:var(--coral); }
  .kf button { padding:3px 9px; font-size:12px; } .kf button.on { background:var(--camL); border-color:var(--camB); }
</style>
</head>

const WK = ['', '첫째', '둘째', '셋째', '넷째', '마지막'];   // 5 = 마지막 주 (그 달의 마지막 그 요일)
function ruleText(r) {
  const wdT = i => WD[i] + '요일';
  if (r.cycle === '매일') return '매일';
  if (r.cycle === '매주') return '매주 ' + wdT(r.weekday);
  if (r.cycle === '매달') return '매달 ' + r.month_day + '일';
  if (r.cycle === '매달요일') return '매달 ' + WK[r.week_no] + ' 주 ' + wdT(r.weekday);
  if (r.cycle === '매년') return '매년 ' + r.year_month + '월 ' + r.month_day + '일';
  if (r.cycle === '조합') {
    const m = r.year_month ? '매년 ' + r.year_month + '월 ' : (r.week_no || r.month_day ? '매달 ' : '');
    const w = r.week_no ? WK[r.week_no] + ' 주 ' : (r.weekday != null && !r.year_month ? '매주 ' : '');
    const d = r.weekday != null ? wdT(r.weekday) : r.month_day ? r.month_day + '일' : r.week_no ? '(그 주 첫날 한 번)' : '매일';
    return (m + w + d).trim();
  }
  return r.cycle || '';
}

function dialRule() {
  // 일 「매일」 = 고른 기간에 날마다 · 일 「적용 없음」 = 고른 기간에 한 번 (그 기간 첫날, 쉬는 날이면 다음 출근 날)
  const mv = $('rmon').value, wv = $('rwk').value, dv = $('rday').value;
  const m = /^\d+$/.test(mv) ? Number(mv) : null;
  const w = /^\d+$/.test(wv) ? Number(wv) : null;
  const wd = /^w\d$/.test(dv) ? Number(dv.slice(1)) : null;
  const md = /^d\d+$/.test(dv) ? Number(dv.slice(1)) : null;
  if (!mv && !wv && !dv) return { err: '주기를 골라 주세요 (월 · 주 · 일 가운데 하나 이상)' };
  if (w && md) return { err: '몇째 주와 날짜(1~31일)는 함께 고를 수 없습니다' };
  if (w && dv === 'all') return { err: '몇째 주를 고르면 「일」은 적용 없음(그 주에 한 번)이나 요일로 골라 주세요' };
  const row = { year_month: m, week_no: null, weekday: null, month_day: null };
  if (wd != null) {                           // 요일
    row.weekday = wd; row.week_no = w;
    row.cycle = m ? '조합' : w ? '매달요일' : '매주';
  } else if (md) {                            // 날짜
    row.month_day = md; row.cycle = m ? '매년' : '매달';
  } else if (dv === 'all') {                  // 매일
    row.cycle = m ? '조합' : '매일';
  } else if (w) {                             // 일 적용 없음 · 몇째 주 → 그 주 첫날 한 번
    row.week_no = w; row.cycle = '조합';
  } else if (wv === 'all') {                  // 일 적용 없음 · 매주 → 한 주에 한 번 (월요일)
    row.weekday = 1; row.cycle = m ? '조합' : '매주';
  } else {                                    // 일 · 주 적용 없음 → 그 달 1일 한 번
    row.month_day = 1; row.cycle = m ? '매년' : '매달';
  }
  return { row, text: ruleText(row) };
}

    return $('wcontent').value !== (n.content || '') || $('wimprove').value !== (n.improve || '')
        || $('wresult').value !== (n.result || '') || $('wkind').value !== n.kind
        || $('wtime').value !== hm(n.note_time) || $('wchild').value !== (n.child_id == null ? '' : String(n.child_id));
  }
  return ['wcontent', 'wimprove', 'wresult'].some(id => $(id).value.trim());
}
// 적고 저장 안 한 보완 메모 (칸을 벗어나면 저장되지만, 칸 안에 있는 채로 넘어갈 때)
function memoDraft(){
  return [...document.querySelectorAll('textarea[data-memo]')].some(el => {
    const t = TASKS.concat(LATE).find(x => x.id === Number(el.dataset.memo));
    return t && !el.dataset.saving && el.value.trim() !== (t.result || '');
  });
}
function leaveOk(){
  if (memoDraft()) { if (!confirm('저장하지 않은 보완 메모가 있습니다.\n저장하지 않고 넘어갈까요?')) return false; }
  if (!noteDraft()) return true;
  return confirm('저장하지 않은 업무일지가 있습니다.\n저장하지 않고 넘어갈까요?');
}
window.addEventListener('beforeunload', e => { if (noteDraft() || memoDraft()) { e.preventDefault(); e.returnValue = ''; } });
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dlab(d){ const x = new Date(d + 'T00:00:00'); return (x.getMonth()+1) + '/' + x.getDate() + '(' + WD[x.getDay()] + ')'; }
function stName(id){ const s = STAFF.find(x => Number(x.id) === Number(id)); return s ? id + '번 ' + s.name : id + '번'; }
function msg(t, ok){ const m = $('tmsg'); if (m) { m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = t; } }
function ymd(x){ return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }

// 1,000줄씩 나눠 읽기
async function readAll(mk){
  let out = [], f = 0;
  for (;;) {
    const { data, error } = await mk().range(f, f + 999);
    if (error) return { error };
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    f += 1000;
  }
  return { data: out };
}

async function load(){
  const m = DAY.slice(0, 7), y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7));
  const from = m + '-01', to = m + '-' + String(new Date(y, mo, 0).getDate()).padStart(2, '0');
  const [a, b, c, d, mt, mn, mo2] = await Promise.all([
    sb.from('nl_tasks').select('*').eq('task_date', DAY).order('staff_id').order('id'),
    sb.from('nl_tasks').select('*').lt('task_date', DAY).in('state', ['할 일', '하는 중']).order('task_date').limit(500),
    sb.from('nl_task_rules').select('*').order('active', { ascending: false }).order('staff_id').order('id'),
    sb.from('nl_work_notes').select('*').eq('note_date', DAY).order('note_time', { ascending: true, nullsFirst: true }).order('id').limit(1000),
    readAll(() => sb.from('nl_tasks').select('id, staff_id, state, reason, title, task_date').gte('task_date', from).lte('task_date', to).order('id')),
    readAll(() => sb.from('nl_work_notes').select('*').gte('note_date', from).lte('note_date', to).order('note_date').order('note_time', { ascending: true, nullsFirst: true }).order('id')),
    sb.from('nl_offdays').select('off_date, kind, reason').gte('off_date', from).lte('off_date', to).in('kind', ['공휴일', '센터휴무'])
  ]);
  const er = a.error || b.error || c.error || d.error || mt.error || mn.error || mo2.error;
  if (er) { $('body').innerHTML = '<div class="card err">불러오지 못했습니다.\n' + esc(er.message) + '</div>'; return; }
  TASKS = a.data || []; LATE = b.data || []; RULES = c.data || []; NOTES = d.data || [];
  MTASKS = mt.data || []; MNOTES = mn.data || [];
  MOFF = {}; (mo2.data || []).forEach(o => { MOFF[o.off_date] = o.reason || o.kind; });
  // 앞날 예정 — 늘 하는 일이 그날 새벽에 할 일로 생길 것 (서버 셈 · 못 부르면 비움)
  PREV = [];
  const pf = from > today() ? from : today();
  if (pf <= to) {
    const { data: pv, error: pe } = await sb.rpc('nl_task_preview', { p_from: pf, p_to: to });
    if (!pe) PREV = pv || [];
  }
  // 오늘 화면이면 오늘 몫 늘 하는 일을 저절로 넣음 (흐린 「예정」으로 남지 않게 · 한 번만)
  if (DAY === today() && !AUTO_MADE[DAY] && PREV.some(x => x.on_date === DAY)) {
    AUTO_MADE[DAY] = true;
    const mk = await sb.rpc('nl_make_tasks', { p_date: DAY });
    if (!mk.error && Number(mk.data) > 0) return load();
  }
  // 지난 날 남은 일에 딸린 일지도 보이게 (그 일이 다른 날에 있어도)
  const lateIds = LATE.map(t => t.id);
  if (lateIds.length) {
    const { data: ln } = await sb.from('nl_work_notes').select('*').in('task_id', lateIds).limit(1000);
    (ln || []).forEach(n => { if (!NOTES.some(x => x.id === n.id)) NOTES.push(n); });
  }
  if (FORM && FORM.note && !NOTES.some(x => x.id === FORM.note)) FORM = null;
  if (FORM && FORM.task !== 'free' && !TASKS.concat(LATE).some(t => t.id === FORM.task)) FORM = null;
  if (MOVE && !TASKS.concat(LATE).some(t => t.id === MOVE)) MOVE = null;
  if (DELQ && !TASKS.concat(LATE).some(t => t.id === DELQ)) DELQ = null;
  draw();
}

// 할 일 한 칸 — kind: 'today' 그 날 · 'cont' 이어서 하는 일(진행 중) · 'late' 지난 날 남은 일
function dayGap(a, b){ return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function taskRow(t, kind){
  const tn = NOTES.filter(n => n.task_id === t.id);
  const st = t.state, done = st === '끝냄', moved = st === '미룸';
  const cls = done ? ' done' : moved ? ' moved' : st === '못 함' ? ' cant' : st === '하는 중' ? ' cont' : '';
  const sub = [];
  if (WHO === 'all') sub.push(esc(stName(t.staff_id)));
  sub.push(t.source === '맡김' ? '맡긴 일' : esc(t.source || ''));
  if (kind === 'cont') sub.push(dlab(t.task_date) + '부터 · ' + (dayGap(t.task_date, DAY) + 1) + '일째 진행 중');
  else if (kind === 'late') sub.push('<b style="color:var(--coral)">' + dlab(t.task_date) + ' 할 일</b>');
  else if (st === '하는 중') sub.push('진행 중');
  if (moved && t.moved_to) sub.push('→ ' + dlab(t.moved_to) + '로 옮김');

  const noteOpen = FORM && FORM.note && tn.some(n => n.id === FORM.note);
  let h = '<div class="tc' + cls + '"><div class="top">'
    + '<button type="button" class="cb" data-chk="' + t.id + '" title="' + (done ? '체크 풀기 (할 일로)' : '체크하면 끝냄') + '"' + (moved ? ' disabled' : '') + '>' + (done ? '✓' : '') + '</button>'
    + '<div class="tt">' + esc(t.title) + '<div class="sub">' + sub.filter(Boolean).join(' · ') + '</div></div>';
  if (!moved) h += '<div class="sb">'
    + '<button type="button" data-tk="' + t.id + '" data-s="' + (st === '하는 중' ? '할 일' : '하는 중') + '" class="' + (st === '하는 중' ? 'on2' : '') + '" title="' + (st === '하는 중' ? '다시 누르면 할 일로' : '끝낼 때까지 날마다 따라옴') + '">진행 중</button>'
    + (done ? '' : '<button type="button" data-mv="' + t.id + '">📅 날짜 옮기기</button>')
    + '<button type="button" data-tk="' + t.id + '" data-s="' + (st === '못 함' ? '할 일' : '못 함') + '" class="' + (st === '못 함' ? 'on5' : '') + '">못 함</button>'
    + (IS_BOSS ? '<button type="button" data-del="' + t.id + '" title="지우기">✕</button>' : '') + '</div>';
  h += '</div>';
  if (MOVE === t.id) h += '<div class="mv">옮길 날 <input type="date" id="mvday" min="' + addDay(t.task_date, 1) + '" value="' + addDay(DAY > t.task_date ? DAY : t.task_date, 1) + '">'
    + '<button type="button" class="pri" id="mvgo">옮기기</button><button type="button" id="mvno">그만</button>'
    + '<span class="dim" style="font-size:12px">고른 날에 이 일이 들어가고, 이 날에는 「→ 옮김」이 남습니다.</span></div>';
  if (DELQ === t.id) { const rr = RULES.find(r => r.id === t.rule_id);
    h += '<div class="mv" style="background:#FCEFEA">이 반복하는 일을 어떻게 지울까요?'
      + '<button type="button" id="delone">이 날 것만 지우기</button>'
      + (rr ? '<button type="button" id="delrule" style="color:#c62828;border-color:#efc9c9">반복 자체 지우기</button>' : '')
      + '<button type="button" id="delno">그만</button>'
      + '<span class="dim" style="font-size:12px;width:100%">이 날 것만 — 이 날은 다시 안 생깁니다. 반복 자체' + (rr ? ' (' + esc(ruleText(rr)) + ')' : '') + ' — 오늘부터 앞날의 「할 일」 칸도 함께 지워지고, 끝낸 칸 · 지난 기록은 남습니다.</span></div>'; }
  if (!moved) h += '<div class="memo"><textarea data-memo="' + t.id + '" maxlength="1000" placeholder="보완 메모 — 눌러서 적기 (칸을 벗어나면 저장)" class="' + (t.result ? 'has' : '') + '">' + esc(t.result || '') + '</textarea></div>';

function addDay(d, k){ const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + k); return ymd(x); }

// 달력 (월~토 · 일요일은 뺌)
function calHtml(){
  const m = DAY.slice(0, 7), y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7));
  const last = new Date(y, mo, 0).getDate(), td = today();
  const who = x => WHO === 'all' || Number(x.staff_id) === Number(WHO);
  const day = {};
  const cell = ds => day[ds] || (day[ds] = { n: 0, done: 0, cant: 0, left: 0, nt: 0, nc: 0 });
  MTASKS.filter(who).forEach(t => {
    if (t.state === '미룸') return;
    const o = cell(t.task_date); o.n++;
    if (t.state === '끝냄') o.done++; if (t.state === '못 함') o.cant++;
    if (t.state === '할 일' && t.task_date < td) o.left++;   // 진행 중은 일부러 이어서 하는 일이라 빨강에서 뺌 (2026-10-10)
  });
  MNOTES.filter(who).forEach(n => { const o = cell(n.note_date); if (isComplaint(n.kind)) o.nc++; else o.nt++; });
  let c = ['월', '화', '수', '목', '금', '토'].map(w => '<div class="h">' + w + '</div>').join('');
  const first = new Date(y, mo - 1, 1).getDay();
  const lead = first === 0 ? 0 : first - 1;
  for (let i = 0; i < lead; i++) c += '<div class="c blank"></div>';
  for (let d = 1; d <= last; d++) {
    const ds = m + '-' + String(d).padStart(2, '0');
    if (new Date(y, mo - 1, d).getDay() === 0) continue;
    const o = day[ds], off = MOFF[ds];
    let inner = '<b style="font-weight:600">' + d + '</b>' + (ds === td ? ' <span class="dim">오늘</span>' : '');
    if (off) inner += ' <span class="dim">' + esc(off) + '</span>';
    if (o && o.n) {
      const cl = (o.left || o.cant) ? 'bad' : (o.done === o.n ? 'ok3' : 'ok2');
      inner += '<br><span class="' + cl + '">' + o.done + '/' + o.n + (o.cant ? ' 못함' + o.cant : '') + '</span>';
    }
    const pv = PREV.filter(x => x.on_date === ds && (WHO === 'all' || Number(x.staff_id) === Number(WHO))).length;
    if (pv) inner += '<br><span class="dim">예정 ' + pv + '</span>';
    if (o && (o.nt || o.nc)) inner += ((o.n || pv) ? ' · ' : '<br>') + (o.nt ? '일지 ' + o.nt : '') + (o.nt && o.nc ? ' · ' : '') + (o.nc ? '<span style="color:#993556">민원 ' + o.nc + '</span>' : '');
    c += '<div class="c' + (off ? ' off' : '') + (ds === DAY ? ' sel' : '') + '" data-goday="' + ds + '">' + inner + '</div>';
  }
  return '<div class="cal">' + c + '</div>';
}

function draw(){
  const tl = TASKS.filter(t => WHO === 'all' || Number(t.staff_id) === Number(WHO));
  const ll = LATE.filter(t => WHO === 'all' || Number(t.staff_id) === Number(WHO));
  const done = tl.filter(t => t.state === '끝냄').length;
  const free = NOTES.filter(n => !n.task_id && n.note_date === DAY && (WHO === 'all' || Number(n.staff_id) === Number(WHO)));
  const y = Number(DAY.slice(0, 4)), mo = Number(DAY.slice(5, 7));
  // ① 달력
  let h = '<div class="card"><div class="ct"><button type="button" id="mprev">‹</button><span>' + y + '년 ' + mo + '월</span><button type="button" id="mnext">›</button>'
    + (IS_BOSS ? '<select id="wsel"><option value="all">모든 직원</option>' + STAFF.map(s => '<option value="' + s.id + '"' + (String(WHO) === String(s.id) ? ' selected' : '') + '>' + esc(s.id + '번 ' + s.name) + '</option>').join('') + '</select>' : '')
    + '<span style="flex:1"></span><button type="button" id="gotoday">오늘</button></div>'
    + calHtml()
    + '<div class="note">날짜를 누르면 아래에 그 날 할 일이 나옵니다. 칸 숫자 — 끝냄/할 일 (미룬 일은 뺌) · 일지 · 민원. 초록 = 다 끝냄 · 주황 = 남은 일 · 빨강 = 지난 날 남은 일이나 못 함</div></div>';
  // ② 고른 날
  h += '<div class="card" id="dayCard"><div class="ct">'
    + '<button type="button" id="dprev" title="앞 날">‹</button><span>' + dlab(DAY) + '</span><button type="button" id="dnext" title="다음 날">›</button>'
    + '<span class="dim" style="font-weight:400">' + tl.length + '개 중 끝냄 ' + done + ' · 업무일지 ' + NOTES.filter(n => n.note_date === DAY && (WHO === 'all' || Number(n.staff_id) === Number(WHO))).length + '</span>'
    + '<span style="flex:1"></span>' + (IS_BOSS ? '<button type="button" id="remake">이 날 목록 다시 만들기</button>' : '') + '</div>';
  const lc = ll.filter(t => t.state === '하는 중'), lt = ll.filter(t => t.state !== '하는 중');
  if (lc.length) h += '<div class="glab">이어서 하는 일 ' + lc.length + ' — 진행 중 · 끝낼 때까지 날마다 따라옴</div>' + lc.map(t => taskRow(t, 'cont')).join('');
  if (lt.length) h += '<div class="glab red">지난 날 남은 일 ' + lt.length + '</div>' + lt.map(t => taskRow(t, 'late')).join('');
  const pl = PREV.filter(x => x.on_date === DAY && (WHO === 'all' || Number(x.staff_id) === Number(WHO)));
  if (ll.length && (tl.length || pl.length)) h += '<div class="glab">' + (DAY === today() ? '오늘' : dlab(DAY)) + ' 할 일</div>';
  h += tl.length ? tl.map(t => taskRow(t, 'today')).join('') : (pl.length ? '' : '<div class="dim">이 날 할 일이 없습니다.</div>');
  if (pl.length) h += pl.map(x => '<div class="tc moved"><div class="top"><button type="button" class="cb" disabled></button><div class="tt">' + esc(x.title)
     + '<div class="sub">' + (WHO === 'all' ? esc(stName(x.staff_id)) + ' · ' : '') + '늘 하는 일 · 예정 — ' + (DAY === today() ? '「이 날 목록 다시 만들기」를 누르면 들어옵니다' : '그날 새벽 5시에 들어옵니다') + '</div></div></div></div>').join('');
  h += '<div class="note" style="margin-top:4px">끝내면 체크 · 며칠 걸리는 일은 「진행 중」(끝낼 때까지 날마다 따라옴) · 다른 날로 미룰 때는 「📅 날짜 옮기기」. 길게 남길 기록과 민원은 아래 「추가 업무」에 적습니다.</div>';
  // 추가 업무 (할 일에 붙지 않은 일지)
  const freeOpen = FORM && FORM.task === 'free' && !FORM.note;
  h += '<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">'
     + '<div class="row"><b style="font-size:13px">추가 업무</b><span class="dim" style="font-size:12px">학부모 민원 · 치료사 민원 · 기타</span><span style="flex:1"></span>'
     + (freeOpen ? '' : '<button type="button" id="freeopen">＋ 추가 업무 적기</button>') + '</div>'
     + (free.length ? free.map(noteRow).join('') : (freeOpen ? '' : '<div class="dim" style="font-size:12.5px;margin-top:4px">없습니다.</div>'))
     + (freeOpen ? formHtml() : '') + '</div>';
  // 할 일 맡기기 (원장님만)
  if (IS_BOSS) h += '<div class="row" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px;">'
     + '<select id="nwho">' + STAFF.map(s => '<option value="' + s.id + '"' + (String(WHO) === String(s.id) ? ' selected' : '') + '>' + esc(s.id + '번 ' + s.name) + '</option>').join('') + '</select>'
     + '<input type="date" id="nday" value="' + DAY + '">'
     + '<input id="ntitle" placeholder="맡길 일" style="flex:1 1 240px">'
     + '<button type="button" class="pri" id="nadd">＋ 할 일 맡기기</button></div>';
  h += '<div id="tmsg" class="msg"></div></div>';

  // ③ 접은 묶음 — 늘 하는 일 설정 · 직원별 · 이 달 일지
  if (IS_BOSS) h += '<details class="card fold" data-fold="rules"' + (FOLD.rules ? ' open' : '') + '><summary class="ct">늘 하는 일 설정 <span class="dim" style="font-weight:400">— 새벽 5시에 그날 목록으로 저절로 들어갑니다</span></summary><table>'
     + '<tr><th>직원</th><th>할 일</th><th>주기</th><th>쉬는 날</th><th>기간</th><th></th></tr>'
     + RULES.map(r => '<tr data-rid="' + r.id + '" title="눌러서 고치기" class="rrow' + (r.active ? '' : ' dim') + (String(r.id) === String(EDIT_RID) ? ' redit' : String(r.id) === String(NEW_RID) ? ' rnew' : '') + '"><td>' + esc(stName(r.staff_id)) + '</td><td>' + esc(r.title) + '</td>'
         + '<td>' + esc(ruleText(r)) + '</td>'
         + '<td>' + (r.skip_off ? (r.cycle === '매일' ? '건너뜀' : '다음 출근 날') : '그대로') + '</td>'
         + '<td>' + esc(r.from_date) + ' ~ ' + esc(r.to_date || '') + '</td>'
         + '<td style="white-space:nowrap"><button type="button" data-ra="' + r.id + '">' + (r.active ? '끄기' : '켜기') + '</button> <button type="button" class="rdel" data-rdel="' + r.id + '">✕ 지우기</button></td></tr>').join('')
     + '</table>'
     + '<div class="row" style="margin-top:12px;">'
     + '<select id="rwho">' + STAFF.map(s => '<option value="' + s.id + '">' + esc(s.id + '번 ' + s.name) + '</option>').join('') + '</select>'
     + '<input id="rtitle" placeholder="늘 하는 일" style="flex:1 1 220px">'
     + '<span class="dim" style="font-size:12.5px">월</span><select id="rmon" title="월"><option value="">적용 없음</option><option value="all">매달</option>'
     +   Array.from({ length: 12 }, (_, i) => '<option value="' + (i + 1) + '">' + (i + 1) + '월</option>').join('') + '</select>'
     + '<span class="dim" style="font-size:12.5px">주</span><select id="rwk" title="주"><option value="">적용 없음</option><option value="all">매주</option>'
     +   [1, 2, 3, 4, 5].map(i => '<option value="' + i + '">' + WK[i] + ' 주</option>').join('') + '</select>'
     + '<span class="dim" style="font-size:12.5px">일</span><select id="rday" title="일"><option value="">적용 없음</option><option value="all">매일</option>'
     +   '<optgroup label="요일">' + [1, 2, 3, 4, 5, 6].map(i => '<option value="w' + i + '">' + WD[i] + '요일</option>').join('') + '</optgroup>'
     +   '<optgroup label="날짜">' + Array.from({ length: 31 }, (_, i) => '<option value="d' + (i + 1) + '">' + (i + 1) + '일</option>').join('') + '</optgroup></select>'
     + '<span id="rprev" style="font-size:13px;font-weight:600;color:var(--acc,#7E5530)"></span>'
     + '<label class="dim" style="font-size:12.5px"><input type="checkbox" id="rskip" checked> 쉬는 날 건너뜀</label>'
     + '<button type="button" class="pri" id="radd">' + (EDIT_RID ? '저장' : '＋ 더하기') + '</button>'
     + (EDIT_RID ? '<button type="button" id="rcancel">취소</button>' : '')
     + '<span id="rmsg"></span></div>'
     + '<div class="note">주기는 월 · 주 · 일 다이얼을 골라 정합니다. 일 「매일」은 고른 기간에 날마다, 일 「적용 없음」은 고른 기간에 한 번(그 기간 첫날) 만듭니다. 보기 — 매달 · 마지막 주 · 적용 없음 = 매달 마지막 주 첫날 한 번 / 매주 월요일 = 월 적용 없음 · 주 매주 · 일 월요일 / 매달 1일 = 월 매달 · 주 적용 없음 · 일 1일 / 매달 마지막 주 화요일 = 월 매달 · 주 마지막 주 · 일 화요일<br>첫째 주 = 1~7일 · 마지막 주 = 그 달의 마지막 7일 · 마지막 주 화요일 = 그 달의 마지막 화요일<br>쉬는 날 — 일요일 · 공휴일 · 센터휴무. 매일은 그날을 건너뛰고, 그 밖의 주기는 다음 출근 날로 미뤄 만듭니다.<br>표의 줄을 누르면 아래 칸에 들어가 고칠 수 있습니다 (고친 것은 다음에 만드는 목록부터). 잠시 멈출 때는 「끄기」, 아예 없앨 때는 「✕ 지우기」 — 오늘부터 앞날의 「할 일」 칸도 함께 지워지고, 끝낸 칸 · 지난 기록은 남습니다. 날짜 상자의 반복하는 일 칸 「✕」로도 「이 날 것만 / 반복 자체」를 골라 지울 수 있습니다.</div></details>';
  if (IS_BOSS) h += '<details class="card fold" data-fold="staff"' + (FOLD.staff ? ' open' : '') + '><summary class="ct">직원별 이 달 확인 <span class="dim" style="font-weight:400">— ' + mo + '월</span></summary>' + staffHtml() + '</details>';
  h += '<details class="card fold" data-fold="mnotes"' + (FOLD.mnotes ? ' open' : '') + '><summary class="ct">이 달 업무일지 모아 보기</summary>'
     + '<div class="kf" style="margin-bottom:8px">' + ['all'].concat(KINDS).map(k => '<button type="button" data-mk="' + k + '" class="' + (MKIND === k ? 'on' : '') + '">' + (k === 'all' ? '전체' : k) + '</button>').join('') + '</div>'
     + '<div id="mlist">' + monthNotesHtml() + '</div></details>';
  $('body').innerHTML = h;
  bind();
}

function bind(){
  const goDay = d => { if (d === DAY) return; if (!leaveOk()) return; FORM = null; DAY = d; load(); };
  const shift = k => { const x = new Date(DAY + 'T00:00:00'); x.setDate(x.getDate() + k); return ymd(x); };
  const mshift = k => { const x = new Date(Number(DAY.slice(0, 4)), Number(DAY.slice(5, 7)) - 1 + k, 1); return ymd(x); };
  $('dprev').onclick = () => goDay(shift(-1));
  $('dnext').onclick = () => goDay(shift(1));
  $('mprev').onclick = () => goDay(mshift(-1));
  $('mnext').onclick = () => goDay(mshift(1));
  $('gotoday').onclick = () => goDay(today());
  document.querySelectorAll('[data-goday]').forEach(el => el.onclick = e => { e.preventDefault(); goDay(el.dataset.goday);
    setTimeout(() => { const c = $('dayCard'); if (c && c.scrollIntoView) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 300); });
  if ($('wsel')) $('wsel').onchange = () => { if (!leaveOk()) { $('wsel').value = WHO; return; } FORM = null; WHO = $('wsel').value; draw(); };
  document.querySelectorAll('details.fold').forEach(dt => dt.addEventListener('toggle', () => { FOLD[dt.dataset.fold] = dt.open; saveFold(); }));
  document.querySelectorAll('button[data-mk]').forEach(b => b.onclick = () => {
    MKIND = b.dataset.mk;
    document.querySelectorAll('button[data-mk]').forEach(x => x.classList.toggle('on', x.dataset.mk === MKIND));
    $('mlist').innerHTML = monthNotesHtml();
    document.querySelectorAll('#mlist [data-goday]').forEach(el => el.onclick = e => { e.preventDefault(); goDay(el.dataset.goday); });
  });
  if ($('remake')) $('remake').onclick = async () => {
    if (!leaveOk()) return;
    const { data, error } = await sb.rpc('nl_make_tasks', { p_date: DAY });
    if (error) { msg('❌ ' + error.message, false); return; }
    msg('늘 하는 일에서 ' + data + '개를 새로 넣었습니다.', true); FORM = null; load();
  };
  if ($('nadd')) $('nadd').onclick = async () => {
    const title = $('ntitle').value.trim();
    if (!title) { msg('맡길 일을 적어 주세요.', false); return; }
    if (!leaveOk()) return;
    const { data, error } = await sb.from('nl_tasks').insert({ task_date: $('nday').value || DAY, staff_id: Number($('nwho').value), title: title, source: '맡김' }).select('id');
    if (error || !data || !data.length) { msg('❌ 맡기지 못했습니다. ' + (error ? error.message : ''), false); return; }
    msg('맡겼습니다.', true); FORM = null; load();
  };
  // 일지 칸 열기 — 할 일 글 · 할 일 없이 · 고치기
  const openForm = f => {
    if (FORM && JSON.stringify(FORM) === JSON.stringify(f)) return;
    if (!leaveOk()) return;
    FORM = f; NMSG = null; draw(); if ($('wcontent')) $('wcontent').focus();
  };
  if ($('freeopen')) $('freeopen').onclick = () => openForm({ task: 'free', note: null });
  document.querySelectorAll('button[data-nedit]').forEach(b => b.onclick = () => {
    const n = NOTES.find(x => x.id === Number(b.dataset.nedit)); if (!n) return;
    openForm({ task: n.task_id || 'free', note: n.id });
  });
  const wmsg = (t, ok) => { NMSG = { t, ok }; const m = $('wmsg'); if (m) { m.textContent = t; m.style.color = ok ? '#2e7d32' : '#c62828'; } };
  if ($('wcancel')) $('wcancel').onclick = () => { if (noteDraft() && !confirm('적은 것을 저장하지 않고 그만둘까요?')) return; FORM = null; draw(); };
  // 아동 이름 고르기 (2026-10-10)
  if ($('wkidq')) {
    const q = $('wkidq'), lst = $('wkidlist');
    const show = () => {
      const t = q.value.trim();
      if (!t) { lst.style.display = 'none'; return; }
      const hit = KIDS.filter(k => String(k.name || '').indexOf(t) >= 0).slice(0, 12);
      lst.innerHTML = hit.length ? hit.map(k => '<div data-kid="' + k.id + '" style="padding:6px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #F3F0EC">'
          + esc(kidLabel(k.id)) + (k.status && k.status !== '치료중' ? ' <span class="dim">' + esc(k.status) + '</span>' : '') + '</div>').join('')
        : '<div class="dim" style="padding:6px 10px;font-size:12.5px">맞는 아동이 없습니다</div>';
      lst.style.display = 'block';
      lst.querySelectorAll('[data-kid]').forEach(el => {
        el.onmouseenter = () => { el.style.background = '#FBF5EE'; }; el.onmouseleave = () => { el.style.background = ''; };
        el.onmousedown = e => { e.preventDefault(); $('wchild').value = el.dataset.kid; q.value = kidLabel(el.dataset.kid); lst.style.display = 'none'; };
      });
    };
    q.addEventListener('input', () => { $('wchild').value = ''; show(); });
    q.addEventListener('focus', show);
    q.addEventListener('blur', () => setTimeout(() => { lst.style.display = 'none'; }, 150));
  }
  if ($('wsave')) $('wsave').onclick = async () => {
    const b = $('wsave'); if (b.disabled) return;
    const content = $('wcontent').value.trim();
    if (!content) { wmsg('⚠ 내용을 적어 주세요', false); $('wcontent').focus(); return; }
    // 아동 — 이름을 쳤는데 목록에서 안 골랐으면, 같은 이름이 한 명뿐일 때만 저절로 고름
    if ($('wkidq').value.trim() && !$('wchild').value) {
      const q = $('wkidq').value.trim(), hit = KIDS.filter(k => k.name === q);
      if (hit.length === 1) $('wchild').value = hit[0].id;
      else { wmsg(hit.length ? '⚠ 같은 이름이 ' + hit.length + '명 — 목록에서 골라 주세요' : '⚠ 목록에서 아동을 골라 주세요', false); $('wkidq').focus(); return; }
    }
    const cv = $('wchild').value.trim();
    const row = { kind: $('wkind').value, note_time: $('wtime').value || null, child_id: cv ? Number(cv) : null,
                  content: content, improve: $('wimprove').value.trim() || null, result: $('wresult').value.trim() || null };
    b.disabled = true; b.textContent = '저장 중…';
    const q = FORM.note ? sb.from('nl_work_notes').update(row).eq('id', FORM.note).select('id')
                        : sb.from('nl_work_notes').insert(Object.assign({ note_date: DAY, staff_id: ME_ID, task_id: FORM.task === 'free' ? null : FORM.task }, row)).select('id');
    const { data, error } = await q;
    if (error || !data || !data.length) {
      b.disabled = false; b.textContent = FORM.note ? '고친 것 저장' : '저장';
      let why = error ? error.message : '저장된 줄을 돌려받지 못했습니다';
      if (/foreign key|child/i.test(why)) why = '그 번호의 아동이 없습니다. 아동 번호를 확인해 주세요.\n(' + why + ')';
      wmsg('❌ 저장하지 못했습니다', false); alert('업무일지를 저장하지 못했습니다.\n' + why); return;
    }
    const was = FORM.note; FORM = null;
    msg(was ? '✓ 고친 것을 저장했습니다' : '✓ 업무일지를 저장했습니다', true);
    await load(); msg(was ? '✓ 고친 것을 저장했습니다' : '✓ 업무일지를 저장했습니다', true);
  };
  if (NMSG) { wmsg(NMSG.t, NMSG.ok); NMSG = null; }
  document.querySelectorAll('button[data-ndel]').forEach(b => b.onclick = async () => {
    const n = NOTES.find(x => x.id === Number(b.dataset.ndel)); if (!n) return;
    if (!confirm('이 업무일지를 지울까요?\n\n' + n.kind + ' · ' + String(n.content).slice(0, 60) + '\n\n지운 뒤에는 되살릴 수 없습니다.')) return;
    const { data, error } = await sb.from('nl_work_notes').delete().eq('id', n.id).select('id');
    if (error || !data || !data.length) { alert('지우지 못했습니다.\n' + (error ? error.message : '지운 줄을 돌려받지 못했습니다')); return; }
    if (FORM && FORM.note === n.id) FORM = null;
    load();
  });
  document.querySelectorAll('button[data-ns]').forEach(b => b.onclick = async () => {
    const n = NOTES.find(x => x.id === Number(b.dataset.ns)); if (!n || n.state === b.dataset.s) return;
    if (!leaveOk()) return;
    const { data, error } = await sb.from('nl_work_notes').update({ state: b.dataset.s }).eq('id', n.id).select('id');
    if (error || !data || !data.length) { alert('바꾸지 못했습니다.\n' + (error ? error.message : '바뀐 줄을 돌려받지 못했습니다')); return; }
    FORM = null; load();
  });
  // 할 일 상태 · 지우기
  document.querySelectorAll('button[data-tk]').forEach(b => b.onclick = async () => {
    const t = TASKS.concat(LATE).find(x => x.id === Number(b.dataset.tk)); if (!t) return;
    const s = b.dataset.s; if (t.state === s) return;
    if (!leaveOk()) return;
    const up = { state: s };
    if (s === '못 함') { const w = prompt('못 한 까닭을 적어 주세요. (반드시)', t.reason || ''); if (w === null || !w.trim()) return; up.reason = w.trim(); }
    const { data, error } = await sb.from('nl_tasks').update(up).eq('id', t.id).select('id');
    if (error || !data || !data.length) { msg('❌ 바꾸지 못했습니다. ' + (error ? error.message : ''), false); return; }
    FORM = null; MOVE = null; load();
  });
  // 체크 상자 — 끝냄 ↔ 할 일
  document.querySelectorAll('button[data-chk]').forEach(b => b.onclick = async () => {
    const t = TASKS.concat(LATE).find(x => x.id === Number(b.dataset.chk)); if (!t || t.state === '미룸') return;
    if (b.disabled) return; b.disabled = true;
    const ns = t.state === '끝냄' ? '할 일' : '끝냄';
    const { data, error } = await sb.from('nl_tasks').update({ state: ns }).eq('id', t.id).select('id');
    if (error || !data || !data.length) { b.disabled = false; msg('❌ 바꾸지 못했습니다. ' + (error ? error.message : ''), false); return; }
    MOVE = null; load();
  });
  // 보완 메모 — 칸을 벗어나면 저장
  document.querySelectorAll('textarea[data-memo]').forEach(el => {
    el.addEventListener('blur', async () => {
      const t = TASKS.concat(LATE).find(x => x.id === Number(el.dataset.memo)); if (!t) return;
      const v = el.value.trim();
      if (v === (t.result || '')) return;
      el.dataset.saving = '1';
      const { data, error } = await sb.from('nl_tasks').update({ result: v || null }).eq('id', t.id).select('id, result');
      delete el.dataset.saving;
      if (error || !data || !data.length) { alert('보완 메모를 저장하지 못했습니다.\n' + (error ? error.message : '저장된 줄을 돌려받지 못했습니다')); return; }
      t.result = data[0].result; el.classList.toggle('has', !!t.result);
      msg('✓ 보완 메모를 저장했습니다 — ' + t.title, true);
    });
  });
  // 날짜 옮기기 (= 미룸 · 뒤 날짜만)
  document.querySelectorAll('button[data-mv]').forEach(b => b.onclick = () => {
    if (!leaveOk()) return; MOVE = MOVE === Number(b.dataset.mv) ? null : Number(b.dataset.mv); FORM = null; draw();
  });
  if ($('mvno')) $('mvno').onclick = () => { MOVE = null; draw(); };
  if ($('mvgo')) $('mvgo').onclick = async () => {
    const t = TASKS.concat(LATE).find(x => x.id === MOVE); if (!t) return;
    const d = $('mvday').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d <= t.task_date) { msg('옮길 날은 ' + dlab(t.task_date) + ' 뒤 날짜로 골라 주세요.', false); return; }
    const b = $('mvgo'); if (b.disabled) return; b.disabled = true; b.textContent = '옮기는 중…';
    const { data, error } = await sb.from('nl_tasks').update({ state: '미룸', moved_to: d }).eq('id', t.id).select('id');
    if (error || !data || !data.length) { b.disabled = false; b.textContent = '옮기기'; msg('❌ 옮기지 못했습니다. ' + (error ? error.message : ''), false); return; }
    MOVE = null; msg('✓ ' + dlab(d) + '로 옮겼습니다 — ' + t.title, true); await load(); msg('✓ ' + dlab(d) + '로 옮겼습니다 — ' + t.title, true);
  };
  document.querySelectorAll('button[data-del]').forEach(b => b.onclick = async () => {
    const t = TASKS.concat(LATE).find(x => x.id === Number(b.dataset.del)); if (!t) return;
    // 반복하는 일 — 「이 날 것만 / 반복 자체」 고르기 (2026-10-10)
    if (t.source === '늘 하는 일' && t.rule_id) { if (!leaveOk()) return; DELQ = DELQ === t.id ? null : t.id; MOVE = null; FORM = null; draw(); return; }
    const tn = NOTES.filter(n => n.task_id === t.id).length;
    if (!confirm('이 할 일을 지울까요?\n' + t.title + (tn ? '\n\n딸린 업무일지 ' + tn + '개는 남고, 「추가 업무」로 옮겨집니다.' : ''))) return;
    if (!leaveOk()) return;
    const { data, error } = await sb.from('nl_tasks').delete().eq('id', t.id).select('id');
    if (error || !data || !data.length) { msg('❌ 지우지 못했습니다. ' + (error ? error.message : ''), false); return; }
    FORM = null; load();
  });
  if ($('delno')) $('delno').onclick = () => { DELQ = null; draw(); };
  if ($('delone')) $('delone').onclick = async () => {
    const t = TASKS.concat(LATE).find(x => x.id === DELQ); if (!t) return;
    const b = $('delone'); if (b.disabled) return; b.disabled = true;
    const { data, error } = await sb.from('nl_tasks').delete().eq('id', t.id).select('id');
    if (error || !data || !data.length) { b.disabled = false; msg('❌ 지우지 못했습니다. ' + (error ? error.message : ''), false); return; }
    DELQ = null; await load(); msg('✓ ' + dlab(t.task_date) + ' 「' + t.title + '」 지웠습니다 — 이 날은 다시 안 생깁니다', true);
  };
  if ($('delrule')) $('delrule').onclick = async () => {
    const t = TASKS.concat(LATE).find(x => x.id === DELQ); if (!t) return;
    const r = RULES.find(x => x.id === t.rule_id); if (!r) return;
    if (!confirm('「' + r.title + '」 · ' + ruleText(r) + '\n\n반복 자체를 지울까요?\n\n오늘부터 앞날의 「할 일」 칸도 함께 지워집니다.\n끝낸 칸 · 지난 기록은 남습니다.')) return;
    const b = $('delrule'); if (b.disabled) return; b.disabled = true;
    const { data, error } = await sb.from('nl_task_rules').delete().eq('id', r.id).select('id');
    if (error || !data || !data.length) { b.disabled = false; msg('❌ 지우지 못했습니다. ' + (error ? error.message : ''), false); return; }
    DELQ = null; if (String(EDIT_RID) === String(r.id)) EDIT_RID = null;
    await load(); msg('✓ 반복하는 일 「' + r.title + '」 지웠습니다', true);
  };
  // 늘 하는 일 설정 (원장님만 — 선생님 화면에는 이 칸이 없음)
  if (!$('radd')) return;
  const prev = () => { const d = dialRule(); $('rprev').textContent = d.err ? '⚠ ' + d.err : '→ ' + d.text; $('rprev').style.color = d.err ? '#c62828' : ''; };
  ['rmon', 'rwk', 'rday'].forEach(id => $(id).onchange = prev); prev();
  const rmsg = (t, ok) => { RMSG = { t, ok }; const m = $('rmsg'); if (m) { m.textContent = t; m.style.color = ok ? '#2e7d32' : '#c62828'; } };
  if (RMSG) { rmsg(RMSG.t, RMSG.ok); RMSG = null; }
  // 고치는 줄이면 아래 칸을 그 줄 내용으로 채움
  const fillRule = r => {
    $('rwho').value = String(r.staff_id); $('rtitle').value = r.title || ''; $('rskip').checked = !!r.skip_off;
    const mo = r.year_month ? String(r.year_month) : (r.cycle === '매달' || r.cycle === '매달요일' || (r.cycle === '조합' && (r.week_no || r.month_day))) ? 'all' : '';
    const wk = r.week_no ? String(r.week_no) : (r.cycle === '매주') ? 'all' : '';
    const dy = (r.weekday != null && r.weekday >= 1) ? 'w' + r.weekday : r.month_day ? 'd' + r.month_day : (r.cycle === '매일' || (r.cycle === '조합' && !r.week_no)) ? 'all' : '';
    $('rmon').value = mo; $('rwk').value = wk; $('rday').value = dy; prev();
  };
  if (EDIT_RID) { const r = RULES.find(x => String(x.id) === String(EDIT_RID)); if (r) fillRule(r); else EDIT_RID = null; }
  document.querySelectorAll('tr[data-rid]').forEach(tr => tr.onclick = e => {
    if (e.target.closest('button')) return;
    EDIT_RID = Number(tr.dataset.rid); NEW_RID = null; RMSG = { t: '고치는 중 — 고친 뒤 「저장」', ok: true }; draw();
    $('rtitle').focus();
  });
  if ($('rcancel')) $('rcancel').onclick = () => { EDIT_RID = null; RMSG = null; draw(); };
  $('radd').onclick = async () => {
    const title = $('rtitle').value.trim(), dr = dialRule();
    if (!title) { rmsg('⚠ 늘 하는 일을 적어 주세요', false); return; }
    if (dr.err) { rmsg('⚠ ' + dr.err, false); return; }
    const row = Object.assign({ staff_id: Number($('rwho').value), title: title, skip_off: $('rskip').checked }, dr.row);
    const b = $('radd'); if (b.disabled) return; b.disabled = true; b.textContent = '저장 중…';
    const q = EDIT_RID ? sb.from('nl_task_rules').update(row).eq('id', EDIT_RID).select('id') : sb.from('nl_task_rules').insert(row).select('id');
    const { data, error } = await q;
    if (error || !data || !data.length) {
      b.disabled = false; b.textContent = EDIT_RID ? '저장' : '＋ 더하기';
      const why = error ? error.message : '저장된 줄을 돌려받지 못했습니다';
      rmsg('❌ 저장하지 못했습니다', false); alert('늘 하는 일을 저장하지 못했습니다.\n' + why); return;
    }
    NEW_RID = data[0].id; const was = EDIT_RID; EDIT_RID = null;
    // 오늘 몫을 바로 만듦 (새벽 5시를 기다리지 않게 · 2026-10-10)
    const mk = await sb.rpc('nl_make_tasks', { p_date: today() });
    const made = (!mk.error && mk.data) ? Number(mk.data) : 0;
    RMSG = { t: '✓ 저장했습니다 — ' + dr.text + (made ? ' · 오늘 목록에 ' + made + '개 바로 넣었습니다' : '') + ' (앞날은 달력에 「예정」으로 보이고 그날 새벽 5시에 들어갑니다)', ok: true };
    void was;
    load();
  };
  document.querySelectorAll('button[data-rdel]').forEach(b => b.onclick = async () => {
    const r = RULES.find(x => x.id === Number(b.dataset.rdel)); if (!r) return;
    if (!confirm('「' + r.title + '」 · ' + ruleText(r) + '\n\n이 늘 하는 일을 지울까요?\n\n오늘부터 앞날의 「할 일」 칸도 함께 지워집니다.\n끝낸 칸 · 지난 기록은 그대로 남습니다.\n잠시 멈추기만 하려면 「끄기」를 누르세요.')) return;
    const { data, error } = await sb.from('nl_task_rules').delete().eq('id', r.id).select('id');
    if (error || !data || !data.length) { alert('지우지 못했습니다.\n' + (error ? error.message : '지운 줄을 돌려받지 못했습니다')); return; }
    if (String(EDIT_RID) === String(r.id)) EDIT_RID = null;
    RMSG = { t: '✓ 지웠습니다 — 「' + r.title + '」', ok: true }; load();
  });
  document.querySelectorAll('button[data-ra]').forEach(b => b.onclick = async () => {
    const r = RULES.find(x => x.id === Number(b.dataset.ra)); if (!r) return;
    const { data, error } = await sb.from('nl_task_rules').update({ active: !r.active }).eq('id', r.id).select('id');
    if (error || !data || !data.length) { msg('❌ 바꾸지 못했습니다. ' + (error ? error.message : ''), false); return; }
    load();
  });
}

$('home').onclick = () => { location.href = 'index.html'; };
(async () => {
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { location.replace('index.html'); return; }
  const { data: me, error } = await sb.from('nl_therapists').select('id, name').eq('login_email', data.session.user.email.toLowerCase()).maybeSingle();
  if (error || !me) { $('body').innerHTML = '<div class="card err">직원 표에 이 이메일이 없습니다.</div>'; return; }
  nlKeep(me.id);
  ME_ID = Number(me.id);
  if (CAN_SEE.indexOf(Number(me.id)) < 0) { $('body').innerHTML = '<div class="card err">이 화면을 볼 권한이 없습니다.</div>'; return; }
  IS_BOSS = ME_ID === 8;
  if (!IS_BOSS) WHO = String(ME_ID);   // 선생님은 내 것만
  $('whoami').textContent = me.name + ' 님으로 로그인됨';
  const { data: st } = await sb.from('nl_therapists').select('id, name, role, left_on').order('id');
  STAFF = (st || []).filter(s => !s.left_on && !/치료사/.test(s.role || ''));
  { const kr = await readAll(() => sb.from('nl_children').select('id, name, birth, status').order('name').order('id')); KIDS = kr.data || []; }
  DAY = today();
  load();
})();
</script>
</body>
</html>
