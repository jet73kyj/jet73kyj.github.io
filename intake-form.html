<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>초기 상담 질문지 · 자라는나무</title>
<style>
  :root { --ink:#2F2926; --ink2:#5F5E5A; --ink3:#A39C95; --line:#ECE8E3;
          --bg:#F5F4F2; --acc:#B07A4A; --acc-bg:#F8F1E8; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg);
         margin:0; color:var(--ink); -webkit-font-smoothing:antialiased; }
  .hd { background:#fff; border-bottom:1px solid var(--line); display:flex;
        align-items:center; gap:10px; padding:10px 16px; }
  .hd img { height:22px; display:block; }
  .hd b { font-size:15px; font-weight:600; }
  .wrap { max-width:680px; margin:0 auto; padding:16px; }
  .box { background:#fff; border:1px solid var(--line); border-radius:12px;
         padding:16px 18px; margin-bottom:12px; }
  h1 { font-size:18px; font-weight:600; margin:0 0 6px; }
  .sub { font-size:13px; color:var(--ink2); line-height:1.7; }
  .sec { font-size:14px; font-weight:600; color:var(--acc); margin:4px 0 10px;
         padding-bottom:6px; border-bottom:2px solid #F0E4D6; }
  .q { padding:11px 0; border-bottom:1px solid var(--line); }
  .q:last-child { border-bottom:none; }
  .qt { font-size:14.5px; line-height:1.6; margin-bottom:8px; }
  .qn { color:var(--ink3); margin-right:4px; }
  .ch { display:flex; gap:6px; }
  .ch button { flex:1 1 0; font:inherit; font-size:14px; padding:10px 0; border-radius:8px;
    border:1px solid var(--line); background:#fff; color:var(--ink2); cursor:pointer; }
  .ch button.on { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:500; }
  textarea, input[type=text] { width:100%; font:inherit; font-size:15px; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  textarea { resize:vertical; line-height:1.6; min-height:76px; }
  textarea:focus, input:focus { outline:2px solid var(--acc); outline-offset:-1px; border-color:transparent; }
  .rad { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .rad label { display:flex; gap:8px; align-items:center; font-size:14px; padding:10px 11px;
    border:1px solid var(--line); border-radius:8px; cursor:pointer; background:#fff; }
  .rad label.on { border-color:var(--acc); background:var(--acc-bg); }
  .rad input { accent-color:var(--acc); margin:0; }
  #etc { margin-top:8px; display:none; }
  .send { width:100%; font:inherit; font-size:16px; font-weight:600; padding:14px; border-radius:10px;
    border:none; background:var(--acc); color:#fff; cursor:pointer; margin-top:4px; }
  .send:disabled { background:#C9C3BC; cursor:default; }
  .msg { font-size:14px; line-height:1.7; margin-top:10px; white-space:pre-wrap; }
  .err { color:#993C1D; }
  .done { text-align:center; padding:34px 18px; }
  .done .big { font-size:40px; margin-bottom:8px; }
  .hint { font-size:12.5px; color:var(--ink3); line-height:1.6; margin-top:6px; }
  @media (max-width:420px) { .rad { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="hd"><img src="img/nl-logo.png" alt="" onerror="this.style.display='none'"><b>자라는나무</b></div>
<div class="wrap" id="app"><div class="box"><div class="sub">질문지를 불러오는 중입니다…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
// 학부모 질문지는 로그인하지 않는다 — 로그인 기록을 남기지 않음
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});
const $ = id => document.getElementById(id);
const CENTER_TEL = '042-488-6011';
const AREAS = ['사회정서', '언어', '인지', '운동'];
const AREA_NAME = { '사회정서':'사회 · 정서', '언어':'언어 · 의사소통', '인지':'인지', '운동':'운동' };
const CHANNELS = ['네이버 검색 · 블로그', '인스타그램', '지인 소개', '병원 · 기관 소개', '어린이집 · 유치원', '기타'];

function esc(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dayKo(s) {
  const p = String(s || '').split('-'); return p.length === 3 ? Number(p[1]) + '월 ' + Number(p[2]) + '일' : '';
}

const KEY = new URLSearchParams(location.search).get('k') || '';
const DRAFT = 'nl_intake_draft_' + KEY;
let F = null, ANS = {}, SENDING = false, SENT = false;

// 적던 것은 이 기기에만 잠깐 남겨 둔다 (창이 닫혀도 다시 이어 쓰게)
function saveDraft() {
  try {
    localStorage.setItem(DRAFT, JSON.stringify({
      a: ANS, ch: chVal(), etc: $('etc') ? $('etc').value : '', chief: $('chief') ? $('chief').value : ''
    }));
  } catch (e) {}
}
function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT) || 'null'); } catch (e) { return null; } }
function dropDraft() { try { localStorage.removeItem(DRAFT); } catch (e) {} }

function chVal() {
  const r = document.querySelector('input[name=ch]:checked');
  return r ? r.value : '';
}

function stop(title, body) {
  $('app').innerHTML = '<div class="box done"><div class="big">📋</div><h1>' + esc(title) + '</h1>'
    + '<div class="sub">' + body + '</div></div>';
}

function draw() {
  const items = F.items || [];
  let html = '<div class="box"><h1>' + esc(F.kid || '') + ' 초기 상담 질문지</h1>'
    + '<div class="sub">' + esc(F.form || '') + '<br>'
    + '아이에 대해 아시는 만큼 편하게 적어 주세요. 잘 모르거나 기억나지 않는 문항은 넘어가셔도 됩니다.<br>'
    + '<b>' + esc(dayKo(F.until)) + '까지</b> 적어 주시고, 마지막에 「제출」을 꼭 눌러 주세요.</div></div>';

  // 1. 유입경로
  html += '<div class="box"><div class="sec">1. 자라는나무를 어떻게 알게 되셨나요?</div><div class="rad">'
    + CHANNELS.map(c => '<label><input type="radio" name="ch" value="' + esc(c) + '"> ' + esc(c) + '</label>').join('')
    + '</div><input type="text" id="etc" maxlength="80" placeholder="어떻게 알게 되셨는지 적어 주세요"></div>';

  // 2. 주 호소문제
  html += '<div class="box"><div class="sec">2. 아이에 대해 가장 걱정되시는 점</div>'
    + '<textarea id="chief" maxlength="2000" placeholder="예: 말이 늦어요, 또래와 어울리기 어려워요"></textarea></div>';

  // 3. 영역 문항
  let no = 0;
  AREAS.forEach(a => {
    const qs = items.filter(x => x.area === a && x.kind === '3단계');
    if (!qs.length) return;
    html += '<div class="box"><div class="sec">' + esc(AREA_NAME[a] || a) + '</div>';
    qs.forEach(x => {
      no++;
      html += '<div class="q"><div class="qt"><span class="qn">' + no + '.</span>' + esc(x.q) + '</div>'
        + '<div class="ch" data-q="' + x.id + '">'
        + ['가능', '부분', '어려움'].map(c => '<button type="button" data-c="' + c + '">'
             + c + '</button>').join('')
        + '</div></div>';
    });
    html += '</div>';
  });

  // 4. 글 문항
  const txt = items.filter(x => x.kind === '글');
  if (txt.length) {
    html += '<div class="box"><div class="sec">더 알려 주실 내용</div>';
    txt.forEach(x => {
      html += '<div class="q"><div class="qt">' + esc(x.q) + '</div>'
        + '<textarea data-t="' + x.id + '" maxlength="2000"></textarea></div>';
    });
    html += '</div>';
  }

  html += '<div class="box"><button class="send" id="send">제출</button>'
    + '<div class="hint">제출한 뒤에는 고칠 수 없습니다. 고칠 내용이 있으면 센터(' + CENTER_TEL + ')로 말씀해 주세요.</div>'
    + '<div id="msg" class="msg"></div></div>';
  $('app').innerHTML = html;

  // 이어 쓰기
  const d = loadDraft();
  if (d) {
    ANS = d.a || {};
    if (d.ch) { const r = document.querySelector('input[name=ch][value="' + CSS.escape(d.ch) + '"]'); if (r) r.checked = true; }
    $('etc').value = d.etc || ''; $('chief').value = d.chief || '';
  }
  paint();

  document.querySelectorAll('.ch button').forEach(b => {
    b.onclick = () => {
      const q = b.parentNode.dataset.q, c = b.dataset.c;
      const cur = (ANS[q] || {}).c;
      ANS[q] = Object.assign({}, ANS[q], { c: cur === c ? '' : c });   // 한 번 더 누르면 풀림
      paint(); saveDraft();
    };
  });
  document.querySelectorAll('textarea[data-t]').forEach(t => {
    t.value = (ANS[t.dataset.t] || {}).t || '';
    t.oninput = () => { ANS[t.dataset.t] = Object.assign({}, ANS[t.dataset.t], { t: t.value }); saveDraft(); };
  });
  document.querySelectorAll('input[name=ch]').forEach(r => r.onchange = () => { paint(); saveDraft(); });
  $('etc').oninput = saveDraft; $('chief').oninput = saveDraft;
  $('send').onclick = send;
}

function paint() {
  document.querySelectorAll('.ch').forEach(g => {
    const c = (ANS[g.dataset.q] || {}).c;
    g.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.c === c));
  });
  document.querySelectorAll('.rad label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
  $('etc').style.display = chVal() === '기타' ? 'block' : 'none';
}

async function send() {
  if (SENDING) return;
  const ch = chVal();
  const channel = ch === '기타' ? ('기타' + ($('etc').value.trim() ? ' · ' + $('etc').value.trim() : '')) : ch;
  const items = (F.items || []).filter(x => x.kind === '3단계');
  const left = items.filter(x => !(ANS[x.id] || {}).c).length;
  if (left > 0 && !confirm('고르지 않은 문항이 ' + left + '개 있습니다.\n그대로 제출할까요?')) return;
  if (left === 0 && !confirm('제출할까요? 제출한 뒤에는 고칠 수 없습니다.')) return;

  const answers = [];
  (F.items || []).forEach(x => {
    const a = ANS[x.id] || {};
    const c = x.kind === '3단계' ? (a.c || '') : '';
    const t = x.kind === '글' ? String(a.t || '').trim() : '';
    if (c || t) answers.push({ id: x.id, c: c, t: t });
  });

  SENDING = true; $('send').disabled = true; $('send').textContent = '제출하는 중…';
  try {
    const { data, error } = await sb.rpc('nl_intake_submit', {
      p_key: KEY, p_data: { channel: channel, chief: $('chief').value.trim(), answers: answers }
    });
    if (error) throw error;
    if (!data || !data.ok) throw new Error((data && data.msg) || '제출하지 못했습니다.');
    SENT = true; dropDraft();
    stop('제출되었습니다', '적어 주셔서 감사합니다.<br>상담 때 꼼꼼히 살펴보겠습니다.<br><br>자라는나무 ' + CENTER_TEL);
  } catch (e) {
    $('msg').className = 'msg err';
    $('msg').textContent = '제출하지 못했습니다. 잠시 뒤 다시 눌러 주세요.\n(' + e.message + ')';
    $('send').disabled = false; $('send').textContent = '제출';
  } finally {
    SENDING = false;
  }
}

window.addEventListener('beforeunload', e => {
  if (SENT || !F) return;
  const any = Object.keys(ANS).some(k => (ANS[k].c || String(ANS[k].t || '').trim()))
    || ($('chief') && $('chief').value.trim());
  if (!any) return;
  e.preventDefault(); e.returnValue = '';
});

(async () => {
  if (!/^[0-9a-f-]{36}$/i.test(KEY)) {
    stop('링크가 맞지 않습니다', '받으신 문자의 링크를 다시 눌러 주세요.<br>문의 ' + CENTER_TEL); return;
  }
  try {
    const { data, error } = await sb.rpc('nl_intake_open', { p_key: KEY });
    if (error) throw error;
    const st = data && data.state;
    if (st === '제출함') { dropDraft(); stop('이미 제출하셨습니다', '적어 주셔서 감사합니다.<br>문의 ' + CENTER_TEL); return; }
    if (st === '기한지남') { dropDraft(); stop('기한이 지난 링크입니다', '센터로 연락해 주시면 새 링크를 보내 드리겠습니다.<br>' + CENTER_TEL); return; }
    if (st !== '열림') { dropDraft(); stop('링크가 맞지 않습니다', '받으신 문자의 링크를 다시 눌러 주세요.<br>문의 ' + CENTER_TEL); return; }
    F = data; draw();
  } catch (e) {
    stop('질문지를 불러오지 못했습니다', '잠시 뒤 다시 열어 주세요.<br>문의 ' + CENTER_TEL);
  }
})();
</script>
</body>
</html>
