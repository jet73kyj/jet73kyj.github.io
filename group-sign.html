<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그룹 수업 신청서 - 나무링크</title>
<!-- 그룹 수업 신청서 · 아이패드 서명 (2026-10-11 은정님)
     서식 화면 「신청서(학생용)」에서 엶 · 표 nl_group_signs (받으면 잠김 · 사진 동의 철회만 됨)
     받으면 서버 장치가 nl_therapies.group_signed_on 을 그날로 적음 -->
<style>
  :root{ --bg:#F5F4F2; --sf:#FFFFFF; --line:#ECE8E3; --tx:#2F2926; --dim:#A39C95;
         --cam:#B07A4A; --camL:#F8F1E8; --camB:#C9A27E; --camBg:#FBF5EE; }
  body { font-family:'Malgun Gothic','맑은 고딕',sans-serif; background:var(--bg); margin:0; color:var(--tx); }
  header { background:var(--sf); border-bottom:1px solid var(--line); padding:10px 16px;
           display:flex; align-items:center; gap:10px; }
  header img.lg { height:22px; display:block; }
  header .bar0 { width:1px; height:16px; background:var(--line); }
  .container { max-width:900px; margin:0 auto; padding:16px; }
  .sub { font-size:13px; color:var(--dim); margin:0 0 14px; line-height:1.6; }
  .out { margin-top:12px; padding:12px 14px; border-radius:8px; font-size:14px; line-height:1.6; display:none; white-space:pre-wrap; }
  .ok  { background:var(--sf); border-left:3px solid #5E9A6E; display:block; }
  .err { background:var(--sf); border-left:3px solid #D8684A; color:#993C1D; display:block; }
  button { border:1px solid var(--line); border-radius:8px; padding:7px 16px; font-size:14px; font-weight:500;
           cursor:pointer; background:var(--sf); color:var(--tx); font-family:inherit; }
  button:hover { background:var(--camL); }
  button:disabled { background:#f2f1ee; color:var(--dim); cursor:default; }
  .btn-main { background:var(--cam); border-color:var(--cam); color:#fff; font-weight:700; }
  .btn-main:hover { background:#9C6B3F; }
  input[type=text], select { padding:9px 10px; border:1px solid #DDD3C7; border-radius:8px; font-size:16px;
           font-family:inherit; background:#fff; color:var(--tx); }

  /* 목록 */
  .grp { background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .grp-h { background:var(--camL); border-bottom:1px solid var(--camB); padding:9px 14px; font-size:14px; color:#7E5530; font-weight:600; }
  .grp-h span { font-weight:400; color:#9a8b7c; font-size:12.5px; margin-left:6px; }
  .kid { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid #F3EFE9; font-size:15px; flex-wrap:wrap; }
  .kid:last-child { border-bottom:none; }
  .kid .nm { flex:1; min-width:180px; }
  .kid .bd { color:var(--dim); font-size:13px; margin-left:4px; }
  .kid .done { color:#3B6D11; font-size:13px; }
  .empty { padding:40px; text-align:center; color:var(--dim); }

  /* 신청서 */
  .sheet { background:#fff; border:1px solid #ddd; border-radius:12px; padding:26px 30px; max-width:820px; margin:0 auto 20px;
           font-size:16px; line-height:1.75; }
  .sheet h2 { text-align:center; font-size:22px; margin:0 0 4px; letter-spacing:1px; }
  .sheet .org { text-align:center; font-size:13px; color:#8a7a6a; margin-bottom:18px; }
  .sheet h3 { font-size:16.5px; margin:20px 0 8px; padding-bottom:4px; border-bottom:1.5px solid #333; }
  .sheet .info { display:grid; grid-template-columns:110px 1fr; gap:4px 12px; }
  .sheet .info .k { color:#6E6660; }
  .sheet ol.rule { margin:0; padding-left:0; list-style:none; }
  .sheet ol.rule li { margin:0 0 8px; padding-left:26px; text-indent:-26px; }
  .sheet .dl div { margin:2px 0; }
  .agree { display:flex; align-items:center; gap:10px; margin:10px 0 2px; padding:10px 12px; border:1.5px solid #E2D4C2;
           border-radius:10px; background:var(--camBg); cursor:pointer; user-select:none; font-weight:600; }
  .agree input { width:24px; height:24px; accent-color:#B07A4A; }
  .need { color:#C2553A; font-size:13px; font-weight:400; }
  .pick { display:inline-flex; gap:8px; flex-wrap:wrap; }
  .pick label { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border:1.5px solid #E2D4C2;
                border-radius:999px; cursor:pointer; user-select:none; background:#fff; font-size:15.5px; }
  .pick input { width:20px; height:20px; accent-color:#B07A4A; margin:0; }
  .pick label.on { border-color:#B07A4A; background:var(--camL); }
  .prow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:8px 0; }
  .prow .pl { min-width:230px; }
  .note { font-size:14px; color:#6E6660; }
  .who { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .pad { border:2px dashed #C9B8A3; border-radius:10px; background:#fffdf9; position:relative; touch-action:none; height:180px; }
  .pad canvas { width:100%; height:100%; display:block; touch-action:none; }
  .pad .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#C9B8A3; pointer-events:none; font-size:16px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0 0; }
  .signimg { max-width:320px; max-height:120px; display:block; border-bottom:1px solid #333; }
  .bad { outline:2px solid #D8684A; outline-offset:3px; border-radius:10px; }
  .tool { display:flex; gap:8px; align-items:center; flex-wrap:wrap; max-width:820px; margin:0 auto 12px; }
  .tool .sp { flex:1; }
  .off { color:#993C1D; font-size:13px; }
  /* 보호자가 아이패드를 든 동안 — 위 띠 · 메뉴 숨김 (다른 화면으로 못 가게) */
  body.signing header, body.signing #nlMenuBtn, body.signing #nlMenuPanel, body.signing #nlReload { display:none !important; }
  .staffonly { font-size:12px; color:#A39C95; }
  @media (max-width:640px){ .sheet { padding:18px 16px; } .sheet .info { grid-template-columns:90px 1fr; } }
  @media print {
    @page { size:A4 portrait; margin:12mm; }
    body { background:#fff; }
    header, .tool, .no-print, #listBox, #msg { display:none !important; }
    .container { padding:0; max-width:none; }
    .sheet { border:none; border-radius:0; padding:0; max-width:none; font-size:12.5px; line-height:1.6; }
    .sheet h2 { font-size:18px; } .sheet h3 { font-size:13px; margin:12px 0 5px; }
    .agree { padding:4px 8px; margin:6px 0 0; }
    .pick label { padding:2px 8px; font-size:12px; }
    body { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

<div id="mainBox" style="display:none;">
<header>
  <img src="img/nl-logo.png" alt="" class="lg" onerror="this.style.display='none'">
  <span class="bar0"></span>
  <h1 style="margin:0;font-size:15px;font-weight:600;">그룹 수업 신청서</h1>
  <span style="margin-left:auto;font-size:12px;color:#A39C95;" id="who"></span>
  <a href="forms.html" style="background:#fff;color:#B07A4A;text-decoration:none;border:1px solid #ECE8E3;border-radius:8px;padding:5px 12px;font-size:13px;">서식</a>
  <a href="index.html" style="background:#fff;color:#B07A4A;text-decoration:none;border:1px solid #ECE8E3;border-radius:8px;padding:5px 12px;font-size:13px;">처음으로</a>
</header>

<div class="container">
  <div id="listBox">
    <div class="sub">그룹반에 든 아동입니다. 「신청서 받기」를 누르고 아이패드를 보호자께 드리면, 보호자가 읽고 체크 · 서명한 뒤 「제출」합니다.<br>
      제출한 신청서는 고칠 수 없습니다 (사진 · 동영상 동의 철회만 됩니다).</div>
    <div id="list"></div>
  </div>
  <div id="formBox" style="display:none;">
    <div class="tool no-print">
      <button type="button" id="backBtn">← 목록으로</button><span class="staffonly" id="staffNote">직원이 누르는 단추입니다</span>
      <span class="sp"></span>
      <button type="button" id="printBtn" style="display:none;">인쇄 · PDF</button>
    </div>
    <div id="sheet"></div>
  </div>
  <div id="msg" class="out"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nl-login.js"></script>
<script>
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: { storage: nlStore, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function show(t, ok, noScroll) { const el = $('msg'); el.textContent = t; el.className = 'out ' + (ok ? 'ok' : 'err');
  if (t && !noScroll) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function hideMsg() { $('msg').className = 'out'; $('msg').textContent = ''; }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function korDate(iso) { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[1] + '년 ' + Number(m[2]) + '월 ' + Number(m[3]) + '일' : ''; }
function dotDate(iso) { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[1] + '. ' + Number(m[2]) + '. ' + Number(m[3]) + '.' : ''; }
function b6(iso) { const m = String(iso || '').match(/^\d{2}(\d{2})-(\d{2})-(\d{2})/); return m ? m[1] + m[2] + m[3] : ''; }
function kstDay(ts) { const d = new Date(ts); const k = new Date(d.getTime() + 9 * 3600 * 1000); return k.toISOString().slice(0, 10); }
function hm12(t) { const m = String(t || '').match(/^(\d{1,2}):(\d{2})/); if (!m) return '';
  let h = Number(m[1]); const ap = h < 12 ? '오전' : '오후'; if (h > 12) h -= 12; if (h === 0) h = 12; return ap + ' ' + h + ':' + m[2]; }
function won(n) { return Number(n || 0).toLocaleString() + '원'; }

// ===== 신청서 글 (2026-10-11 은정님 확정) — 글을 바꾸면 FORM_VER 도 바꿀 것 =====
const FORM_VER = '2026-10-11';
const RULES = [
  '① 그룹 수업은 2명 이상 모이면 시작합니다. 인원이 줄어 1명이 되면 수업이 잠시 멈출 수 있으며, 이때는 미리 안내해 드립니다.',
  '② 수업료는 매달 그 달 수업 횟수만큼 교육비 확정 뒤 납부합니다.',
  '③ 결석 예정일을 교육비 확정 전에 알려 주시면 그 회차는 교육비에서 뺍니다. 수업이 시작된 뒤 개인 사정으로 결석하시면 보강과 환불이 없습니다.',
  '④ 1:1 개별 보강을 원하시면 차액 4,000원을 더 내고 받으실 수 있습니다. 보강은 결석한 달의 다음 달 말까지 진행하며, 보강 일정에 불참하신 경우 추가 보강은 없습니다.',
  '⑤ 센터나 선생님 사정으로 수업을 하지 못하면 보강을 안내해 드리고, 보강이 어려우면 그 회차 수업료를 돌려드립니다.',
  '⑥ 구성원이 바뀌면 요일 · 시간이 조정될 수 있으며 미리 안내해 드립니다. 수업을 그만두실 때는 다음 달 교육비 확정 전에 알려 주세요.'
];
const PRIVACY = [
  '수집 항목 — 아동 이름 · 생년월일, 보호자 이름 · 관계 · 서명',
  '이용 목적 — 그룹 수업 운영, 수업 안내 연락, 교육비 처리',
  '보유 기간 — 수업 종료 후 3년',
  '동의하지 않으시면 그룹 수업을 신청하실 수 없습니다.'
];
const PHOTO = [
  '수업 시간에 아이들이 만든 작업물과 활동 모습을 사진 · 동영상으로 남깁니다.',
  '아이의 얼굴은 찍지 않으며, 이름도 함께 적지 않습니다.'
];
const PHOTO_NOTE = [
  '보유 기간 — 수업 종료 후 3년',
  '동의하지 않아도 수업은 그대로 신청할 수 있습니다.',
  '동의한 뒤에도 언제든 센터에 말씀하시면 철회할 수 있으며, 그때부터 쓰지 않습니다.'
];
const RELS = ['모', '부', '조모', '조부', '기타'];

let ME = null, KIDS = {}, GROUPS = [], MEMS = [], SIGNS = [], THN = {}, TTN = {}, STN = {}, FEES = [];
let CUR = null, DIRTY = false, SAVING = false, PAD = null;

async function loadAll() {
  const [c, t, g, s, th, tt, st, f] = await Promise.all([
    sb.from('nl_children').select('id, name, birth, status'),
    sb.from('nl_therapies').select('id, child_id, group_id, support_type_id, therapy_type_id, ended_on, group_signed_on').not('group_id', 'is', null),
    sb.from('nl_groups').select('id, name, therapist_id, weekday, start_time, duration, capacity, fee, state').order('weekday').order('start_time'),
    sb.from('nl_group_signs').select('id, therapy_id, child_id, group_id, class_kind, guardian_name, guardian_rel, signed_at, photo_record, photo_promo, photo_record_off_at, photo_promo_off_at').order('signed_at', { ascending: false }),
    sb.from('nl_therapists').select('id, name'),
    sb.from('nl_therapy_types').select('id, name'),
    sb.from('nl_support_types').select('id, name'),
    sb.from('nl_therapist_fees').select('therapist_id, from_month, fee_40, fee_50, fee_60').order('from_month')
  ]);
  const bad = [c, t, g, s, th, tt, st, f].find(r => r.error);
  if (bad) { show('자료를 읽지 못했습니다 — ' + bad.error.message, false); return false; }
  KIDS = {}; (c.data || []).forEach(k => { KIDS[k.id] = k; });
  MEMS = t.data || []; GROUPS = g.data || []; SIGNS = s.data || []; FEES = f.data || [];
  THN = {}; (th.data || []).forEach(x => { THN[x.id] = x.name; });
  TTN = {}; (tt.data || []).forEach(x => { TTN[x.id] = x.name; });
  STN = {}; (st.data || []).forEach(x => { STN[x.id] = x.name; });
  return true;
}
function alive(t) { return !t.ended_on || String(t.ended_on) >= today(); }
function signOf(tid) { return SIGNS.find(s => Number(s.therapy_id) === Number(tid)); }
function fee1on1(thId, dur) {
  const ym = today().slice(0, 7);
  const rows = FEES.filter(r => Number(r.therapist_id) === Number(thId) && String(r.from_month || '') <= ym);
  const r = rows[rows.length - 1]; if (!r) return 0;
  return Number(dur === 60 ? r.fee_60 : dur === 50 ? r.fee_50 : r.fee_40) || 0;
}

function drawList() {
  const gs = GROUPS.filter(g => g.state !== '종결');
  if (!gs.length) { $('list').innerHTML = '<div class="empty">진행 · 대기 중인 그룹반이 없습니다.</div>'; return; }
  $('list').innerHTML = gs.map(g => {
    const mem = MEMS.filter(t => Number(t.group_id) === Number(g.id) && alive(t));
    mem.sort((a, b) => (signOf(a.id) ? 1 : 0) - (signOf(b.id) ? 1 : 0) || a.child_id - b.child_id);
    let h = '<div class="grp"><div class="grp-h">' + esc(g.name) + '<span>' + esc(g.weekday) + ' ' + hm12(g.start_time)
      + ' · ' + g.duration + '분 · ' + esc(THN[g.therapist_id] || '') + ' 선생님 · ' + esc(g.state) + ' ' + mem.length + '/' + g.capacity + '</span></div>';
    if (!mem.length) h += '<div class="kid" style="color:#A39C95;">아직 아동이 없습니다.</div>';
    h += mem.map(t => {
      const k = KIDS[t.child_id] || {}; const s = signOf(t.id);
      return '<div class="kid"><span class="nm">' + t.child_id + '번 ' + esc(k.name || '') + '<span class="bd">' + b6(k.birth) + '</span>'
        + ' <span class="bd">· ' + esc(STN[t.support_type_id] || '') + '</span></span>'
        + (s ? '<span class="done">✓ ' + dotDate(kstDay(s.signed_at)) + ' 받음</span> <button type="button" data-view="' + s.id + '">보기</button>'
             : '<button type="button" class="btn-main" data-take="' + t.id + '">신청서 받기</button>')
        + '</div>';
    }).join('');
    return h + '</div>';
  }).join('');
  $('list').querySelectorAll('[data-take]').forEach(b => b.onclick = () => openTake(Number(b.dataset.take)));
  $('list').querySelectorAll('[data-view]').forEach(b => b.onclick = () => openView(Number(b.dataset.view)));
}

function buildSnap(t) {
  const g = GROUPS.find(x => Number(x.id) === Number(t.group_id)) || {};
  const k = KIDS[t.child_id] || {};
  return {
    child_no: t.child_id, child_name: k.name || '', birth: k.birth || '',
    group_name: g.name || '', weekday: g.weekday || '', start_time: String(g.start_time || '').slice(0, 5),
    duration: g.duration || 40, therapy_type: TTN[t.therapy_type_id] || '', support_type: STN[t.support_type_id] || '',
    therapist: THN[g.therapist_id] || '', fee: Number(g.fee) || 0, fee_1on1: fee1on1(g.therapist_id, Number(g.duration)),
    capacity: g.capacity || 0, rules: RULES, privacy: PRIVACY, photo: PHOTO, photo_note: PHOTO_NOTE
  };
}

// 신청서 그리기 — mode 'take'(받기) / 'view'(받은 것 보기)
function sheetHtml(sn, mode, s) {
  const take = mode === 'take';
  const pickK = take
    ? '<span class="pick" id="pkKind"><label><input type="radio" name="kind" value="유치부"> 유치부 (5~7세)</label><label><input type="radio" name="kind" value="초등부"> 초등부</label></span>'
    : '<span>' + (s.class_kind === '유치부' ? '☑ 유치부 (5~7세) &nbsp; ☐ 초등부' : '☐ 유치부 (5~7세) &nbsp; ☑ 초등부') + '</span>';
  const yn = (nm, v, offAt) => take
    ? '<span class="pick" id="pk_' + nm + '"><label><input type="radio" name="' + nm + '" value="1"> 동의합니다</label><label><input type="radio" name="' + nm + '" value="0"> 동의하지 않습니다</label></span>'
    : '<span>' + (v ? '☑ 동의합니다 &nbsp; ☐ 동의하지 않습니다' : '☐ 동의합니다 &nbsp; ☑ 동의하지 않습니다')
      + (offAt ? ' <span class="off">· ' + dotDate(kstDay(offAt)) + ' 철회</span>' : '') + '</span>';
  const chk = (id, label) => take
    ? '<label class="agree" id="ag_' + id + '"><input type="checkbox" id="' + id + '"> ' + label + ' <span class="need">(반드시)</span></label>'
    : '<div class="agree" style="cursor:default;">☑ ' + label + '</div>';
  let h = '<div class="sheet">'
    + '<h2>4:1 그룹 수업 신청서</h2><div class="org">자라는나무 아동발달센터</div>'
    + '<h3>1. 신청 아동</h3><div class="info">'
    + '<span class="k">아동 이름</span><span>' + esc(sn.child_name) + '</span>'
    + '<span class="k">생년월일</span><span>' + esc(dotDate(sn.birth)) + '</span></div>'
    + '<h3>2. 수업 정보</h3><div class="info">'
    + '<span class="k">수업명</span>' + pickK
    + '<span class="k">요일 · 시간</span><span>' + esc(sn.weekday) + ' ' + esc(hm12(sn.start_time)) + ' (' + sn.duration + '분)</span>'
    + '<span class="k">치료 영역</span><span>' + esc(sn.therapy_type) + ' · 담당 ' + esc(sn.therapist) + ' 선생님</span>'
    + '<span class="k">수업료</span><span>1회 ' + won(sn.fee) + (sn.fee_1on1 ? ' <span class="note">(1:1 개별 수업은 1회 ' + won(sn.fee_1on1) + ')</span>' : '') + '</span>'
    + '<span class="k">반 정원</span><span>' + sn.capacity + '명</span></div>'
    + '<h3>3. 운영 규정</h3><ol class="rule">' + (sn.rules || []).map(r => '<li>' + esc(r) + '</li>').join('') + '</ol>'
    + chk('cRules', '운영 규정을 읽고 이해했습니다')
    + '<h3>4. 개인정보 수집 · 이용 동의</h3><div class="dl">' + (sn.privacy || []).map(r => '<div>· ' + esc(r) + '</div>').join('') + '</div>'
    + chk('cPriv', '개인정보 수집 · 이용에 동의합니다')
    + '<h3>5. 사진 · 동영상 촬영 및 이용 동의 <span class="note">(선택)</span></h3>'
    + '<div class="dl">' + (sn.photo || []).map(r => '<div>' + esc(r) + '</div>').join('') + '</div>'
    + '<div class="prow"><span class="pl">가. 수업 기록 · 보호자 공유용</span>' + yn('pRec', s && s.photo_record, s && s.photo_record_off_at) + '</div>'
    + '<div class="prow"><span class="pl">나. 센터 홍보용 (블로그 · 인스타그램)</span>' + yn('pPro', s && s.photo_promo, s && s.photo_promo_off_at) + '</div>'
    + '<div class="dl note">' + (sn.photo_note || []).map(r => '<div>· ' + esc(r) + '</div>').join('') + '</div>'
    + '<h3>6. 확인 및 서명</h3><div>위 내용을 확인하고 그룹 수업을 신청합니다.</div>'
    + '<div class="info" style="margin-top:8px;"><span class="k">신청일</span><span>' + korDate(take ? today() : kstDay(s.signed_at)) + '</span></div>';
  if (take) {
    h += '<div class="who"><input type="text" id="gName" maxlength="20" placeholder="보호자 이름" style="width:180px;">'
      + '<select id="gRel"><option value="">관계 고르기</option>' + RELS.map(r => '<option>' + r + '</option>').join('') + '</select></div>'
      + '<div class="pad" id="pad"><canvas id="cv"></canvas><div class="ph" id="ph">여기에 손가락으로 서명해 주세요</div></div>'
      + '<div class="bar no-print"><button type="button" id="padClr">다시 쓰기</button><span style="flex:1"></span>'
      + '<button type="button" class="btn-main" id="submitBtn" style="font-size:17px;padding:10px 28px;">제출</button></div>'
      + '<div class="note no-print" style="text-align:right;margin-top:6px;">제출하면 고칠 수 없게 잠깁니다.</div>';
  } else {
    h += '<div class="info"><span class="k">보호자</span><span>' + esc(s.guardian_name) + ' (' + esc(s.guardian_rel) + ')</span>'
      + '<span class="k">서명</span><span><img class="signimg" id="signImg" alt="서명"></span></div>';
    if (CAN_EDIT() && ((s.photo_record && !s.photo_record_off_at) || (s.photo_promo && !s.photo_promo_off_at))) {
      h += '<div class="bar no-print"><span class="note">보호자가 사진 · 동영상 동의를 철회하시면 눌러 주세요 →</span>'
        + (s.photo_record && !s.photo_record_off_at ? '<button type="button" data-off="photo_record_off_at">가. 철회</button>' : '')
        + (s.photo_promo && !s.photo_promo_off_at ? '<button type="button" data-off="photo_promo_off_at">나. 철회</button>' : '')
        + '</div>';
    }
  }
  return h + '</div>';
}
function CAN_EDIT() { return ME && [8, 19, 11].includes(Number(ME.id)); }

function openTake(tid) {
  const t = MEMS.find(x => Number(x.id) === tid); if (!t) return;
  if (signOf(tid)) { show('이미 받은 신청서가 있습니다.', false); return; }
  CUR = { mode: 'take', t, snap: buildSnap(t) };
  hideMsg(); DIRTY = false;
  $('listBox').style.display = 'none'; $('formBox').style.display = '';
  $('printBtn').style.display = 'none';
  document.body.classList.add('signing');
  $('sheet').innerHTML = sheetHtml(CUR.snap, 'take', null);
  bindTake();
  window.scrollTo(0, 0);
}
async function openView(sid) {
  hideMsg();
  const r = await sb.from('nl_group_signs').select('*').eq('id', sid).maybeSingle();
  if (r.error || !r.data) { show('신청서를 읽지 못했습니다' + (r.error ? ' — ' + r.error.message : ''), false); return; }
  CUR = { mode: 'view', s: r.data };
  $('listBox').style.display = 'none'; $('formBox').style.display = '';
  $('printBtn').style.display = '';
  $('sheet').innerHTML = sheetHtml(r.data.snap || {}, 'view', r.data);
  $('signImg').src = r.data.sign_png;
  $('sheet').querySelectorAll('[data-off]').forEach(b => b.onclick = () => photoOff(r.data, b.dataset.off, b));
  window.scrollTo(0, 0);
}
async function photoOff(s, col, btn) {
  const lab = col === 'photo_record_off_at' ? '가. 수업 기록 · 보호자 공유용' : '나. 센터 홍보용';
  if (!confirm('「' + lab + '」 동의를 오늘 날짜로 철회합니다.\n철회하면 되돌릴 수 없습니다. 진행할까요?')) return;
  btn.disabled = true;
  const up = {}; up[col] = new Date().toISOString();
  const r = await sb.from('nl_group_signs').update(up).eq('id', s.id).select('id');
  if (r.error || !r.data || !r.data.length) { btn.disabled = false; show('철회하지 못했습니다' + (r.error ? ' — ' + r.error.message : ''), false); return; }
  await loadAll(); await openView(s.id); show('철회했습니다.', true);
}

function bindTake() {
  const sh = $('sheet');
  sh.querySelectorAll('.pick input').forEach(i => i.addEventListener('change', () => {
    const p = i.closest('.pick'); p.querySelectorAll('label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
    p.classList.remove('bad'); DIRTY = true;
  }));
  sh.querySelectorAll('.agree input').forEach(i => i.addEventListener('change', () => { i.closest('.agree').classList.remove('bad'); DIRTY = true; }));
  $('gName').addEventListener('input', () => { $('gName').classList.remove('bad'); DIRTY = true; });
  $('gRel').addEventListener('change', () => { $('gRel').classList.remove('bad'); DIRTY = true; });
  PAD = makePad($('cv'), () => { $('ph').style.display = 'none'; $('pad').classList.remove('bad'); DIRTY = true; });
  $('padClr').onclick = () => { PAD.clear(); $('ph').style.display = ''; };
  $('submitBtn').onclick = submit;
}

// 손가락 서명 칸
function makePad(cv, onDraw) {
  const ctx = cv.getContext('2d'); let drawing = false, used = false, last = null;
  function size() {
    const r = cv.getBoundingClientRect(); const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const old = used ? cv.toDataURL() : null;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    if (old) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = old; }
  }
  function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; last = pos(e);
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; e.preventDefault(); const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
    if (!used) { used = true; onDraw(); } });
  const end = () => { drawing = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
  let lastW = 0;
  function onResize() { if (!cv.isConnected) { window.removeEventListener('resize', onResize); return; }
    const w = Math.round(cv.getBoundingClientRect().width); if (w && w !== lastW) { lastW = w; size(); } }
  size(); lastW = Math.round(cv.getBoundingClientRect().width);
  window.addEventListener('resize', onResize);
  return {
    clear() { ctx.clearRect(0, 0, cv.width, cv.height); used = false; },
    used() { return used; },
    png() { return cv.toDataURL('image/png'); }
  };
}

async function submit() {
  if (SAVING) return;
  const sh = $('sheet'); const bad = [];
  const kind = sh.querySelector('input[name=kind]:checked');
  const rec = sh.querySelector('input[name=pRec]:checked');
  const pro = sh.querySelector('input[name=pPro]:checked');
  const nm = $('gName').value.trim(), rel = $('gRel').value;
  if (!kind) bad.push(['pkKind', '수업명(유치부 · 초등부)을 골라 주세요']);
  if (!$('cRules').checked) bad.push(['ag_cRules', '운영 규정 확인에 체크해 주세요']);
  if (!$('cPriv').checked) bad.push(['ag_cPriv', '개인정보 동의에 체크해 주세요']);
  if (!rec) bad.push(['pk_pRec', '사진 · 동영상 「가」를 골라 주세요 (동의하지 않아도 됩니다)']);
  if (!pro) bad.push(['pk_pPro', '사진 · 동영상 「나」를 골라 주세요 (동의하지 않아도 됩니다)']);
  if (!nm) bad.push(['gName', '보호자 이름을 적어 주세요']);
  if (!rel) bad.push(['gRel', '관계를 골라 주세요']);
  if (!PAD.used()) bad.push(['pad', '서명해 주세요']);
  sh.querySelectorAll('.bad').forEach(x => x.classList.remove('bad'));
  if (bad.length) {
    bad.forEach(b => { const el = $(b[0]); if (el) el.classList.add('bad'); });
    const first = $(bad[0][0]); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    show('아직 채우지 않은 곳이 있습니다\n· ' + bad.map(b => b[1]).join('\n· '), false, true);
    return;
  }
  const png = PAD.png();
  if (png.length >= 400000) { show('서명 그림이 너무 큽니다. 「다시 쓰기」 후 조금 작게 서명해 주세요.', false); return; }
  SAVING = true; $('submitBtn').disabled = true; $('submitBtn').textContent = '제출 중…'; hideMsg();
  const t = CUR.t;
  const row = { therapy_id: t.id, child_id: t.child_id, group_id: t.group_id, form_ver: FORM_VER, snap: CUR.snap,
    class_kind: kind.value, agree_rules: true, agree_privacy: true,
    photo_record: rec.value === '1', photo_promo: pro.value === '1',
    guardian_name: nm, guardian_rel: rel, sign_png: png };
  try {
    const r = await sb.from('nl_group_signs').insert(row).select('id');
    if (r.error) throw r.error;
    if (!r.data || !r.data.length) throw new Error('저장된 줄이 없습니다 (권한을 확인해 주세요)');
    DIRTY = false;
    await loadAll();
    await openView(r.data[0].id);
    show('신청서를 받았습니다. 아이패드를 돌려받아 주세요.', true);
  } catch (e) {
    const dup = e && (e.code === '23505' || /duplicate|uq_group_sign/i.test(e.message || ''));
    show(dup ? '이미 이 아동의 신청서를 받았습니다 (다른 곳에서 먼저 제출됨). 목록으로 돌아가 「보기」로 확인해 주세요.'
             : '제출하지 못했습니다 — ' + (e.message || e), false);
    $('submitBtn').disabled = false; $('submitBtn').textContent = '제출';
  } finally { SAVING = false; }
}

$('backBtn').onclick = () => {
  if (CUR && CUR.mode === 'take' && DIRTY && !confirm('적던 신청서가 저장되지 않았습니다. 목록으로 갈까요?')) return;
  DIRTY = false; CUR = null; hideMsg(); document.body.classList.remove('signing');
  $('formBox').style.display = 'none'; $('listBox').style.display = '';
  drawList(); window.scrollTo(0, 0);
};
$('printBtn').onclick = () => window.print();
window.addEventListener('beforeunload', e => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

async function afterLogin(user) {
  const { data: me, error } = await sb.from('nl_therapists').select('id, name, role')
    .eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (error || !me) { location.replace('index.html'); return; }
  nlKeep(me.id);
  ME = me;
  $('mainBox').style.display = '';
  $('who').textContent = me.name + ' (' + (me.role || '') + ')';
  if (!CAN_EDIT()) { $('list').innerHTML = '<div class="empty">이 화면은 관리자 · 행정 · 데스크만 씁니다.</div>'; return; }
  if (await loadAll()) drawList();
}
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) await afterLogin(data.session.user);
  else location.replace('index.html');
})();
</script>
