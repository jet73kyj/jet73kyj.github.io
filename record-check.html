<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기록지 점검 - 나무링크</title>
<style>
  :root{
    --bg:#F5F4F2; --sf:#FFFFFF; --line:#ECE8E3; --tx:#2F2926; --dim:#A39C95;
    --cam:#B07A4A; --camL:#F8F1E8; --camB:#C9A27E;
    --sage:#5E9A6E; --coral:#D8684A; --coralL:#FCEFEA; --coralT:#993C1D;
  }
  body { font-family:-apple-system,"Malgun Gothic",sans-serif; background:var(--bg);
         margin:0; padding:0; color:var(--tx); }
  .hd { background:var(--sf); border-bottom:1px solid var(--line);
        display:flex; align-items:center; gap:10px; flex-wrap:wrap;
        padding:10px 16px; }
  .hd img.lg { height:22px; display:block; }
  .hd .bar { width:1px; height:16px; background:var(--line); }
  .hd h1 { font-size:15px; font-weight:600; margin:0; color:var(--tx); }
  .hd .who { font-size:12px; color:var(--dim); }
  .hd .sp { flex:1 1 auto; }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  button { font:inherit; border-radius:8px; padding:6px 13px; font-size:13px;
           background:var(--sf); color:var(--tx); border:1px solid var(--dim);
           cursor:pointer; font-weight:500; }
  button:hover { background:var(--camL); }
  button.grey { border-color:var(--line); color:var(--cam); }
  button.grey:hover { background:var(--camL); }
  select { font:inherit; font-size:13px; padding:6px 9px; border-radius:8px;
           border:1px solid var(--line); background:var(--sf); color:var(--tx); }
  .card { background:var(--sf); border:1px solid var(--line); border-radius:12px;
          padding:18px 20px; margin-bottom:14px; }
  .ok { background:var(--sf); border-left:3px solid var(--sage);
        padding:22px; text-align:center; font-size:16px; font-weight:600;
        color:var(--tx); }
  .ok .sub { font-size:13px; font-weight:400; color:var(--dim); margin-top:7px; }
  .grp { margin-bottom:22px; border-left:3px solid var(--coral); padding-left:13px; }
  .grp:last-child { margin-bottom:0; }
  .grp-t { font-size:14px; font-weight:600; color:var(--tx); margin-bottom:3px; }
  .grp-n { display:inline-block; background:var(--coralL); color:var(--coralT);
           border-radius:10px; padding:1px 9px; font-size:12px;
           margin-left:6px; vertical-align:1px; font-weight:500; }
  /* 기록지 좌우 — 왼쪽 지난달 미작성 · 오른쪽 이번 달 진행 (2026-09-22) */
  .lgcols { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .lgR { border-left:1px solid #ECE8E3; padding-left:16px; }
  .lgband { margin:0 0 12px; padding:8px 12px; font-size:13px; }
  .lgrow { display:flex; justify-content:space-between; padding:6px 0;
           border-bottom:1px solid #ECE8E3; font-size:13.5px; }
  @media (max-width:700px) {
    .lgcols { grid-template-columns:1fr; }
    .lgR { border-left:none; padding-left:0; border-top:1px solid #ECE8E3; padding-top:12px; }
  }
  .grp-why { font-size:12.5px; color:var(--dim); margin-bottom:9px;
             line-height:1.6; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { background:var(--camL); color:#4A1B0C; text-align:left; font-weight:500;
       padding:6px 10px; border-bottom:1px solid var(--camB); white-space:nowrap; }
  td { padding:7px 10px; border-bottom:1px solid #F0EEEA; }
  tr:last-child td { border-bottom:none; }
  .cid { font-weight:500; color:var(--cam); white-space:nowrap; }
  .sum { font-size:13px; color:var(--dim); margin-bottom:14px; }
  .err { background:var(--sf); border-left:3px solid var(--coral);
         padding:14px 16px; color:var(--coralT); font-size:13.5px;
         white-space:pre-wrap; line-height:1.7; }
  .load { text-align:center; padding:34px; color:var(--dim); font-size:14px; }
  .note { font-size:12px; color:var(--dim); line-height:1.8; margin-top:16px; }

  /* 기록지 점검 (2026-10-02) */
  .wrap { max-width:1280px; }
  .tabs2 { display:flex; gap:14px; margin:0 0 12px; border-bottom:1px solid var(--line); }
  .tabs2 button { border:none; border-bottom:2px solid transparent; border-radius:0;
                  background:none; padding:6px 2px; color:var(--dim); }
  .tabs2 button.on { color:var(--tx); border-bottom-color:var(--cam); font-weight:600; }
  .thhd { font-size:15px; font-weight:600; margin:0 0 8px; padding-left:10px;
          border-left:3px solid var(--cam); }
  .thhd .n { font-size:12px; color:var(--dim); font-weight:400; margin-left:6px; }
  .it { display:inline-block; font-size:11px; font-weight:600; border-radius:10px;
        padding:2px 8px; white-space:normal; max-width:84px; line-height:1.35; }
  .g1 { background:#FDF3E6; color:#A9701C; }   /* 가 결제 */
  .g2 { background:#E6F0FA; color:#2E5E8C; }   /* 나 기록지 */
  .g3 { background:#F1ECFA; color:#5B3E96; }   /* 다 서류 */
  .g0 { background:#EEF1F4; color:#5A6B7B; }   /* 참고 */
  td.det { line-height:1.5; white-space:pre-wrap; min-width:460px; }   /* 내용 칸 넓게 (2026-10-22) */
  tr.done td { color:#B7B0A9; }
  tr.done td .it { opacity:.55; }
  .rc { display:flex; gap:6px; align-items:center; flex-wrap:wrap; min-width:150px; max-width:180px; }
  .rc .okline { flex-basis:100%; display:flex; gap:8px; align-items:center; margin:0; }
  .rc select { max-width:175px; font-size:12px; padding:4px 6px; }
  .rc input[type=text] { font:inherit; font-size:12px; padding:4px 7px; border:1px solid var(--line);
                         border-radius:6px; width:110px; }
  .rc label { font-size:12px; color:var(--tx); white-space:nowrap; }
  .rc button { padding:4px 10px; font-size:12px; }
  .rc button.saved { background:#EAF4EC; border-color:#9CC7A6; color:#2E6B3E; }
  .rcview { font-size:12px; color:var(--tx); }
  .rcst { font-size:12px; color:var(--tx); margin:0 0 4px; flex-basis:100%; }
  .rcst.dim { color:var(--dim); }
  .rcst.wait { color:#B4580E; font-weight:700; background:#FFF1E2; border-radius:5px; padding:2px 6px; display:inline-block; }
  .rcmemo { font-size:12px; color:#6D4C41; background:#FFF8E1; padding:3px 7px; border-radius:5px; margin-top:4px; }
  .rc input.rcMemo { width:100%; }
  .rcMsg { font-size:11px; color:var(--dim); }
  .ln { padding:5px 0; border-bottom:1px dashed #EEE7DF; line-height:1.6;
        display:grid; grid-template-columns:150px 1fr auto; column-gap:10px; align-items:start; }
  .ln .lntag { padding-top:1px; }
  .ln .lntx { min-width:0; }
  .ln:last-of-type { border-bottom:none; }
  .ln .lnd { font-weight:600; }
  .ln .it { white-space:nowrap; max-width:none !important; width:auto !important; display:inline-block; overflow:visible; margin-right:4px; }
  .ln .lnok { white-space:nowrap; }
  .ln .lnok button { padding:2px 10px; font-size:12px; border-radius:6px; cursor:pointer; }
  .ln .lnok .rcOk { background:#fff; color:#2E6B3E; border:1px solid #9CC7A6; font-weight:700; }
  .ln .lnok .rcUnok { background:#fff; color:var(--dim); border:1px solid var(--line); }
  .ln .rcst { display:block; margin:2px 0 0; }
  .ln .rcst.wait { display:inline-block; }
  .ln.lndone { color:#B7B0A9; }
  a.rcopen { display:inline-block; margin:2px 0 4px; font-size:12px; color:#0c447c; background:#e3f0fb; border:1px solid #85b7eb;
             border-radius:6px; padding:3px 9px; text-decoration:none; white-space:nowrap; }
  @media print { a.rcopen { display:none !important; } }
  .rcMsg.good { color:#2E6B3E; } .rcMsg.bad { color:var(--coralT); }
  .okline { margin:0 0 4px; }
  .okline button { padding:4px 14px; font-size:12px; border-radius:6px; cursor:pointer; }
  .okline .rcOk { background:#fff; color:#2E6B3E; border:1px solid #9CC7A6; font-weight:700; }
  .okline .rcUnok { background:#fff; color:var(--dim); border:1px solid var(--line); }
  .okdone { font-size:12px; color:#2E6B3E; font-weight:700; }
  .legend { font-size:12px; color:var(--dim); line-height:1.9; margin-top:14px; }
  /* 치료사별 한눈에 (2026-10-09) */
  .ovt tr.ovr { cursor:pointer; }
  .ovt tr.ovr:hover td { background:var(--camL); }
  .ovt tr.ovr.on td { background:#FBF5EE; font-weight:600; }
  #kindTabs { flex-wrap:wrap; align-items:center; }
  @media print {
    .hd button, .hd select, .tabs2, .rc button, .okline button, .legend, #thAll, .smsCopy, .smsMsg { display:none !important; }
    body { background:#fff; }
    .card { border:none; padding:0; }
    .rc select, .rc input { border:none; }
  }
</style>
</head>
<body>
<div class="hd">
  <img src="img/nl-logo.png" alt="" class="lg" onerror="this.style.display='none'">
  <span class="bar"></span>
  <h1>기록지 점검</h1>
  <span class="who" id="who"></span>
  <span class="sp"></span>
  <input id="kidQ" type="text" autocomplete="off" placeholder="아동 번호 · 이름"
         style="font:inherit;font-size:13px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);width:130px;">
  <select id="mon"></select>
  <button id="run">점검하기</button>
  <button id="pdf">PDF로 저장</button>
  <button id="home" class="grey">처음으로</button>
</div>

<div class="wrap">
  <div id="body"><div class="load">불러오는 중…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nl-login.js"></script>
<script>
// 기록지 점검 (2026-10-02 은정님 정함)
//   셈은 서버 nl_record_check(달) 한 곳 — 이 화면은 그리기만
//   처리 결과는 nl_rc_results (아동 · 달 · 항목 · 열쇠마다 한 줄) · 사례 목록은 nl_rc_cases
//   8 · 9번 — 전체를 보고 처리 결과를 적음 / 선생님 — 자기 담당 줄만 보기
const URL_ = 'https://mrezaqgfyvgdtukzkidb.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yZXphcWdmeXZnZHR1a3praWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjMxNjEsImV4cCI6MjA5NzI5OTE2MX0.xNWlRG9XajOg4cE6SgeVne8kFiO8ZiQCatJHRymT6nc';
const sb = window.supabase.createClient(URL_, KEY_, {
  auth: { storage: nlStore, persistSession: true,
          autoRefreshToken: true, detectSessionInUrl: false }
});
const $ = id => document.getElementById(id);

const ADMIN = [8, 19];
let ME = null, ROWS = [], CASES = [], RES = {}, KIDNM = {}, THNM = {}, VIEW = 'left';
// 갈래 · 보기 · 선생님 거르기 · 누적 통계 (2026-10-09)
let KINDV = '전체', GROUPV = 'th', THF = 0, STATS = null, LOGERR = '';
let DEVDOC = {};  // 아동 → 발달 기록지에서 끝낸 서식 [{type, key, data, done_on}] — 10호 서명 받음 · 27호 작성 끝 (2026-10-09)
let NOTES = {};   // 아동|날짜 → 발달 기록지 특이사항 글들 · 아동|* → 그 달 전부 (2026-10-02)

// 항목 이름 · 갈래 (g1 결제 · g2 기록지 · g3 서류 · g0 참고)
const ITEM = {
  1:['빠른 결제','g1'], 2:['중복결제','g1'], 3:['수업보다 결제가 많은 날','g1'],
  4:['중복결제','g1'], 5:['승인번호 이상','g1'], 6:['주 3회 이상','g1'],
  7:['수업 포기','g1'], 8:['결제금액 불일치','g1'], 9:['예외 · 일괄 (참고)','g0'],
  10:['시간 겹침','g2'], 11:['일정표 ↔ 승인일자','g2'], 12:['기록지 빈칸','g2'],
  13:['승인번호 다름','g2'], 14:['미작성','g2'],
  15:['변경계약서 · 본인부담금','g3'], 16:['변경계약서 · 담당 변경','g3'],
  18:['제공일자 ≠ 승인일자','g2'],   // 2026-10-02 · 결제일 우선
  // 치료지원 누가기록지 · 미작성 (2026-10-09) — 서버 nl_log_check · 고치면 저절로 사라짐
  31:['빠른 결제','g1'], 32:['그날 수업 없음','g1'], 33:['중복결제','g1'],
  34:['어느 수업 결제인지','g1'], 41:['미작성','g2'],
  24:['다른 날 결제','g1']   // 쪼개기로 채운 수업을 다른 날 결제 (2026-10-10)
  ,25:['발달재활 아닌 달의 발달 기록지','g2']   // 그 달 발달재활 수업 · 납부 없음 (2026-10-22)
};
const KINDS = ['발달재활', '치료지원', '센터'];

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function monNo(k){ return Number(String(k).slice(5,7)); }
function md(d){ return d ? Number(String(d).slice(5,7)) + '/' + Number(String(d).slice(8,10)) : ''; }
// 점검 글 속 번호를 이름으로 (2026-10-02 은정님) — 4번 다른 아동 · 10번 겹친 아동 · 16번 선생님
function rcIds(rows) {
  const kid = new Set(), th = new Set();
  (rows || []).forEach(r => {
    const d = String(r.detail || ''), n = Number(r.item_no);
    if (n === 4)  { const m = d.match(/(\d+)번 결제 뒤/); if (m) kid.add(Number(m[1])); }
    if (n === 10) { const m = d.match(/ 이 (\d+)번 /);    if (m) kid.add(Number(m[1])); }
    if (n === 16) { (d.match(/\d+(?:→\d+)*번/g) || []).forEach(x => x.replace('번', '').split('→').forEach(v => th.add(Number(v)))); }
  });
  return { kid: [...kid], th: [...th] };
}
function rcNamed(r, kidName, thName) {
  let d = String(r.detail || '');
  const n = Number(r.item_no);
  const kn = id => kidName(id) || (id + '번');
  if (n === 4)  d = d.replace(/(\d+)번 결제 뒤/, (m, id) => kn(Number(id)) + ' 결제 뒤');
  if (n === 10) d = d.replace(/ 이 (\d+)번 /, (m, id) => ' 이 ' + kn(Number(id)) + ' ');
  if (n === 16) d = d.replace(/(\d+(?:→\d+)*)번/g, (m, ids) =>
    ids.split('→').map(v => thName(Number(v)) || (v + '번')).join('→') + ' 선생님');
  return d;
}
function rkey(r){ return r.child_id + '|' + r.item_no + '|' + (r.item_key || ''); }
// 갈래 나(10~14 · 18) — 목록만. 선생님이 기록지를 고치면 저절로 사라짐 (2026-10-02)
function isList(r){ return (r.item_no >= 10 && r.item_no <= 14) || r.item_no === 18 || r.item_no >= 31; }
function isAdmin(){ return ME && ADMIN.indexOf(Number(ME.id)) >= 0; }
// 선생님께 보낼 문자 (2026-10-10 은정님) — 선생님이 고치면 사라지는 줄만 · 처리 끝 뺌 · 아동 번호 없이 이름만 · 기한 다음 달 15일
function smsRows(tid){
  return ROWS.filter(r => Number(r.therapist_id || 0) === tid && isList(r) && !isDone(r))
    .sort((x, y) => (KINDS.indexOf(x.kind) - KINDS.indexOf(y.kind)) || (x.item_no === 41) - (y.item_no === 41)
                    || String(KIDNM[x.child_id] || '').localeCompare(String(KIDNM[y.child_id] || ''))
                    || String(x.on_date || '').localeCompare(String(y.on_date || '')));
}
function smsText(tid){
  const k = $('mon').value, m = monNo(k), nm = m === 12 ? 1 : m + 1;
  const rs = smsRows(tid), g = {}, ord = [];
  rs.forEach(r => { const kk = r.item_no === 41 ? '미작성' : (r.kind || '기록지'); if (!g[kk]) { g[kk] = []; ord.push(kk); } g[kk].push(r); });
  let t = '[자라는나무] ' + (THNM[tid] || '') + ' 선생님, ' + m + '월 기록지 점검 안내입니다.\n';
  ord.forEach(kk => {
    t += '\n■ ' + kk + '\n';
    g[kk].forEach(r => {
      const it = (ITEM[r.item_no] || ['점검'])[0];
      const det = rcNamed(r, id => KIDNM[id] || '다른 아동', id => THNM[id] || '').replace(/\s+/g, ' ').trim()
        .replace(Number(r.item_no) === 10 ? /\d+번 /g : /$^/, '');   // 10번 겹침 글은 아동 번호를 뺌 (2026-10-22)   // 번호가 문자에 안 남게 (2026-10-10)
      t += '· ' + (KIDNM[r.child_id] || '아동') + (r.on_date ? ' ' + md(r.on_date) : '') + ' — '
         + (r.item_no === 41 ? (r.kind && det.indexOf(r.kind) < 0 ? r.kind + ' · ' : '') : it + (det ? ': ' : '')) + det + '\n';
    });
  });
  return t + '\n기한 ' + nm + '월 15일까지 고쳐 주세요.\n나무링크 → 기록지 점검에서 확인하실 수 있습니다.';
}
async function copyText(t){
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

// 달 고르기 — 지난 6달 ~ 이번 달 · 처음은 지난달 (기록지는 달이 끝난 뒤 씀)
function fillMon(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  let h = '';
  for (let i = -6; i <= 0; i++) {
    const d = new Date(y, m + i, 1);
    const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    h += '<option value="' + k + '"' + (i === -1 ? ' selected' : '') + '>'
       + d.getFullYear() + '년 ' + (d.getMonth()+1) + '월</option>';
  }
  $('mon').innerHTML = h;
}

// 처리 끝 = 사례를 골랐고, 서류가 필요한 사례면 「서류 받음」까지
// 10호 변경 계약서 「서명 받음」 · 27호 사실 확인서 「작성 끝」이면 처리 끝 (2026-10-09 은정님)
//   15 본인부담금 — 그 달 1일부터 바뀐 계약 / 16 담당 — 그 달 안 날짜부터 바뀐 계약
//   1 결제 이름 · 8 금액 · 18 제공일자 ≠ 승인일자 — 같은 날(수업일 또는 결제일) 사실 확인서
function devDone(r){
  const ds = DEVDOC[r.child_id] || [];
  const k = $('mon').value;
  const d = r.on_date ? String(r.on_date).slice(0, 10) : '';
  if (r.item_no === 15) return ds.find(x => x.type === '변경계약' && x.key === '본인부담금:' + k + '-01') || null;
  if (r.item_no === 16) return ds.find(x => x.type === '변경계약' && x.key.indexOf('담당:' + k) === 0) || null;
  if ([1, 8, 18].includes(r.item_no) && d)
    return ds.find(x => x.type === '사실확인' && x.key.indexOf(k + ':') === 0
                        && ((x.data && (x.data.day === d || x.data.appr === d)))) || null;
  return null;
}
function isWriting(r){ return r.item_no === 41 && /작성 중/.test(String(r.detail || '')); }
function isDone(r){
  if (r.item_no === 9) return true;
  if (isWriting(r)) return true;        // 기한 전 미작성 = 작성 중 · 오류로 안 봄 (2026-10-23 은정님)
  if (r.item_no === 25) return false;   // 센터가 장을 정리하면 사라짐 (2026-10-22)
  if (isChecked(r)) return true;        // 원장 [확인] — 확인한 내용과 같을 때만 (2026-10-22)
  // 선생님 「작성 끝 · 서명 받음」은 제출 대기 — 원장 · 행정이 종이를 보고 [확인]해야 끝 (2026-10-22 은정님)
  if (isList(r)) return false;
  // 아래는 옛 처리(사례 고르기)로 끝낸 줄 — 다시 나타나지 않게 그대로 둠
  const x = RES[rkey(r)];
  if (!x || !x.case_id) return false;
  const c = CASES.find(c => c.id === x.case_id);
  if (!c) return false;
  // 특이사항 기재 사례 — 기록지 그 회차 특이사항이 적혔으면 끝 (서류 없음)
  if (c.grp === '특이사항 기재') return noteOf(r).length > 0;
  return !c.need_doc || x.doc_done;
}
function noteOf(r){
  return NOTES[r.child_id + '|' + (r.on_date ? String(r.on_date).slice(0,10) : '*')] || [];
}

async function run(){
  RC_TYPING = false;
  const k = $('mon').value;
  $('body').innerHTML = '<div class="load">' + monNo(k) + '월 기록지를 점검하고 있습니다…</div>';
  const [a, b, c, lg, st] = await Promise.all([
    sb.rpc('nl_record_check', { p_month: k }),
    sb.from('nl_rc_cases').select('id, grp, name, need_doc, sort_no').eq('active', true).order('sort_no'),
    sb.from('nl_rc_results').select('child_id, item_no, item_key, case_id, doc_done, memo, checked_at, checked_by, checked_detail').eq('month_key', k),
    // 치료지원 결제 빨강 · 미작성 (발달재활 · 치료지원 · 센터) — 2026-10-09
    sb.rpc('nl_log_check', { p_month: k }),
    isAdmin() ? sb.rpc('nl_rc_stats', { p_year: Number(k.slice(0, 4)) }) : Promise.resolve({ data: null })
  ]);
  if (a.error) {
    $('body').innerHTML = '<div class="err">점검하지 못했습니다.\n' + esc(a.error.message) + '</div>';
    return;
  }
  ROWS = (a.data || []).map(r => Object.assign({}, r, { item_no: Number(r.item_no), kind: '발달재활' }));
  LOGERR = lg && lg.error ? lg.error.message : '';
  ((lg && lg.data) || []).forEach(r => ROWS.push(Object.assign({}, r, { item_no: Number(r.item_no) })));
  STATS = (st && !st.error) ? (st.data || null) : null;
  if (!isAdmin()) ROWS = ROWS.filter(r => Number(r.therapist_id) === Number(ME.id));
  CASES = b.data || [];
  RES = {};
  (c.data || []).forEach(x => { RES[x.child_id + '|' + x.item_no + '|' + (x.item_key || '')] = x; });

  // 발달 기록지에서 끝낸 서식 — 결과에 나온 아동만 (2026-10-09)
  DEVDOC = {};
  try {
    const kids0 = [...new Set(ROWS.map(r => r.child_id).filter(Boolean))];
    for (let i = 0; i < kids0.length; i += 200) {
      const { data, error } = await sb.from('nl_dev_docs').select('child_id, doc_type, doc_key, data, done_on')
        .in('child_id', kids0.slice(i, i + 200)).in('doc_type', ['변경계약', '사실확인']).eq('done', true);
      if (error) throw error;
      (data || []).forEach(x => { (DEVDOC[x.child_id] = DEVDOC[x.child_id] || []).push({ type: x.doc_type, key: x.doc_key, data: x.data || {}, done_on: x.done_on }); });
    }
  } catch (e) { DEVDOC = {}; }

  // 이름 — 결과에 나온 아동 · 선생님만
  KIDNM = {}; THNM = {};
  const _x = rcIds(ROWS);         // 글 속 다른 아동 · 선생님 번호도 함께 (2026-10-02)
  const kids = [...new Set(ROWS.map(r => r.child_id).filter(Boolean).concat(_x.kid))];
  const ths  = [...new Set(ROWS.map(r => r.therapist_id).filter(Boolean).concat(_x.th))];
  try {
    if (kids.length) {
      const { data } = await sb.from('nl_children').select('id, name').in('id', kids);
      (data || []).forEach(x => { KIDNM[x.id] = x.name || ''; });
    }
    if (ths.length) {
      const { data } = await sb.from('nl_therapists').select('id, name').in('id', ths);
      (data || []).forEach(x => { THNM[x.id] = x.name || ''; });
    }
  } catch (e) {}
  // 발달 기록지 특이사항 — 결과에 나온 아동만
  NOTES = {};
  try {
    if (kids.length) {
      const { data: lgs } = await sb.from('nl_session_logs').select('id, child_id')
        .eq('support_type_id', 2).eq('month_key', k).in('child_id', kids);
      const ids = (lgs || []).map(x => x.id), cof = {};
      (lgs || []).forEach(x => { cof[x.id] = x.child_id; });
      for (let i = 0; i < ids.length; i += 200) {
        const { data: its } = await sb.from('nl_session_items')
          .select('log_id, seq_no, service_date, staff_memo').in('log_id', ids.slice(i, i + 200));
        (its || []).forEach(x => {
          const t = String(x.staff_memo || '').trim();
          if (!t) return;
          const cid = cof[x.log_id], line = x.seq_no + '회째: ' + t;
          if (x.service_date) (NOTES[cid + '|' + String(x.service_date).slice(0,10)] = NOTES[cid + '|' + String(x.service_date).slice(0,10)] || []).push(line);
          (NOTES[cid + '|*'] = NOTES[cid + '|*'] || []).push(line);
        });
      }
    }
  } catch (e) {}
  draw();
}

//   글에서 기록지 이름 · 「고치면 사라짐」 같은 겹치는 말은 뺀다 (상태 줄이 말해 줌)
function lineText(r){
  let d = rcNamed(r, id => KIDNM[id] || '', id => THNM[id] || '');
  d = d.replace(/\s*\((?:누가기록지에서 )?그 회를 고치면 사라짐\)\s*$/, '');
  if (r.item_no === 41 && r.kind) d = d.replace(new RegExp('^' + r.kind + '\\s*·\\s*'), '');
  if (r.item_no >= 31 && r.item_no <= 34) d = d.replace(/\s*—\s*[^—]+$/, '');   // 끝의 「— 결제가 이름」은 딱지와 같음
  return d;
}
function lineHtml(r, i){

//   [확인] + 메모(칸을 벗어나면 저절로 저장) · 메모는 선생님 화면에도 보임

    STATS.forEach(s => {
      const t2 = Number(s.therapist_id || 0);
      const o = byTh[t2] || (byTh[t2] = { cnt: 0, open: 0 });
      o.cnt += s.cnt; o.open += s.open_cnt;
    });
    h += '<div class="card"><div class="thhd">자주 생기는 점검 — ' + yr + '년 누적<span class="n">매일 밤 9시 10분에 기록 · 고치면 「고친 날」이 남음</span></div>';
    if (!items.length) h += '<div style="font-size:13px;color:var(--dim);">아직 쌓인 기록이 없습니다.</div>';
    else {
      h += '<table><tr><th>기록지</th><th>항목</th><th style="text-align:right;">생긴 수</th><th style="text-align:right;">고친 수</th><th style="text-align:right;">남음</th><th style="text-align:right;">고치기까지 (평균)</th></tr>'
         + items.map(o => { const it = ITEM[o.no] || ['?','g0'];
             return '<tr><td>' + esc(o.kind) + '</td><td><span class="it ' + it[1] + '">' + esc(it[0]) + '</span></td>'
               + '<td style="text-align:right;">' + o.cnt + '</td><td style="text-align:right;">' + o.fixed + '</td>'
               + '<td style="text-align:right;">' + o.open + '</td>'
               + '<td style="text-align:right;">' + (o.dn ? (o.dsum / o.dn).toFixed(1) + '일' : '—') + '</td></tr>'; }).join('')
         + '</table>'
         + '<div style="margin-top:10px;font-size:13px;"><b>선생님별</b> · '
         + Object.keys(byTh).map(Number).sort((x, y) => byTh[y].cnt - byTh[x].cnt)
             .map(t2 => (t2 ? t2 + '번 ' + esc(THNM[t2] || '') : '담당 미상') + ' ' + byTh[t2].cnt + '건' + (byTh[t2].open ? ' (남음 ' + byTh[t2].open + ')' : '')).join(' · ')
         + '</div>';
    }
    h += '</div>';
  }

  h += '<div class="legend">발달재활 — 결제 시각은 바우처 「결제일시」, 수업 시작은 시간표 회기 시각입니다. '
     + '선생님이 발달 기록지에서 사실 확인서(27호)를 「작성 끝」, 변경 계약서(10호)를 「서명 받음」으로 하면 「제출 대기」가 됩니다. '
     + '종이 서류를 보고 [확인]을 누르면 「남은 것」에서 빠집니다. 메모는 칸을 벗어나면 저장되고 선생님 화면에도 보입니다. '
     + '기록지 점검(10~14 · 18)과 치료지원(31~34) · 미작성(41)은 목록만 — 선생님이 기록지를 고치면 저절로 사라집니다. '
     + '미작성은 치료지원 한 달 세 회, 발달재활 · 센터는 수업한 회수만큼이며 기한은 다음 달 15일입니다.</div>';
  $('body').innerHTML = h;

  const sr = $('sendRc');
  if (sr) sr.onclick = async () => {
    if (!confirm(monNo(k) + '월 발달 기록지에서 고칠 것을 담당 선생님마다 알림으로 보낼까요?\n(같은 달은 한 번만 갑니다)')) return;
    sr.disabled = true; sr.textContent = '보내는 중…';
    const { data, error } = await sb.rpc('nl_send_rc_alerts', { p_month: k });
    sr.disabled = false; sr.textContent = '발달 기록지 · 선생님께 알림';
    $('sendRcMsg').textContent = error ? '보내지 못했습니다 — ' + error.message : String(data || '');
    $('sendRcMsg').style.color = error ? 'var(--coralT)' : 'var(--sage)';
  };
  const sl = $('sendLog');
  if (sl) sl.onclick = async () => {
    if (!confirm(monNo(k) + '월 기록지 미작성을 담당 선생님께 알림으로 보낼까요?\n(선생님 화면 🔔 · 같은 달은 한 번만 갑니다)')) return;
    sl.disabled = true; sl.textContent = '보내는 중…';
    const { data, error } = await sb.rpc('nl_send_log_alerts', { p_month: k });
    sl.disabled = false; sl.textContent = '미작성 · 선생님께 알림';
    $('sendLogMsg').textContent = error ? '보내지 못했습니다 — ' + error.message : String(data || '');
    $('sendLogMsg').style.color = error ? 'var(--coralT)' : 'var(--sage)';
  };
  document.querySelectorAll('#kindTabs button').forEach(b => {
    b.onclick = () => {
      if (b.dataset.k) KINDV = b.dataset.k;
      if (b.dataset.v) VIEW = b.dataset.v;
      if (b.dataset.g) GROUPV = b.dataset.g;
      draw();
    };
  });
  document.querySelectorAll('.ovr').forEach(tr => {
    tr.onclick = () => { const tid = Number(tr.dataset.t); THF = (THF === tid ? 0 : tid); draw(); };
  });
  const ta = $('thAll'); if (ta) ta.onclick = () => { THF = 0; draw(); };
  document.querySelectorAll('.smsCopy').forEach(b => b.onclick = async (e) => {
    e.stopPropagation();   // 줄 누르기(선생님 거르기)로 번지지 않게
    const tid = Number(b.dataset.t), txt = smsText(tid);
    const ok = await copyText(txt);
    const m = document.querySelector('.smsMsg[data-t="' + tid + '"]');
    if (ok) { if (m) { m.textContent = '✓ 복사됨'; setTimeout(() => { m.textContent = ''; }, 2500); } }
    else { prompt('복사가 막혀 있습니다. 아래 글을 Ctrl+C 로 복사해 주세요.', txt); }
  });
  document.querySelectorAll('.rc .rcMemo').forEach(el => {
    el.addEventListener('change', () => saveMemo(el.closest('.rc'), el));
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
  });
}

// ── 원장 [확인] (2026-10-22 은정님) ──
//   특이사항을 보고 맞으면 [확인] → 그 줄은 「남은 것」에서 사라짐
//   확인한 내용(detail)과 지금 내용이 같을 때만 숨김 — 기록지를 또 고쳐 내용이 바뀌면 다시 나타남
function isChecked(r){
  const x = RES[rkey(r)];
  return !!(x && x.checked_at && String(x.checked_detail || '') === String(r.detail || ''));
}
function okHtml(r, i){
  const x = RES[rkey(r)] || {};
  if (isChecked(r)) {
    const d = String(x.checked_at).slice(5, 10).replace('-', '/');
    return '<div class="okline"><span class="okdone">✓ 확인함 · ' + esc(d) + '</span>'
      + (isAdmin() ? ' <button type="button" class="rcUnok" data-i="' + i + '">확인 취소</button>' : '') + '</div>';
  }
  return isAdmin() ? '<div class="okline"><button type="button" class="rcOk" data-i="' + i + '">확인</button></div>' : '';
}
async function setChecked(i, on, btn){
  const r = ROWS[Number(i)]; if (!r) return;
  if (btn) { btn.disabled = true; btn.textContent = on ? '확인 중…' : '취소 중…'; }
  const row = { child_id: r.child_id, month_key: $('mon').value, item_no: r.item_no, item_key: r.item_key || '',
                checked_at: on ? new Date().toISOString() : null, checked_by: on ? ME.id : null,
                checked_detail: on ? String(r.detail || '') : null,
                updated_by: ME.id, updated_at: new Date().toISOString() };
  const { data, error } = await sb.from('nl_rc_results')
    .upsert(row, { onConflict: 'child_id,month_key,item_no,item_key' }).select();
  if (error || !data || !data.length) {
    if (btn) { btn.disabled = false; btn.textContent = on ? '확인' : '확인 취소'; }
    alert('저장하지 못했습니다.\n' + (error ? error.message : '돌려받은 줄이 없습니다.'));
    return;
  }
  RES[rkey(r)] = data[0];
  const y = window.scrollY; draw(); window.scrollTo(0, y);
}
document.addEventListener('click', e => {
  const b = e.target && e.target.closest && e.target.closest('.rcOk, .rcUnok');
  if (!b || !isAdmin()) return;
  setChecked(b.dataset.i, b.classList.contains('rcOk'), b);
});

async function saveMemo(box, el){
  const rs = String(box.dataset.is || box.dataset.i || '').split(',').map(Number).map(i => ROWS[i]).filter(Boolean);
  if (!rs.length) return;
  const msg = box.querySelector('.rcMsg');
  const memo = el.value.trim() || null;
  const old = [...new Set(rs.map(r => (RES[rkey(r)] || {}).memo).filter(Boolean))].join(' / ') || null;
  if (memo === old) { RC_TYPING = false; return; }
  el.disabled = true; msg.textContent = '저장 중…'; msg.className = 'rcMsg';
  const now = new Date().toISOString();
  const rows = rs.map(r => ({ child_id: r.child_id, month_key: $('mon').value, item_no: r.item_no,
                              item_key: r.item_key || '', memo: memo, updated_by: ME.id, updated_at: now }));
  const { data, error } = await sb.from('nl_rc_results')
    .upsert(rows, { onConflict: 'child_id,month_key,item_no,item_key' }).select();
  el.disabled = false;
  if (error || !data || data.length !== rows.length) {
    msg.textContent = '저장 못 함'; msg.className = 'rcMsg bad';
    alert('메모를 저장하지 못했습니다.\n' + (error ? error.message : '돌려받은 줄 수가 맞지 않습니다.'));
    return;
  }
  data.forEach(x => { RES[x.child_id + '|' + x.item_no + '|' + (x.item_key || '')] = x; });
  RC_TYPING = false;
  msg.textContent = '✓ 저장됨'; msg.className = 'rcMsg good';
  setTimeout(() => { if (msg.textContent === '✓ 저장됨') msg.textContent = ''; }, 2000);
}
// 메모를 적다 다른 칸을 누르지 않고 나가면 묻기
window.addEventListener('beforeunload', e => {
  const el = document.activeElement;
  if (!el || !el.classList || !el.classList.contains('rcMemo')) return;
  const box = el.closest('.rc'); if (!box) return;
  const rs = String(box.dataset.is || '').split(',').map(Number).map(i => ROWS[i]).filter(Boolean);
  const old = [...new Set(rs.map(r => (RES[rkey(r)] || {}).memo).filter(Boolean))].join(' / ') || null;
  if (rs.length && (el.value.trim() || null) !== old) { e.preventDefault(); e.returnValue = ''; }
});

$('run').onclick = run;
// 다른 탭(기록지)에서 고치고 돌아오면 저절로 다시 점검 (2026-10-22 은정님 — F5 를 눌러야만 반영되던 것)
//   처리 결과 칸에 적는 중이면 다시 그리지 않음 (적은 글이 지워지지 않게)
let RC_TYPING = false, RC_HID = 0, RC_RUNNING = false;
document.addEventListener('input', e => { if (e.target && e.target.closest && e.target.closest('#body')) RC_TYPING = true; });
document.addEventListener('change', e => { if (e.target && e.target.closest && e.target.closest('#body')) RC_TYPING = true; });
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { RC_HID = Date.now(); return; }
  if (!RC_HID || Date.now() - RC_HID < 2000 || RC_TYPING || RC_RUNNING || !ME) return;
  RC_RUNNING = true;
  const y = window.scrollY;
  try { await run(); window.scrollTo(0, y); } finally { RC_RUNNING = false; }
});
$('mon').onchange = run;
$('pdf').onclick = () => window.print();
$('kidQ').addEventListener('input', () => { if (ROWS.length || $('body').querySelector('.sum')) draw(); });
$('home').onclick = () => { location.href = 'index.html'; };

(async () => {
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { location.replace('index.html'); return; }
  const user = data.session.user;
  const { data: me, error } = await sb.from('nl_therapists')
    .select('id, name, role').eq('login_email', user.email.toLowerCase()).maybeSingle();
  if (error || !me) {
    $('body').innerHTML = '<div class="err">직원 표에 이 이메일이 없습니다.\n관리자에게 문의하세요.</div>';
    return;
  }
  nlKeep(me.id);
  ME = me;
  const id = Number(me.id);
  if (!(ADMIN.indexOf(id) >= 0 || me.role === '치료사')) {   // 2026-10-22 역할로
    $('body').innerHTML = '<div class="err">이 화면을 볼 권한이 없습니다.</div>';
    return;
  }
  $('who').textContent = me.name + ' 님으로 로그인됨';
  fillMon();
  run();
})();
</script>
